<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta http-equiv="cache-control" content="no-store"><title>Maison de Veux — Model Access</title>
<style>:root{--bg:#0d0a07;--panel:#17110c;--line:#4b3a27;--gold:#d1ab69;--cream:#f1e5cf;--muted:#998b79;--danger:#ef8c7d;--ok:#9bc7a5}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 30%,#1b140e 0,#0d0a07 55%,#070605 100%);color:var(--cream);display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);border:1px solid var(--line);background:rgba(23,17,12,.96);box-shadow:0 30px 100px rgba(0,0,0,.45)}.head{padding:34px 36px 28px;border-bottom:1px solid var(--line)}.eyebrow{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}.head h1{font-family:Georgia,serif;font-size:43px;font-weight:400;margin:10px 0 8px}.head em{color:var(--gold);font-weight:400}.sub{color:#b6a894;font-size:14px}.body{padding:30px 36px 34px}label{display:block;font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:#ad9d88;margin:16px 0 7px}input{width:100%;background:#090806;border:1px solid #57432d;border-radius:9px;padding:14px 15px;color:var(--cream);font-size:15px;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(209,171,105,.12)}button.primary{width:100%;margin-top:24px;border:0;border-radius:9px;padding:15px;background:var(--gold);color:#15100b;font:700 10px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}.links{display:flex;justify-content:space-between;gap:14px;margin-top:17px}.link{border:0;background:none;color:#aa9b87;text-decoration:underline;text-underline-offset:3px;font-size:12px;cursor:pointer}.notice{min-height:21px;margin-top:17px;font-size:13px;line-height:1.45}.error{color:var(--danger)}.ok{color:var(--ok)}.foot{border-top:1px solid var(--line);padding:20px 36px;font:9px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#776b5d}.mode-note{margin:0 0 8px;color:#b8aa97;font-size:13px;line-height:1.5}.badge{position:fixed;right:14px;bottom:12px;border:1px solid #5a462d;border-radius:20px;padding:8px 11px;color:var(--gold);font:9px ui-monospace,monospace;letter-spacing:.1em}@media(max-width:600px){body{padding:0}.card{min-height:100vh;width:100%;border:0;border-radius:0}.head,.body{padding-left:24px;padding-right:24px}}</style></head><body><main class="card"><section class="head"><div class="eyebrow">Maison de Veux · Secure Model Access</div><h1 id="title">Model <em>Sign In</em></h1><div class="sub" id="subtitle">One clean access point for your Model Portal.</div></section><section class="body"><div id="formHost"></div><div id="notice" class="notice"></div></section><footer class="foot">Single Auth Authority · No legacy reset session · 16.12.95</footer></main><div class="badge">MODEL ACCESS 16.12.95</div>
<script>(function(){'use strict';const KEY='sb-mogyngdhmzbjmcdqeoxu-auth-token',API='/api/model/password',q=new URLSearchParams(location.search);let mode=q.get('mode')||'login';const host=document.getElementById('formHost'),notice=document.getElementById('notice'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function clearAuth(){try{for(const store of [localStorage,sessionStorage])Object.keys(store).filter(k=>k===KEY||/^sb-|supabase|veux-model/i.test(k)).forEach(k=>store.removeItem(k));}catch(e){}}function setNotice(m,type='error'){notice.className='notice '+type;notice.textContent=m||''}async function post(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-store'},cache:'no-store',body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||d.message||'Request failed.');return d}function saveFreshSession(s){clearAuth();if(!s?.access_token||!s?.refresh_token)throw new Error('Fresh login session was not returned.');localStorage.setItem(KEY,JSON.stringify(s));}function go(m,extra={}){const p=new URLSearchParams(extra);p.set('mode',m);location.href='/portal/access?'+p.toString()}function render(){setNotice('');const email=esc(q.get('email')||'');if(mode==='temp'){title.innerHTML='Set <em>Permanent Password</em>';subtitle.textContent='Use the temporary password issued by your agency. No recovery session is used.';host.innerHTML=`<p class="mode-note">Temporary-password setup verifies your current credential directly, saves the new password server-side, then requires one fresh sign-in.</p><form id="f"><label>Model Portal Email</label><input name="email" type="email" value="${email}" autocomplete="username" required><label>Temporary Password</label><input name="current" type="password" autocomplete="current-password" required><label>New Permanent Password</label><input name="next" type="password" autocomplete="new-password" minlength="10" required><label>Confirm New Password</label><input name="confirm" type="password" autocomplete="new-password" minlength="10" required><button class="primary">Save Permanent Password</button></form><div class="links"><button class="link" id="back">Back to sign in</button><button class="link" id="forgot">Forgot password?</button></div>`;document.getElementById('back').onclick=()=>go('login',{email:q.get('email')||''});document.getElementById('forgot').onclick=()=>go('forgot',{email:q.get('email')||''});document.getElementById('f').onsubmit=async e=>{e.preventDefault();clearAuth();const fd=new FormData(e.currentTarget),next=fd.get('next');if(next!==fd.get('confirm'))return setNotice('The new passwords do not match.');try{const d=await post({action:'change_current',email:fd.get('email'),current_password:fd.get('current'),new_password:next});setNotice('Password saved and verified. Sign in once with your new password.','ok');setTimeout(()=>go('login',{email:d.email||fd.get('email'),changed:'1'}),700)}catch(err){setNotice(err.message)}};return}if(mode==='forgot'){title.innerHTML='Reset <em>Password</em>';subtitle.textContent='Request one secure recovery link.';host.innerHTML=`<form id="f"><label>Model Portal Email</label><input name="email" type="email" value="${email}" autocomplete="username" required><button class="primary">Send Secure Reset Link</button></form><div class="links"><button class="link" id="back">Back to sign in</button></div>`;document.getElementById('back').onclick=()=>go('login',{email:q.get('email')||''});document.getElementById('f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);try{const d=await post({action:'request_recovery',email:fd.get('email')});setNotice(d.message||'If the account exists, a secure reset link is on the way.','ok')}catch(err){setNotice(err.message)}};return}if(mode==='recovery'){title.innerHTML='Create <em>New Password</em>';subtitle.textContent='Secure recovery link verified by CAVYRE.';const token=q.get('recovery_token')||'';host.innerHTML=`<form id="f"><label>New Password</label><input name="next" type="password" autocomplete="new-password" minlength="10" required><label>Confirm New Password</label><input name="confirm" type="password" autocomplete="new-password" minlength="10" required><button class="primary">Save New Password</button></form>`;document.getElementById('f').onsubmit=async e=>{e.preventDefault();clearAuth();const fd=new FormData(e.currentTarget),next=fd.get('next');if(next!==fd.get('confirm'))return setNotice('The new passwords do not match.');try{const d=await post({action:'recover',recovery_token:token,new_password:next});setNotice('Password saved and verified. Sign in with your new password.','ok');setTimeout(()=>go('login',{email:d.email||'',changed:'1'}),700)}catch(err){setNotice(err.message)}};return}mode='login';title.innerHTML='Model <em>Sign In</em>';subtitle.textContent='Use your permanent password, or your agency-issued temporary password.';host.innerHTML=`<form id="f"><label>Model Portal Email</label><input name="email" type="email" value="${email}" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button class="primary">Enter Model Portal</button></form><div class="links"><button class="link" id="temp">I have a temporary password</button><button class="link" id="forgot">Forgot password?</button></div>`;document.getElementById('temp').onclick=()=>go('temp',{email:document.querySelector('[name=email]').value});document.getElementById('forgot').onclick=()=>go('forgot',{email:document.querySelector('[name=email]').value});document.getElementById('f').onsubmit=async e=>{e.preventDefault();clearAuth();const fd=new FormData(e.currentTarget);try{const d=await post({action:'login',email:fd.get('email'),password:fd.get('password')});if(d.password_change_required){setNotice('Temporary password verified. Create your permanent password.','ok');return setTimeout(()=>go('temp',{email:d.email||fd.get('email')}),450)}saveFreshSession(d.session);setNotice('Signed in. Opening your portal…','ok');setTimeout(()=>location.replace('/portal/home'),350)}catch(err){setNotice(err.message)}};if(q.get('changed')==='1')setNotice('Password saved. Sign in with your new permanent password.','ok')}clearAuth();render()})();</script></body></html>
