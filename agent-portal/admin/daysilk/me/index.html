.hq-flow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:16px 18px 14px;border:1px solid var(--line);border-top:3px solid var(--fc);border-radius:10px;background:var(--surface);min-width:0}
.hq-flow:hover{border-color:var(--fc)}
.hq-fh{display:flex;align-items:center;gap:10px}
.hq-fh .xi{color:var(--fc)}
.hq-fh b{font-family:var(--serif);font-weight:500;font-size:19px}
.hq-fq{margin-left:auto;font-size:12px;color:var(--muted)}
.hq-fq em{font-style:normal;color:var(--warn);font-weight:700}
.hq-fb{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hq-fv{font-family:var(--serif);font-size:46px;line-height:.9}
.hq-fv small{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px;letter-spacing:.06em}
.hq-spark{width:120px;height:30px;flex:none}
.hq-flow ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.hq-flow li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.hq-flow li span{color:var(--muted)}
.hq-flow li b{font-weight:600;text-align:right}
.hq-fgo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fc)}

/* Day bar */
.hq-day{margin-bottom:14px}
.hq-leg{display:flex;gap:12px;margin-left:8px}
.hq-leg i{font-style:normal;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.hq-leg i::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--fc)}
.hq-bar{position:relative;height:66px;border-radius:8px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/19 - 1px),var(--line) calc(100%/19 - 1px),var(--line) calc(100%/19));margin-top:4px}
.hq-hr{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.hq-seg{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;top:20px;height:38px;border-radius:5px;border-left:3px solid var(--fc);background:color-mix(in srgb,var(--fc) 22%,var(--surface));padding:4px 6px;overflow:hidden;font-size:11px;line-height:1.25;color:var(--ink)}
.hq-seg span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hq-seg:hover{background:color-mix(in srgb,var(--fc) 38%,var(--surface));z-index:2}
.hq-seg.done{opacity:.5}
.hq-now{position:absolute;top:14px;bottom:2px;width:2px;background:var(--warn);border-radius:2px;z-index:3}
.hq-now::before{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn)}

/* Grid, queue, links */
.hq-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.hq-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.hq-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hq-chips button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--ink)}
.hq-chips button span{font-family:var(--mono);font-weight:400;color:var(--muted);margin-left:3px}
.hq-chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hq-chips button[aria-pressed="true"] span{color:inherit;opacity:.7}
.hq-qlist{display:flex;flex-direction:column}
.hq-q{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 6px 10px 8px;border-top:1px solid var(--line);position:relative}
.hq-q:first-child{border-top:0}
.hq-q.sev-critical{background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 12%,transparent),transparent 60%)}
.hq-q.sev-critical::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--warn);border-radius:2px}
.hq-dot{width:9px;height:9px;border-radius:50%;background:var(--fc)}
.hq-qt{min-width:0}
.hq-qt b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hq-qt small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hq-sev{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.sev-critical .hq-sev{color:var(--warn);font-weight:600}.sev-high .hq-sev{color:var(--accent)}.sev-win .hq-sev{color:var(--ok)}
.hq-ftag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fc);border:1px solid color-mix(in srgb,var(--fc) 45%,transparent);border-radius:4px;padding:1px 6px}
.hq-acts{display:flex;gap:5px}
.hq-more{margin-top:8px;font-size:13px}
.hq-link{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.hq-link:first-of-type{border-top:0}
.hq-lp{display:flex;align-items:center;gap:3px}
.hq-lp i{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fc);border:1px solid color-mix(in srgb,var(--fc) 45%,transparent);border-radius:4px;padding:2px 5px;min-width:44px;text-align:center}
.hq-lp .xi{color:var(--muted)}
.hq-link b{display:block;font-size:13.5px;font-weight:600}
.hq-link small{display:block;font-size:12px;color:var(--muted)}
.hq-up .xu:last-child{border-bottom:0}
.hq-desks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:start}
.hq-desk{border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px;background:var(--surface);border-top:3px solid var(--fc,var(--line))}
.hq-dh{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;margin-bottom:10px}
.hq-dh .xi{grid-row:span 2;color:var(--fc,var(--gold-x))}
.hq-dh b{font-family:var(--serif);font-weight:500;font-size:17px}
.hq-dh small{font-size:12px;color:var(--muted)}
.hq-dp{display:flex;flex-direction:column}
.hq-dp button,.hq-dp a{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:6px 4px;border-top:1px solid var(--line);font-size:13px}
.hq-dp button:hover,.hq-dp a:hover{color:var(--fc,var(--gold-x))}
.hq-dp .xi{color:var(--muted)}

/* KPIs, lanes, mini tasks */
.hq-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.hq-kpi{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:13px 14px;min-width:0;border-top:3px solid var(--fc,var(--line))}
.hq-kpi .lbl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hq-kpi b{display:block;font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.15;margin:4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hq-kpi b small{font-family:var(--sans);font-size:12px;color:var(--muted)}
.hq-kpi small{display:block;font-size:12px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hq-kpi .progress{margin:0}
.hq-kpi b small{display:inline;margin:0 0 0 4px;font-size:13px}
.hq-lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hq-lane{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hq-lh{display:flex;align-items:center;gap:10px}
.hq-lh b{font-family:var(--serif);font-weight:500;font-size:17px}
.hq-lh .ib{margin-left:auto}
.hq-lane>p{margin:0;font-size:13px}
.hq-lane>small{font-size:12px}
.hq-mts{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:4px}
.hq-mt{display:grid;grid-template-columns:18px minmax(0,1fr);gap:4px 8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.hq-mt span{line-height:1.35}
.hq-mt .chip{grid-column:2;justify-self:start;font-size:11px}
.hq-mt.done span{text-decoration:line-through;opacity:.55}
.hq-lane .linkbtn{font-size:12.5px;margin-top:auto}
.hq-tbl{width:100%;border-collapse:collapse}
.hq-tbl td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:middle}
.hq-tbl tr:first-child td{border-top:0}
.hq-tbl td:last-child{text-align:right;white-space:nowrap}
.hq-tbl b{display:block;font-size:13px;font-weight:600}.hq-tbl small{display:block;font-size:12px;color:var(--muted)}
.hq-wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:14px}
.hq-wk span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hq-wk b{display:block;font-family:var(--serif);font-weight:500;font-size:22px;margin:2px 0 6px}
.hq-wk b small{font-family:var(--sans);font-size:12px;color:var(--muted)}

/* Health */
.hq-sess{margin:0 0 6px}.hq-sess b{display:block;font-family:var(--serif);font-weight:500;font-size:22px}.hq-sess small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.hq-2c{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;margin-bottom:12px}
.hq-meals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hq-meals>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.hq-meals .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hq-meals p{margin:4px 0 2px;font-size:13px}
.hq-meals small{font-size:11.5px;color:var(--f-health)}
.hq-heat{display:grid;grid-template-columns:76px repeat(7,minmax(0,1fr));gap:5px;align-items:center}
.hq-heat .hd{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center}
.hq-heat .hd.cur{color:var(--ink);font-weight:700}
.hq-heat .hl{font-size:12px;color:var(--muted)}
.hq-heat .hc{height:20px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.hq-heat .hc.on{background:var(--f-health);border-color:var(--f-health)}
.hq-heat .hc.miss{background:transparent;border-style:dashed}

/* Vera drawer */
#vera{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:45;background:var(--surface);color:var(--ink);border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;animation:vrIn .22s ease-out}
@keyframes vrIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.vr-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:radial-gradient(140% 200% at 100% 0%,#33271D,#14100D 60%);color:#F1E8DD}
.vr-h b{display:block;font-family:var(--serif);font-weight:500;font-size:22px;line-height:1}
.vr-h small{display:block;font-size:11.5px;color:#BCAE9F;margin-top:3px}
.vr-h .ib{margin-left:auto;color:#F1E8DD;border-color:rgba(241,232,221,.2)}
.vr-tabs{display:flex;gap:6px;padding:12px 18px 0;flex-wrap:wrap}
.vr-tabs button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
.vr-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vr-ask{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}
.vr-ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 10px;font-size:14px}
.vr-body{flex:1;overflow-y:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.vr-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.vr-card b{font-family:var(--serif);font-weight:500;font-size:18px}
.vr-card p{margin:6px 0 0;font-size:13.5px}
.vr-sc{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vr-sc span{font-size:12px;border:1px solid color-mix(in srgb,var(--fc) 50%,transparent);color:var(--fc);border-radius:999px;padding:2px 10px}
.vr-sc b{font-family:var(--mono);font-size:12px;font-weight:600;margin-left:4px}
.vr-props{display:flex;flex-direction:column;gap:10px}
.vr-p{border:1px solid var(--line);border-left:3px solid var(--gold-x);border-radius:9px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px}
.vr-p.info{border-left-color:var(--line)}
.vr-pt b{display:block;font-size:14px;font-weight:600}
.vr-pt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.vr-pt ul{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.vr-pt li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.vr-pt li em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.vr-pa{display:flex;gap:6px}
.vr-all{align-self:flex-start}
.vr-q .hq-q{grid-template-columns:10px minmax(0,1fr) auto}
.vr-q .hq-ftag{display:none}
.vr-q .hq-acts{grid-column:2/-1}
.vr-foot{margin:0;padding:10px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

/* Sign-in, Cavyre-style split */
#auth{padding:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);place-items:stretch;background:#0B0907}
.auth-brand{position:relative;display:flex;flex-direction:column;justify-content:center;padding:56px clamp(28px,6vw,96px);background:radial-gradient(90% 70% at 30% 40%,#2B2018 0%,#110D0A 60%,#0B0907 100%);border-right:1px solid #2A221C;overflow:hidden}
.auth-brand::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(201,164,106,.035) 0 1px,transparent 1px 90px);pointer-events:none}
.auth-word{font-family:var(--serif);font-weight:400;font-size:clamp(56px,8vw,110px);letter-spacing:.32em;line-height:1;color:#F3EADF;margin:0}
.auth-sub{font-family:var(--mono);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-x);margin:18px 0 0}
.auth-rule{width:74px;height:1px;background:var(--gold-x);margin:36px 0}
.auth-kick{font-family:var(--serif);font-size:clamp(22px,2.4vw,30px);letter-spacing:.18em;text-transform:uppercase;color:#EDE3D6;margin:0}
.auth-tag{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#A99A8B;margin:10px 0 0}
.auth-pillars{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:72px;border-top:1px solid #2A221C;padding-top:22px}
.auth-pillars div{padding-right:14px}
.auth-pillars div+div{border-left:1px solid #2A221C;padding-left:16px}
.auth-pillars .xi{color:var(--gold-x);width:22px;height:22px}
.auth-pillars b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#F1E8DD;margin:10px 0 4px}
.auth-pillars small{display:block;font-size:12px;color:#A99A8B;line-height:1.5}
.auth-side{display:grid;place-items:center;padding:40px 24px;background:#0E0B09}
#auth .authbox{max-width:400px;text-align:left}
.auth-mark{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;border:1px solid var(--gold-x);margin:0 0 16px;font-family:var(--serif);font-size:22px;color:#F1E8DD;box-shadow:0 0 30px rgba(201,164,106,.18)}
.authbox .auth-eye{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-x);margin:0}
#auth .authbox h1{font-family:var(--serif);font-size:34px;margin:8px 0 4px;color:#F3EADF}
#auth .authbox label{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
#auth .authbox .txt{padding:12px 12px;background:#141009;border:0;border-bottom:1px solid #3A2F26;border-radius:4px 4px 0 0}
#auth .authbox .txt:focus{border-bottom-color:var(--gold-x)}
#auth .authbox .btn.solid{padding:12px;justify-content:center;font-family:var(--mono);letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.auth-foot{margin-top:30px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#6F6257}

/* Responsive */
@media (max-width:1280px){.hq-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.hq-wk{grid-template-columns:repeat(4,minmax(0,1fr))}.hb-flows{display:none}}

const WIDGET_SRC="// The Rebuild widget for Scriptable (iPhone). Works on the home screen (small, medium, large) and the lock screen.\n// Run it once in the Scriptable app to sign in. It keeps a sign-in token in your iPhone Keychain, never your password.\nconst CFG = __CFG__;\n\n/* ---------- Look ---------- */\nconst C = {\n  bg1: new Color(\"#1A1918\"), bg2: new Color(\"#060606\"), card: new Color(\"#FFFFFF\", 0.035), line: new Color(\"#C29B5C\", 0.28),\n  ink: new Color(\"#ECE8E1\"), mute: new Color(\"#8E8A84\"), dim: new Color(\"#5C5954\"),\n  gold: new Color(\"#C29B5C\"), gold2: new Color(\"#E2C48E\"), red: new Color(\"#C4553B\"), green: new Color(\"#7D8F6A\")\n};\nconst TAG = { Body: \"#7D8F6A\", Fuel: \"#B08D57\", Personal: \"#8A8F98\", Meeting: \"#6F8AA6\", Focus: \"#C29B5C\", Travel: \"#A0785A\" };\nconst CO = { mdv: \"#C29B5C\", casa: \"#A86A4F\", cavyre: \"#6F8AA6\" };\nconst F = {\n  head: s => new Font(\"AvenirNextCondensed-Heavy\", s), bold: s => new Font(\"AvenirNextCondensed-Bold\", s),\n  semi: s => new Font(\"AvenirNextCondensed-DemiBold\", s), reg: s => new Font(\"AvenirNextCondensed-Medium\", s),\n  mono: s => Font.semiboldMonospacedSystemFont(s)\n};\n\n/* ---------- Data ---------- */\nconst KC = \"rebuild-widget-rt\", FM = FileManager.local(), CACHE = FM.joinPath(FM.documentsDirectory(), \"rebuild-widget.json\");\nasync function tok(g, b) {\n  const q = new Request(CFG.url + \"/auth/v1/token?grant_type=\" + g);\n  q.method = \"POST\"; q.headers = { apikey: CFG.key, \"Content-Type\": \"application/json\" }; q.body = JSON.stringify(b);\n  try { return await q.loadJSON() } catch (e) { return {} }\n}\nlet WHY = \"Open Scriptable and run this script once to sign in.\";\nasync function signIn() {\n  if (Keychain.contains(KC)) {\n    const r = await tok(\"refresh_token\", { refresh_token: Keychain.get(KC) });\n    if (r.access_token) { Keychain.set(KC, r.refresh_token); return r.access_token }\n  }\n  if (config.runsInWidget) { WHY = \"Open Scriptable (now), nm = now.getHours() * 60 + now.getMinutes();\nconst mins = t => t ? Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5)) : null;\nconst fmt = t => { if (!t) return \"All day\"; let h = Number(t.slice(0, 2)); const m = t.slice(3, 5), ap = h >= 12 ? \"PM\" : \"AM\"; h = h % 12 || 12; return h + (m === \"00\" ? \"\" : \":\" + m) + \" \" + ap };\nconst short = t => fmt(t).replace(\" AM\", \"a\").replace(\" PM\", \"p\");\nconst dur = n => n >= 60 ? Math.floor(n / 60) + \"h\" + (n % 60 ? \" \" + (n % 60) + \"m\" : \"\") : n + \"m\";\nconst endOf = x => mins(x.e) ?? (x.t ? mins(x.t) + 30 : 1440);\nfunction plan(d) {\n  const y = new Date(now); y.setDate(y.getDate() - 1);\n  const src = d.date === today ? d.today : d.date === iso(y) ? d.tomorrow : null;\n  if (!src) return { stale: true, list: [] };\n  const list = src.filter(x => !x.done && (x.t ? endOf(x) > nm : true));\n  const cur = list.find(x => x.t && mins(x.t) <= nm);\n  return { cur, list: list.filter(x => x !== cur && x.t) };\n}\nconst greet = () => now.getHours() < 12 ? \"Good morning\" : now.getHours() < 17 ? \"Good afternoon\" : \"Good evening\";\nconst tint = x => new Color((x.co && CO[x.co]) || TAG[x.tag] || \"#D2AE6E\");\n\n/* ---------- Drawing ---------- */\nfunction ring(pct, size, color, label, sub) {\n  const S = size * 3, c = new DrawContext(); c.size = new Size(S, S); c.opaque = false; c.respectScreenScale = false;\n  const N = 48, lit = Math.round(Math.max(0, Math.min(1, pct)) * N), r2 = S / 2 - 2, r1 = r2 - S * 0.12;\n  for (let i = 0; i < N; i++) {\n    const a = (i / N) * 2 * Math.PI - Math.PI / 2, major = i % 6 === 0, ri = major ? r1 - S * 0.03 : r1;\n    const p = new Path(); p.move(new Point(S / 2 + ri * Math.cos(a), S / 2 + ri * Math.sin(a))); p.addLine(new Point(S / 2 + r2 * Math.cos(a), S / 2 + r2 * Math.sin(a)));\n    c.addPath(p); c.setStrokeColor(i < lit ? color : new Color(\"#FFFFFF\", 0.14)); c.setLineWidth(major ? S * 0.035 : S * 0.022); c.strokePath();\n  }\n  c.setTextAlignedCenter(); c.setTextColor(C.ink); c.setFont(F.head(S * 0.3)); c.drawTextInRect(label, new Rect(0, S * 0.25, S, S * 0.38));\n  if (sub) { c.setTextColor(C.mute); c.setFont(F.semi(S * 0.11)); c.drawTextInRect(sub, new Rect(0, S * 0.62, S, S * 0.16)) }\n  return c.getImage();\n}\nfunction bar(pct, w, h, color) {\n  const W = w * 3, H = h * 3, c = new DrawContext(); c.size = new Size(W, H); c.opaque = false; c.respectScreenScale = false;\n  const p = new Path(); p.addRoundedRect(new Rect(0, 0, W, H), 2, 2); c.addPath(p); c.setFillColor(new Color(\"#FFFFFF\", 0.12)); c.fillPath();\n  const f = new Path(); f.addRoundedRect(new Rect(0, 0, Math.max(H, W * Math.max(0, Math.min(1, pct))), H), 2, 2); c.addPath(f); c.setFillColor(color); c.fillPath();\n  return c.getImage();\n}\nfunction dot(color, d) { const c = new DrawContext(); c.size = new Size(d * 3, d * 3); c.opaque = false; c.respectScreenScale = false; c.setFillColor(color); c.fillRect(new Rect(d * 0.6, d * 0.6, d * 1.8, d * 1.8)); return c.getImage() }\n\n/* ---------- Building blocks ---------- */\nfunction T(s, t, font, color, lines) { const x = s.addText(String(t)); x.font = font; x.textColor = color; x.lineLimit = lines || 1; x.minimumScaleFactor = 0.75; return x }\nfunction H(s, sp) { const x = s.addStack(); x.layoutHorizontally(); x.centerAlignContent(); if (sp != null) x.spacing = sp; return x }\nfunction V(s, sp) { const x = s.addStack(); x.layoutVertically(); if (sp != null) x.spacing = sp; return x }\nfunction img(s, image, w, h) { const x = s.addImage(image); x.imageSize = new Size(w, h || w); return x }\nfunction sym(s, name, size, color) { const x = s.addImage(SFSymbol.named(name).image); x.imageSize = new Size(size, size); x.tintColor = color; return x }\nfunction pill(s, symbol, text, color) {\n  const p = H(s, 3); p.backgroundColor = new Color(color.hex, 0.14); p.cornerRadius = 3; p.borderColor = new Color(color.hex, 0.45); p.borderWidth = 1; p.setPadding(2, 6, 2, 6);\n  sym(p, symbol, 9, color); T(p, text, F.bold(12), color); return p;\n}\nfunction kicker(s, text, color) { const x = T(s, text.toUpperCase(), F.mono(9), color || C.mute); return x }\nfunction nowBlock(s, cur, nxt, width, big) {\n  if (cur) {\n    const st = mins(cur.t), en = endOf(cur), left = Math.max(0, en - nm);\n    const k = H(s, 5); img(k, dot(tint(cur), 6), 6); kicker(k, \"Now · \" + short(cur.t) + (cur.e ? \"–\" + short(cur.e) : \"\"), C.gold);\n    s.addSpacer(2); T(s, cur.title.toUpperCase(), F.head(big ? 24 : 17), C.ink, 2); s.addSpacer(6);\n    img(s, bar((nm - st) / Math.max(1, en - st), width, 3, C.gold), width, 3); s.addSpacer(5);\n    T(s, (dur(left) + \" left\" + (nxt ? \"  /  then \" + nxt.title : \"\")).toUpperCase(), F.semi(10.5), C.mute);\n  } else if (nxt) {\n    const k = H(s, 5); img(k, dot(tint(nxt), 6), 6); kicker(k, \"Next in \" + dur(Math.max(0, mins(nxt.t) - nm)), C.gold);\n    s.addSpacer(2); T(s, nxt.title.toUpperCase(), F.head(big ? 24 : 17), C.ink, 2); s.addSpacer(3);\n    T(s, (fmt(nxt.t) + (nxt.e ? \" – \" + fmt(nxt.e) : \"\")).toUpperCase(), F.semi(10.5), C.mute);\n  } else {\n    kicker(s, \"Today\", C.gold); s.addSpacer(3); T(s, \"CLEAR. RECHARGE.\", F.head(big ? 24 : 17), C.ink, 2);\n  }\n}\nfunction timeline(s, list, n) {\n  list.slice(0, n).forEach((x, i) => {\n    const r = H(s, 8); const tc = H(r); tc.size = new Size(40, 0); T(tc, short(x.t), F.mono(10.5), C.mute); tc.addSpacer();\n    const bead = V(r); bead.size = new Size(8, 14); bead.centerAlignContent(); img(bead, dot(tint(x), 7), 7);\n    T(r, x.title, F.semi(13.5), C.ink); r.addSpacer();\n    if (i < n - 1) s.addSpacer(5);\n  });\n}\nconst initials = n => String(n || \"?\").split(/\\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join(\"\").toUpperCase();\nfunction avatar(s, name, color) { const a = H(s, 0); a.size = new Size(22, 22); a.cornerRadius = 3; a.backgroundColor = new Color(color.hex, 0.2); a.borderColor = new Color(color.hex, 0.5); a.borderWidth = 1; a.addSpacer(); const t = T(a, initials(name), F.head(10), color); t.minimumScaleFactor = 0.5; a.addSpacer(); return a }\nfunction mailRows(s, m, n) {\n  m.list.slice(0, n).forEach((x, i) => {\n    const r = H(s, 7); avatar(r, x.from, x.hi ? C.red : C.gold);\n    const v = V(r, 0); T(v, x.from, F.bold(12), x.hi ? C.red : C.ink); T(v, x.sub, F.reg(11.5), C.mute); r.addSpacer();\n    if (i < n - 1) s.addSpacer(6);\n  });\n}\nfunction background(w) {\n  const g = new LinearGradient(); g.colors = [C.bg1, C.bg2]; g.locations = [0, 1]; g.startPoint = new Point(0, 0); g.endPoint = new Point(1, 1);\n  w.backgroundGradient = g;\n}\n\n/* ---------- Sizes ---------- */\nfunction small(w, d, p) {\n  const top = H(w); img(top, ring(d.score / 100, 40, C.gold, d.score + \"\", \"DAY\"), 40); top.addSpacer();\n  const pills = V(top, 4); if (d.mail) pill(pills, \"envelope.fill\", d.mail.unread + \"\", d.mail.unread ? C.gold : C.mute); if (d.pastDue) pill(pills, \"exclamationmark.triangle.fill\", d.pastDue + \"\", C.red);\n  w.addSpacer();\n  if (p.stale) { kicker(w, \"DaySilk\", C.gold); T(w, \"Open the site to refresh\", F.bold(13), C.ink, 2); return }\n  nowBlock(w, p.cur, p.list[0], 126, false);\n}\nfunction medium(w, d, p) {\n  const row = H(w, 14); row.topAlignContent();\n  const L = V(row); L.size = new Size(196, 0);\n  if (p.stale) { kicker(L, \"DaySilk\", C.gold); T(L, \"Open the site to refresh\", F.bold(15), C.ink, 2) }\n  else { nowBlock(L, p.cur, p.list[0], 196, false); L.addSpacer(10); timeline(L, p.cur ? p.list : p.list.slice(1), 2) }\n  L.addSpacer();\n  const R = V(row, 8); R.size = new Size(0, 0); R.centerAlignContent();\n  const rc = H(R); rc.addSpacer(); img(rc, ring(d.score / 100, 62, C.gold, d.score + \"%\", \"TODAY\"), 62); rc.addSpacer();\n  if (d.mail) { const m = H(R, 4); m.addSpacer(); sym(m, \"envelope.fill\", 11, C.gold); T(m, d.mail.unread + \" unread\", F.bold(11), C.ink); m.addSpacer();\n    if (d.mail.list[0]) { const f = H(R); f.addSpacer(); T(f, d.mail.list[0].from, F.semi(10), d.mail.list[0].hi ? C.red : C.mute); f.addSpacer() } }\n  if (d.pastDue) { const q = H(R); q.addSpacer(); pill(q, \"exclamationmark.triangle.fill\", d.pastDue + \" past due\", C.red); q.addSpacer() }\n}\nfunction large(w, d, p) {\n  const hd = H(w); const hv = V(hd, 1);\n  T(hv, (greet() + \", \" + (d.name || \"Demontez\")).toUpperCase(), F.head(21), C.ink);\n  T(hv, now.toLocaleDateString([], { weekday: \"long\", month: \"long\", day: \"numeric\" }).toUpperCase(), F.mono(9), C.gold);\n  hd.addSpacer(); img(hd, ring(d.score / 100, 46, C.gold, d.score + \"\", \"DAY\"), 46);\n  w.addSpacer(12);\n  const card = V(w); card.backgroundColor = C.card; card.cornerRadius = 6; card.setPadding(12, 14, 12, 14); card.borderColor = C.line; card.borderWidth = 1;\n  if (p.stale) T(card, \"Open the site to refresh today's plan.\", F.bold(14), C.ink, 2); else nowBlock(card, p.cur, p.list[0], 282, true);\n  card.addSpacer(0);\n  w.addSpacer(12);\n  if (!p.stale) { kicker(w, \"Up next\"); w.addSpacer(6); if (p.list.length) timeline(w, p.list, 3); else T(w, \"Nothing else today.\", F.semi(12), C.mute) }\n  w.addSpacer(12);\n  const two = H(w, 10); two.topAlignContent();\n  const M = V(two, 0); M.size = new Size(160, 0);\n  const mh = H(M, 4); sym(mh, \"envelope.fill\", 10, C.gold); kicker(mh, d.mail ? d.mail.unread + \" unread\" : \"Mail\"); M.addSpacer(6);\n  if (d.mail && d.mail.list.length) mailRows(M, d.mail, 2); else T(M, d.mail ? \"Inbox is clear.\" : \"Connect Outlook on the site.\", F.semi(11), C.mute, 2);\n  const B = V(two, 0); kicker(B, \"Big 3\"); B.addSpacer(6);\n  (d.big3 || []).forEach((b, i) => { const r = H(B, 6); const nc = H(r); nc.size = new Size(16, 0); T(nc, \"0\" + (i + 1), F.mono(10), new Color(CO[b.co] || \"#D2AE6E\")); T(r, b.t, F.semi(12.5), C.ink); r.addSpacer(); if (i < 2) B.addSpacer(5) });\n  w.addSpacer();\n  const ft = H(w, 6); T(ft, \"BUILD THE MAN. BUILD THE BODY. BUILD THE BUSINESSES.\", F.semi(9.5), C.dim); ft.addSpacer();\n  if (d.pastDue) pill(ft, \"exclamationmark.triangle.fill\", d.pastDue + \"\", C.red);\n}\nfunction lock(w, d, p, fam) {\n  const nx = p.cur || p.list[0];\n  if (fam === \"accessoryCircular\") { img(w, ring(d.score / 100, 50, Color.white(), d.score + \"\", \"DAY\"), 50); return }\n  if (fam === \"accessoryInline\") { T(w, nx ? (p.cur ? \"Now \" : short(nx.t) + \" \") + nx.title : \"Clear today\", F.semi(12), Color.white()); return }\n  const k = H(w, 4); sym(k, p.cur ? \"circle.inset.filled\" : \"clock\", 10, Color.white()); T(k, p.cur ? \"NOW · \" + dur(Math.max(0, endOf(p.cur) - nm)) + \" left\" : nx ? \"NEXT · \" + fmt(nx.t) : \"TODAY\", F.mono(9), Color.white());\n  T(w, (nx ? nx.title : \"Clear\").toUpperCase(), F.head(15), Color.white(), 1);\n  const m = H(w, 6); if (d.mail) { sym(m, \"envelope.fill\", 10, Color.white()); T(m, d.mail.unread + \"\", F.semi(11), Color.white()) } if (d.pastDue) { sym(m, \"exclamationmark.triangle.fill\", 10, Color.white()); T(m, d.pastDue + \"\", F.semi(11), Color.white()) }\n}\n\nasync function build(d) {\n  const fam = config.widgetFamily || \"large\", w = new ListWidget(); w.url = CFG.site;\n  w.refreshAfterDate = new Date(Date.now() + 15 * 60000);\n  if (fam.startsWith(\"accessory\")) { if (d) lock(w, d, plan(d), fam); else T(w, \"Run this script in Scriptable\", F.semi(11), Color.white(), 2); return w }\n  background(w); w.setPadding(14, 15, 14, 15);\n  if (!d) { kicker(w, \"DaySilk\", C.gold); w.addSpacer(6); T(w, WHY, F.bold(13), C.ink, 5); return w }\n  const p = plan(d);\n  if (fam === \"small\") small(w, d, p); else if (fam === \"medium\") medium(w, d, p); else large(w, d, p);\n  return w;\n}\n\n/* Keeps this script up to date from the site, at most every 6 hours, so design fixes arrive without pasting again. */\nasync function selfUpdate() {\n  try {\n    const K = \"rebuild-widget-upd\", last = Keychain.contains(K) ? Number(Keychain.get(K)) : 0;\n    if (Date.now() - last < 6 * 3600e3) return; Keychain.set(K, String(Date.now()));\n    const src = await new async function startCloudSession(user){
 if(sbUser&&user&&sbUser.id===user.id&&dbCol)return;
 sbUser=user;const a=document.getElementById("auth");if(a)a.remove();document.querySelector(".app").style.display="";

 try{
  dbCol=sbCollection(user.id);canWrite=true;
  const snap=await dbCol.get();
  // Assistant access is checked every sign-in. An assistant also has a full DaySilk of her own; she opens the owner's
  // work side only after switching to it (remembered per device), and sees his calendar read-only in her own.
  const j=await assistGet();S.boss=j&&j.core?j:null;

  const own=(snap.docs.find(d=>d.id==="core")||{data:()=>null}).data()||{},used=["ts","tasks","trips","events","travel","mdl","assistants","spots","going"].some(k=>own[k]&&Object.keys(own[k]).length)||!!own.msLink||!!(own.body&&own.body.log&&own.body.log.length);
  // Anyone who isn't the owner (a new account, or one that took the setup) gets their own DaySilk, never his built-in plan.
  const mine=EMB_OWNER(user)?false:(!used||!!own.persona);
  if(mine&&!PERSONA){S.core=null;S.days={};enterPersona()}
  if(snap.empty){
   // First sign-in: carry over anything saved in this browser before the live site existed (owner only).
   if(!mine)try{const old=localStorage.getItem("mdv-rebuild-system-v1");if(old){const o=JSON.parse(old);if(o&&o.core&&!Object.keys(S.days).length){S.core=o.core;S.days=o.days||{};core()}}}catch(_){}

function parseCSV(txt){const rows=[];let row=[],f="",q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else{if(ch==='"')q=true;else if(ch===","){row.push(f);f=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&txt[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x.trim()!==""))rows.push(row);row=[]}else f+=ch}}row.push(f);if(row.some(x=>x.trim()!==""))rows.push(row);return rows}
function toISO(v){if(!v)return"";v=String(v).trim();let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+pad(m[1])+"-"+pad(m[2])}const d=new Date(v);return isNaN(d)?"":iso(d)}
function col(h,names){const i=h.findIndex(x=>names.some(n=>x===n));if(i>=0)return i;return h.findIndex(x=>names.some(n=>x.includes(n)))}
function hashId(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return"x"+(h>>>0).toString(36)}
function detect(name,txt){

 const h=rows[0].map(x=>x.trim().toLowerCase()),body=rows.slice(1);
 const iTitle=col(h,["task","title","subject","event","name"]),iDate=col(h,["due","date","start","day","when"]),iStatus=col(h,["status","done","complete"]),iModel=col(h,["model","talent"]),iSub=col(h,["subtask","subtasks","checklist"]);
 const iDiv=col(h,["division","board","gender","category","department"]),iEmail=col(h,["email"]),iRole=col(h,["role","type","position","company"]),iCity=col(h,["city","market","office"]);
 if(iEmail>=0&&iTitle>=0&&iDate<0)return{kind:"contacts",label:"Contacts",name,rows:body.map(r=>({name:r[iTitle]||"",role:r[iRole]||"",city:r[iCity]||""})).filter(r=>r.name),detail:"Adds people to your creative network who aren't already there."};
 if(iDiv>=0&&iTitle>=0&&iDate<0){const rs=body.map(r=>({name:r[iTitle],div:(r[iDiv]||"").toLowerCase()})).filter(r=>r.name);const w=rs.filter(r=>/wom|female|girl|\bw\b|^f/.test(r.div)).length,m=rs.filter(r=>/\bmen|male|boy|^m(?!.*wo)/.test(r.div)&&!/wom|female/.test(r.div)).length;return{kind:"roster",label:"Roster",name,rows:rs,w,m,detail:`Sets the women's board to ${w} and the men's board to ${m}.`}}
 if(iTitle>=0){const rs=body.map(r=>{const st=iStatus>=0?(r[iStatus]||"").toLowerCase():"";const t=r[iTitle]||"";const model=iModel>=0?r[iModel]:"";const title=model&&!t.includes(model)?t+" ("+model+")":t;const due=iDate>=0?toISO(r[iDate]):"";const subs=iSub>=0&&r[iSub]?r[iSub].split(/[;|\n]/).map(x=>x.trim()).filter(Boolean):[];return{id:hashId(title+due),title,due,done:/done|complete|true|yes|closed/.test(st),subs,meta:st}}).filter(r=>r.title);
  return{kind:"tasks",label:iModel>=0?"Model schedule":"Tasks",name,rows:rs,detail:"Adds them to your tasks and calendar under the Portal area. Re-importing replaces the previous portal import."}}
 return{error:"Couldn't recognize the columns. Include a task, title or name column."};
}

function packFor(tr){const n=Math.max(1,diffDays(tr.start,tr.end)),cold=tr.dests.some(d=>d==="ny"||d==="paris"),warm=tr.dests.includes("cali"),mkt=tr.dests.some(d=>d==="ny"||d==="paris"),intl=tr.dests.some(d=>DEST[d]&&DEST[d].intl);
 const g=[["Essentials",["Phone, laptop and chargers","Medications for "+(n+2)+" days","Grooming kit, travel size","Watch and fragrance","Reusable water bottle"]]];
 const c=[`Underwear and socks x ${Math.min(n+1,8)}${n>7?" (plan one laundry)":""}`,"Gym kit x 3 and training shoes","Sleepwear"];
 if(cold)c.push("Winter coat","Scarf and gloves","2 knits and layers","Leather boots or loafers","Compact umbrella");

function legVal(tr,L,k){const d=tdata(tr.id).legs[L.id]||{};return d[k]!==undefined?d[k]:(k==="from"||k==="to"||k==="date"?L[k]:"")}
function readiness(tr){const td=tdata(tr.id),miss=[],intl=tr.dests.some(d=>DEST[d]&&DEST[d].intl)||tr.intl;let ok=0,tot=0;
 tr.legs.forEach(L=>{tot++;if((td.legs[L.id]||{}).conf)ok++;else miss.push("flight "+legVal(tr,L,"from")+" to "+legVal(tr,L,"to"))});

function reschedForm(s,r){
 const ev=r.kind==="e"?r.ev:null,rep=ev&&ev.rep,id=ev?ev.id:r.k;
 const quick=ev?[["30","+30 min"],["60","+1 hour"],["d1","Tomorrow"],["d7","Next week"]]:[["30","+30 min"],["60","+1 hour"],["-30","−30 min"]];

 <div class="rs-f">${ev?`<label>Date<input class="txt" type="date" name="d" value="${s}" required></label>`:""}<label>Starts<input class="txt" type="time" name="t" value="${esc(r.time||"")}"></label><label>Ends<input class="txt" type="time" name="e" value="${esc(r.end||r.endGuess||"")}"></label>
 ${rep?`<label>Apply to<select class="txt" name="scope"><option value="one">Just this day</option><option value="fwd">This and all after</option></select></label>`:""}</div>
 <div class="rs-a"><button class="btn sm solid" type="submit">Save new time</button>${ev?`<button type="button" class="btn sm" data-act="rsdel">${rep?"Skip this day":"Delete event"}</button>`:`${r.moved?`<button type="button" class="btn sm" data-act="rsreset">Back to usual time</button>`:""}<button type="button" class="btn sm" data-act="rsskip">Skip today</button>`}</div>
 <p class="small muted">${ev?(rep?"This repeats. Choose whether the change is for this day only or from here on.":"Moves this event."):"Changes this block for this day only. Your weekly template stays the same."}</p></form>`}
const hm=t=>t?+t.slice(0,2)*60+ +t.slice(3,5):null,mh=m=>{m=Math.max(0,Math.min(1439,m));return String(m/60|0).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
function applyResched(f,v){return rsApply(f.dataset.rs,f.dataset.s,f.dataset.id,v)}
function rsApply(kind,s,id,v){const c=core();
 if(kind==="b"){const d=day(s);d.bmove=d.bmove||{};d.bmove[id]={t:v.t,e:v.e};markDirty("day",s);toast("Moved for "+fmtMD(s));render();return}
 const i=(c.events||[]).findIndex(x=>x.id===id);if(i<0)return;const e=c.events[i];
 const fol=S.item&&S.item.kind==="e"&&S.item.id===id;if(!e.rep){Object.assign(e,{d:v.d,t:v.t,e:v.e});if(fol)S.item.s=v.d}
 else if(v.scope==="fwd"){if(v.d<=e.d&&s===e.d){Object.assign(e,{d:v.d,t:v.t,e:v.e});if(fol)S.item.s=v.d}else{const n={...e,id:uid(),d:v.d,t:v.t,e:v.e};delete n.skip;e.until=addDays(s,-1);c.events.push(n);if(fol)S.item={...S.item,id:n.id,s:v.d}}}
 else{e.skip=(e.skip||[]).concat(s);const n={...e,id:uid(),d:v.d,t:v.t,e:v.e,rep:"",from:e.id};delete n.skip;delete n.until;c.events.push(n);if(fol)S.item={...S.item,id:n.id,s:v.d}}
 markDirty("core");warnClash(v.d,v.t,v.e,null);toast(v.d!==s?"Moved to "+fmtMD(v.d):"New time saved");render()}

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;if(!["rsq","rsdel","rsskip","rsreset"].includes(a))return;

 if(a==="rsq"){const q=b.dataset.q,D=f.elements.d,T=f.elements.t,E=f.elements.e;

 if(a==="rsskip"){const d=day(s);d.bmove=d.bmove||{};d.bmove[id]={x:1};markDirty("day",s);render();toast("Skipped for today");return}
 if(a==="rsreset"){const d=day(s);if(d.bmove)delete d.bmove[id];markDirty("day",s);render();toast("Back to the usual time");return}

/* ================= Maison de Veux portal feed =================
   DaySilk's server (/api/mdv) reads the agency portal's private feed and hands back tasks, the schedule, model travel and
   counts. Read-only: the portal stays the record. Refreshes on sign-in, every 5 minutes and when the app regains focus. */
const MDV_CACHE="helm-mdv";
S.mdv=(()=>{try{return JSON.parse(localStorage.getItem(MDV_CACHE))||null}catch(_){return null}})()||{data:null,at:0,err:""};
let mdvBusy=false;
const MDV_ERR={not_configured:"off",token_mismatch:"The key in DaySilk doesn't match the portal's key.",portal_not_configured:"The portal doesn't have its DaySilk key yet.",portal_error:"The portal returned an error.",unreachable:"The portal didn't answer.",signin:"Sign in again to refresh.",forbidden:"This account isn't allowed to read the portal."};
async function mdvSync(quiet){if(!cloudMode()||!sbUser||mdvBusy)return;mdvBusy=true;
 try{const r=await fetch("api/mdv"+(quiet?"":"?fresh=1"),{headers:{Authorization:"Bearer "+await sbJwt()}}),j=await r.json().catch(()=>({}));
  if(r.ok&&j&&j.source)S.mdv={data:j,at:Date.now(),err:""};else S.mdv.err=MDV_ERR[j.error]||(r.status===404?"off":"The portal returned an error.")}
 catch(_){S.mdv.err="Couldn't reach DaySilk's server."}
 mdvBusy=false;try{localStorage.setItem(MDV_CACHE,JSON.stringify(S.mdv))}catch(_){}
 if(!quiet)toast(S.mdv.err&&S.mdv.err!=="off"?S.mdv.err:"Maison de Veux updated");
 const typing=document.activeElement&&document.activeElement.matches("input,textarea,select");
 if(["work","schedule","command","tasks","settings","today"].includes(S.view)&&!S.vera&&!S.pal&&!typing)render()}

  .concat((D.travel||[]).map(x=>{const a=mdvLocal(x.starts_at);return{d:a.d,t:"",title:[x.model,[x.from,x.to].filter(Boolean).join(" to ")].filter(Boolean).join(" · ")||"Model travel",i:"plane",kind:"Travel",sub:["Model travel",x.purpose,x.status].filter(Boolean).join(" · ")}}))
  .filter(x=>x.d)}

function mdvAgo(){const m=Math.round((Date.now()-(S.mdv.at||0))/60000);return!S.mdv.at?"never":m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" h ago"}

 const C=D.counts||{},up=mdvItems().filter(x=>x.d>=t).sort((a,b)=>(a.d+a.t)<(b.d+b.t)?-1:1).slice(0,full?12:6),tk=(D.tasks||[]).slice(0,full?20:6);

/* ================= Mail: full Outlook inbox ================= */
/* Read, reply, reply all, forward, new email, drafts, flag, read/unread, archive and delete, all through Microsoft Graph.
   Message bodies render in a sandboxed frame with scripts off. Nothing here is stored in Supabase. */
const MX_FOLDERS=[["inbox","Inbox","mail"],["flagged","Flagged","flag"],["drafts","Drafts","edit"],["sentitems","Sent","send"],["archive","Archive","archive"],["deleteditems","Deleted","trash"],["junkemail","Junk","alert"]];
const MX_SEL="id,subject,from,toRecipients,ccRecipients,receivedDateTime,sentDateTime,isRead,bodyPreview,importance,flag,hasAttachments,isDraft,webLink";
S.mail={f:"inbox",q:"",list:[],next:"",sel:"",msg:null,comp:null,loading:false,loaded:false,err:""};
const mg=(path,opt)=>graph(path,Object.assign({scopes:MS_LOGIN},opt||{}));
const addr=r=>r&&r.emailAddress?r.emailAddress:{name:"",address:""};
const who=r=>{const a=addr(r);return a.name||a.address||""};
const addrLine=list=>(list||[]).map(r=>{const a=addr(r);return a.name&&a.name!==a.address?`${a.name} <${a.address}>`:a.address}).join(", ");
const me=()=>String(S.ms.user||(msAcct&&msAcct.username)||"").toLowerCase();
function parseAddrs(s){const out=[],bad=[];String(s||"").split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>{const m=x.match(/^(.*?)\s*<([^>]+)>$/),a=(m?m[2]:x).trim(),n=m?m[1].replace(/^"|"$/g,"").trim():"";
 if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a))out.push({emailAddress:n?{address:a,name:n}:{address:a}});else bad.push(x)});return{out,bad}}
function mxRow(x){return{id:x.id,sub:x.subject||"(No subject)",from:who(x.from),to:(x.toRecipients||[]).map(who).join(", "),at:x.receivedDateTime||x.sentDateTime,read:x.isRead,pre:(x.bodyPreview||"").slice(0,180),hi:x.importance==="high",flag:!!(x.flag&&x.flag.flagStatus==="flagged"),att:x.hasAttachments,draft:x.isDraft}}
function mxErr(e){const m=String(e&&e.message||e),code=e&&e.code?" ("+e.code+")":"";
 if(e&&e.where==="link")return m+" Go to Settings → Outlook and click Connect Outlook.";
 if(e&&e.status===403)return"Microsoft refused: "+m+code+". Check Mail.Send and Mail.ReadWrite are granted in Azure, then in Settings disconnect Outlook and connect again.";
 if(e&&e.status===401)return"Microsoft sign-in expired"+code+". Go to Settings → Outlook and click Connect Outlook.";
 return m+code}

async function mailLoad(more){const M=S.mail;if(msState!=="on"||M.loading)return;M.loading=true;M.err="";if(!more){M.next=""}render();
 try{let url=more?M.next:"";
  if(!url){const q=M.q.trim().replace(/"/g,"");
   if(q)url=`/me/messages?$search="${encodeURIComponent(q)}"&$top=30&$select=${MX_SEL}`;
   else if(M.f==="flagged")url=`/me/mailFolders/inbox/messages?$filter=${encodeURIComponent("flag/flagStatus eq 'flagged'")}&$top=40&$select=${MX_SEL}`;
   else url=`/me/mailFolders/${M.f}/messages?$top=40&$orderby=${encodeURIComponent(M.f==="sentitems"||M.f==="drafts"?"sentDateTime desc":"receivedDateTime desc")}&$select=${MX_SEL}`}
  const j=await mg(url),rows=(j.value||[]).map(mxRow);
  if(M.f==="flagged"&&!M.q)rows.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  M.list=more?M.list.concat(rows):rows;M.next=j["@odata.nextLink"]||"";M.loaded=true;
 }catch(e){M.err=mxErr(e);M.loaded=true}
 finally{M.loading=false;render()}}

async function mailOpen(id){const M=S.mail;M.sel=id;M.comp=null;M.msg={id,loading:true};render();
 try{const row=M.list.find(x=>x.id===id)||{};
  if(row.draft||M.f==="drafts"){const d=await mg(`/me/messages/${id}?$select=subject,toRecipients,ccRecipients,body,isDraft`,{prefer:'outlook.body-content-type="text"'});
   M.msg=null;M.comp={mode:"draft",draftId:id,to:addrLine(d.toRecipients),cc:addrLine(d.ccRecipients),sub:d.subject||"",body:(d.body&&d.body.content)||"",showCc:!!(d.ccRecipients||[]).length};render();return}
  const m=await mg(`/me/messages/${id}?$select=${MX_SEL},body,conversationId`);
  let att=[];if(m.hasAttachments){try{att=((await mg(`/me/messages/${id}/attachments?$select=id,name,size,contentType,isInline`)).value||[]).filter(a=>!a.isInline)}catch(_){}}
  if(S.mail.sel!==id)return;M.msg=Object.assign(m,{id,att});
  if(!m.isRead){mg(`/me/messages/${id}`,{method:"PATCH",body:{isRead:true}}).then(()=>{m.isRead=true;const r=M.list.find(x=>x.id===id);if(r)r.read=true;const t=S.ms.mail.find(x=>x.id===id);if(t&&!t.read){t.read=true;S.ms.unread=Math.max(0,S.ms.unread-1);msSave()}render()}).catch(()=>{})}
 }catch(e){M.msg={id,err:mxErr(e)}}
 render()}

function mailBody(m){const b=m.body||{};
 if(b.contentType==="html"){const doc=`<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="script-src 'none'"><base target="_blank"><style>body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:#1d1a17;margin:0;padding:4px 2px;word-wrap:break-word}img{max-width:100%;height:auto}table{max-width:100%}</style></head><body>${b.content||""}</body></html>`;
  return`<iframe class="mx-frame" title="Email body" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" srcdoc="${esc(doc)}"></iframe>`}
 return`<div class="mx-text">${esc(b.content||m.bodyPreview||"")}</div>`}
const kb=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
function mxFull(iso){return iso?new Date(iso).toLocaleString([],{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):""}

/* ---------- Compose ---------- */
function mailCompose(mode){const M=S.mail,m=M.msg,mine=me();
 if(mode==="new"){M.comp={mode,to:"",cc:"",sub:"",body:"",showCc:false};M.sel="";M.msg=null;render();focusComp("to");return}
 if(!m||!m.id)return;const notMe=r=>addr(r).address&&addr(r).address.toLowerCase()!==mine;
 const base=(m.subject||"").replace(/^((re|fw|fwd):\s*)+/i,"");
 let to="",cc="";if(mode==="reply")to=addrLine([m.from]);
 if(mode==="replyAll"){to=addrLine([m.from].concat((m.toRecipients||[]).filter(notMe)));cc=addrLine((m.ccRecipients||[]).filter(notMe))}
 M.comp={mode,src:m.id,to,cc,sub:(mode==="forward"?"FW: ":"RE: ")+base,body:"",showCc:!!cc,quote:{from:who(m.from),at:m.receivedDateTime,pre:m.bodyPreview||""}};
render();focusComp(mode==="forward"?"to":"body")}
function focusComp(n){setTimeout(()=>{const el=document.querySelector(`.mcomp [data-mc="${n}"]`);if(el)el.focus()},30)}
function compMsg(c,needTo){const t=parseAddrs(c.to),cc=parseAddrs(c.cc);const bad=t.bad.concat(cc.bad);
 if(bad.length){toast("Check this address: "+bad[0]);return null}if(needTo&&!t.out.length){toast("Add who it's going to.");return null}
 return{to:t.out,cc:cc.out}}
async function mailSend(){const c=S.mail.comp;if(!c||c.busy)return;const r=compMsg(c,true);if(!r)return;
 if(c.mode==="new"&&!c.sub.trim()&&!confirm("Send without a subject?"))return;
 c.busy="Sending…";c.err="";render();
 try{
  if(c.mode==="new")await mg("/me/sendMail",{method:"POST",body:{message:{subject:c.sub,body:{contentType:"text",content:c.body},toRecipients:r.to,ccRecipients:r.cc},saveToSentItems:true}});
  else if(c.mode==="draft"){await mg("/me/messages/"+c.draftId,{method:"PATCH",body:{subject:c.sub,body:{contentType:"text",content:c.body},toRecipients:r.to,ccRecipients:r.cc}});await mg(`/me/messages/${c.draftId}/send`,{method:"POST"})}
  else{if(c.draftId){await mg("/me/messages/"+c.draftId,{method:"DELETE"}).catch(()=>{})}
   const act={reply:"reply",replyAll:"replyAll",forward:"forward"}[c.mode];
   await mg(`/me/messages/${c.src}/${act}`,{method:"POST",body:c.mode==="forward"?{comment:c.body,toRecipients:r.to.concat(r.cc)}:{comment:c.body,message:{toRecipients:r.to,ccRecipients:r.cc}}})}
  toast("Sent");S.mail.comp=null;if(S.mail.f==="drafts"||S.mail.f==="sentitems")mailLoad();else render();
 }catch(e){c.busy="";c.err="Not sent. "+mxErr(e);toast(c.err);render()}}
async function mailSaveDraft(quiet){const c=S.mail.comp;if(!c||c.busy)return;const r=compMsg(c,false);if(!r)return;
 c.busy="Saving draft…";render();
 try{const msg={subject:c.sub,body:{contentType:"text",content:c.body},toRecipients:r.to,ccRecipients:r.cc};
  if(c.mode==="new"){const d=await mg("/me/messages",{method:"POST",body:msg});c.mode="draft";c.draftId=d.id}
  else if(c.mode==="draft")await mg("/me/messages/"+c.draftId,{method:"PATCH",body:msg});
  else{/* reply drafts keep Outlook's quoted thread, so a re-save replaces the old draft */
   if(c.draftId)await mg("/me/messages/"+c.draftId,{method:"DELETE"}).catch(()=>{});
   const fn={reply:"createReply",replyAll:"createReplyAll",forward:"createForward"}[c.mode];
   const d=await mg(`/me/messages/${c.src}/${fn}`,{method:"POST",body:c.mode==="forward"?{comment:c.body,toRecipients:r.to.concat(r.cc)}:{comment:c.body,message:{toRecipients:r.to,ccRecipients:r.cc}}});c.draftId=d.id}
  c.busy="";c.saved=Date.now();if(!quiet)toast("Draft saved in Outlook");if(S.mail.f==="drafts")mailLoad();else render();
 }catch(e){c.busy="";toast("Draft not saved. "+mxErr(e));render()}}
async function mailDiscard(){const c=S.mail.comp;if(!c)return;
 if(c.draftId){if(!confirm("Delete this draft from Outlook?"))return;try{await mg("/me/messages/"+c.draftId,{method:"DELETE"});toast("Draft deleted")}catch(e){toast(mxErr(e))}}
 else if((c.body||"").trim()&&!confirm("Discard this email?"))return;
 S.mail.comp=null;if(S.mail.f==="drafts"){S.mail.sel="";mailLoad()}else render()}

/* ---------- Message actions ---------- */
async function mailAct(a,id){const M=S.mail,row=M.list.find(x=>x.id===id),m=M.msg&&M.msg.id===id?M.msg:null;
 const drop=()=>{M.list=M.list.filter(x=>x.id!==id);S.ms.mail=S.ms.mail.filter(x=>x.id!==id);msSave();if(M.sel===id){M.sel="";M.msg=null}};
 try{
  if(a==="mflag"){const on=!(row?row.flag:m&&m.flag&&m.flag.flagStatus==="flagged");await mg("/me/messages/"+id,{method:"PATCH",body:{flag:{flagStatus:on?"flagged":"notFlagged"}}});
   if(row)row.flag=on;if(m)m.flag={flagStatus:on?"flagged":"notFlagged"};if(!on&&M.f==="flagged"&&!M.q)drop();toast(on?"Flagged":"Flag cleared")}
  if(a==="munread"){const rd=!(row?row.read:m&&m.isRead);await mg("/me/messages/"+id,{method:"PATCH",body:{isRead:rd}});if(row)row.read=rd;if(m)m.isRead=rd;
   const t=S.ms.mail.find(x=>x.id===id);if(t&&t.read!==rd){t.read=rd;S.ms.unread=Math.max(0,S.ms.unread+(rd?-1:1));msSave()}

/* ---------- Flow engine: what belongs where, and how each flow is doing ---------- */
const WORK_AREAS=["MDV","Models","Network","CDV","CAVYRE","Portal","Travel"];

function rowFlow(r){
 if(r.co)return"work";
 const t=String(r.title||"").toLowerCase();
 if(["Body","Recovery","Fuel"].includes(r.tag)||r.cat==="move"||/breakfast|lunch|dinner|meal|smoothie|gym|train|walk|stretch|sleep|wind down|recovery/.test(t))return"health";
 if(["Meeting","Focus","Travel"].includes(r.tag)||r.cat==="connect"||r.cat==="focus"||r.cat==="travel")return"work";
 return"daily";
}
const avgN=a=>{a=a.filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const clamp01=x=>Math.max(0,Math.min(1,x));
function flowScores(s){
 const d=day(s),ck=k=>d.checks&&d.checks[k]?1:0,c=k=>(d.c&&d.c[k])||0,{rows}=timeline(s);
 const pct=f=>{const l=rows.filter(f);return l.length?l.filter(r=>rowDone(s,r)).length/l.length:null};
 const due=allTasks().filter(x=>x.due===s),tk=fl=>{const l=due.filter(x=>flowOfArea(x.area)===fl);return l.length?l.filter(x=>x.done).length/l.length:null};
 const wk=["scouted","agency","calls","touches","cdvc"].map(k=>{const t=ctTarget(k,0,s);return t?clamp01(c(k)/t):null});
 const tr=trainingFor(s),lift=tr.ex.length?tr.ex.filter((e,i)=>d.lift["e"+i+"d"]).length/tr.ex.length:null;
 const daily=avgN([(ck("wake")+ck("routine")+ck("breaks")+ck("lunch")+ck("shutdown"))/5,pct(r=>rowFlow(r)==="daily"),tk("daily")]);
 const work=avgN([avgN(wk),pct(r=>rowFlow(r)==="work"),tk("work")]);
 const health=avgN([(ck("move")+ck("meals")+ck("sleep")+ck("groom"))/4,clamp01(c("water")/12),clamp01(c("protein")/4),clamp01(c("steps")/8),pct(r=>rowFlow(r)==="health"),lift,tk("health")]);

function flowWeek(s){const out=[];for(let i=6;i>=0;i--){const x=addDays(s,-i);out.push({d:x,v:flowScores(x)})}return out}

 const y=addDays(s,-1),yd=S.days[y];
 if(!d.checks.sleep&&nowMin()>=9*60&&[1,2].includes(parse(s).getDay()))add("health","work","Sleep not logged on a heavy scouting day","If the night was short, front-load scouting before noon and push the calls.",["Open today","view","today"]);
 if(yd&&habitScore(y)<5)add("daily","health",`Yesterday closed at ${habitScore(y)} of ${HABITS.length}`,"Never miss twice. Training and meals first, then the inbox.",["Check in","view","today"]);

 document.getElementById("palList").innerHTML=it.map((x,i)=>`<li role="option" aria-selected="${i===S.pal.i}" data-pi="${i}"><span>${esc(x.l)}</span><small>${esc(x.hint||"")}</small></li>`).join("")||'<li>No matches</li>';
}
function runPal(i){const x=palItems(S.pal.q)[i];if(!x)return;closePal();
 if(x.k==="view")go("view",x.v);else if(x.k==="vera")veraOpen(x.v);else if(x.k==="tab"){S.view=x.v;S.tabs[x.v]=x.t;render();window.scrollTo(0,0)}else if(x.k==="trip")go("trip",x.v);else if(x.k==="co"){window.open(coUrl(x.v),"_blank","noopener")}else if(x.k==="model"){S.view="models";S.tabs.models="roster";render();const d=document.querySelector(`details[data-tid="m-${x.v}"]`);if(d){d.open=true;d.scrollIntoView({block:"start"})}}else if(x.k==="task"){S.view="tasks";S.taskQuery=x.v;S.taskFilter="all";render();window.scrollTo(0,0)}else if(x.k==="add"){addCaptured(parseCapture(x.v));render()}}
function go(kind,k){
 if(EMB_HOME){try{parent.MDV_DS_EMBED.open(kind==="view"?k:kind,kind==="view"?undefined:k)}catch(_){}return}
 if(kind==="view")S.view=pageKey(k);
 else if(kind==="vera"){veraOpen(k);return}
 else if(kind==="trip"){S.view="travel";S.tabs.travel="trips";S.trip=k}
 else if(kind==="guide"){S.view="guide";S.guideCity=k}
 else if(kind==="tf"){S.view="tasks";S.taskFilter=k;S.taskQuery=""}
 else if(TABPAGE[kind]&&TABPAGE[kind][k]){const t=TABPAGE[kind][k];S.tabs[kind]=k;if(Array.isArray(t)){S.view=t[0];S.tabs[t[0]]=t[1]}else S.view=t}
 else if(["schedule","travel","models"].includes(kind)){S.view=kind;S.tabs[kind]=k}
 else S.view=pageKey(kind);
 if(!["today","life","health"].includes(S.view))S.date=todayIso();
 S.navOpen=false;render();window.scrollTo(0,0);
}

 if(a==="desk"){const k=b.dataset.k;if(deskOf(S.view).k===k){go("view",DESKS.find(d=>d.k===k).pages[0][0]);return}deskOpen[k]=!deskOpen[k];try{localStorage.setItem("helm-desks",JSON.stringify(deskOpen))}catch(_){}xnav();return}
 if(a==="navtog"){S.navOpen=!S.navOpen;document.body.classList.toggle("nav-open",S.navOpen);return}
 if(a==="qf"){S.qf=b.dataset.k;S.qMore=false;render();return}
 if(a==="qmore"){S.qMore=!S.qMore;render();return}
 if(a==="qdone"){toggleTask(b.dataset.id);toast("Marked done");render();return}
 if(a==="qbump"){const t=allTasks().find(x=>x.id===b.dataset.id);if(t){const base=t.due&&t.due>todayIso()?t.due:todayIso();setDue(t.id,addDays(base,1));toast("Moved to "+fmtShort(addDays(base,1)))}render();return}
 if(a==="qopen"){S.view="tasks";S.taskQuery=b.dataset.id;S.taskFilter="all";S.taskArea="All";if(S.vera)veraClose();render();window.scrollTo(0,0);return}
 if(a==="qmstep"){const c=core();c.mdl[b.dataset.m]=c.mdl[b.dataset.m]||{};const m=c.mdl[b.dataset.m];m.s=m.s||{};m.s[b.dataset.i]=true;markDirty("core");toast("Model step done");render();return}
 if(a==="vera"){veraOpen(b.dataset.k||"brief");return}
 if(a==="veraclose"){veraClose();return}
 if(a==="vok"){veraRun(b.dataset.id);return}
 if(a==="vno"){if(S.vera){S.vera.done[b.dataset.id]=true;renderVera()}return}
 if(a==="vall"){if(S.vera){(S.vera.props||[]).filter(p=>p.run&&!p.alt&&!S.vera.done[p.id]).forEach(p=>{p.run();S.vera.done[p.id]=true});_qCache=null;toast("All approved");render()}return}
 if(a==="vgo"){veraClose();go("view",b.dataset.k);return}
});
document.addEventListener("click",e=>{if(document.body.classList.contains("nav-open")&&e.target.classList&&e.target.classList.contains("app")){S.navOpen=false;document.body.classList.remove("nav-open")}});
document.addEventListener("submit",e=>{const f=e.target;if(f.id!=="veraAsk"&&f.id!=="veraAsk2")return;e.preventDefault();e.stopImmediatePropagation();const q=String(f.elements.q.value||"").trim();if(!q){veraOpen("brief");return}S.vera={mode:"ask",q,props:null,done:{}};S.vera.props=veraProps("ask",q);renderVera()},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.vera&&!S.pal){veraClose()}else if(S.navOpen){S.navOpen=false;document.body.classList.remove("nav-open")}}});

/* ================= Events ================= */
let fileMode="csv";
document.addEventListener("click",e=>{
 const pi=e.target.closest("#pal li[data-pi]");if(pi){runPal(Number(pi.dataset.pi));return}
 if(e.target.id==="pal"){closePal();return}
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
 if(b.tagName==="INPUT"&&(b.type==="date"||b.type==="text"||b.type==="search"))return;
 if(a==="view"){go("view",b.dataset.v);return}
 if(a==="go"){go(b.dataset.kind,b.dataset.k);return}
 if(a==="tab"){S.tabs[b.dataset.view]=b.dataset.k;render();return}
 if(a==="pal"){openPal();return}
 if(a==="day"){const n=Number(b.dataset.n);S.date=n===0?todayIso():addDays(S.date,n);render();return}
 if(a==="goto"){S.date=b.dataset.d;S.view="today";render();window.scrollTo(0,0);return}
 if(a==="mdvsync"){if(!cloudMode()||!sbUser){toast("Sign in to the cloud version to connect the portal");return}toast("Checking Maison de Veux…");mdvSync(false);return}
 if(a==="tpins"){const td=tdata(b.dataset.id);td.ins=core().travelProfile.insurer||"";markDirty("core");render();toast("Insurance set for this trip");return}
 if(a==="tpdoc"){tdata(b.dataset.id).docs[b.dataset.k]=true;markDirty("core");render();return}
 if(a==="calback"){S.view="schedule";S.tabs.schedule="month";render();return}
 if(a==="mon"){const n=Number(b.dataset.n);if(n===0)S.calMonth=todayIso().slice(0,7);else{const [y,m]=S.calMonth.split("-").map(Number);const d=new Date(y,m-1+n,1);S.calMonth=d.getFullYear()+"-"+pad(d.getMonth()+1)}render();return}
 if(a==="cnt"){const d=day(S.date),k=b.dataset.k;d.c[k]=Math.max(0,(d.c[k]||0)+Number(b.dataset.n));markDirty("day");render();return}
 if(a==="task"){toggleTask(b.dataset.id);render();return}
 if(a==="sub"){toggleSub(b.dataset.id,Number(b.dataset.i));render();return}
 if(a==="delsub"){delSub(b.dataset.id,Number(b.dataset.i));render();return}
 if(a==="deltask"){const c=core();c.tasks=c.tasks.filter(t=>t.id!==b.dataset.id);markDirty("core");render();return}
 if(a==="tf"){S.taskFilter=b.dataset.k;render();return}
 if(a==="ta"){S.taskArea=b.dataset.k;render();return}
 if(a==="tmpl"){S.tmpl=b.dataset.k;render();return}
 if(a==="gc"){S.guideCity=b.dataset.k;if(b.dataset.tab){S.tabs.travel="guide";window.scrollTo(0,0)}render();return}
 if(a==="trip"){S.trip=b.dataset.k;S.newTrip=false;S.tabs.travel="trips";render();window.scrollTo(0,0);return}
 if(a==="newtrip"){S.newTrip=!S.newTrip;render();return}
 if(a==="deltrip"){const c=core();c.trips=c.trips.filter(t=>t.id!==b.dataset.k);delete c.travel[b.dataset.k];S.trip=null;markDirty("core");render();return}
 if(a==="going"){const c=core();c.going[b.dataset.id]=!c.going[b.dataset.id];markDirty("core");render();return}
 if(a==="spot"){const c=core(),k=b.dataset.k;c.spots[k]=c.spots[k]===b.dataset.v?"":b.dataset.v;markDirty("core");render();return}
 if(a==="groc"){const g=core().fuel.groc;g[b.dataset.k]=!g[b.dataset.k];markDirty("core");render();return}
 if(a==="soft"){const f=core().fuel;f.soft=b.checked?undefined:false;markDirty("core");render();return}
 if(a==="delw"){const B=core().body;B.log=B.log.filter(x=>x.d!==b.dataset.d);markDirty("core");render();return}
 if(a==="del"){core()[b.dataset.list].splice(Number(b.dataset.i),1);markDirty("core");render();return}
 if(a==="touch"){const r=core().network[Number(b.dataset.i)];r.last=todayIso();const d=day(todayIso());d.c.touches=(d.c.touches||0)+1;markDirty("core");markDirty("day",todayIso());render();return}
 if(a==="pickcsv"||a==="pickjson"){fileMode=a==="pickcsv"?"csv":"json";const fi=document.getElementById("fileIn");fi.value="";fi.click();return}
 if(a==="doimport"){doImport();return}
 if(a==="cancelimport"){S.importPreview=null;render();return}
 if(a==="clearportal"){core().portalTasks=[];markDirty("core");render();return}
 if(a==="exporttasks"){const rows=[["Task","Area","Deadline","Status","Subtasks done","Subtasks","Notes"]].concat(allTasks().map(t=>[t.title,t.area,t.due,t.done?"Done":"Open",t.subs.filter(s=>s.done).length+"/"+t.subs.length,t.subs.map(s=>(s.done?"[x] ":"[ ] ")+s.t).join("; "),t.notes]));save("rebuild-tasks-"+todayIso()+".csv",rows.map(r=>r.map(csvCell).join(",")).join("\n"));return}
 if(a==="backup"){save("rebuild-backup-"+todayIso()+".json",JSON.stringify({core:core(),days:S.days},null,1));return}
 if(a==="theme"){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem(LS+"-theme",r.dataset.theme)}catch(_){}return}
});
document.getElementById("fileIn").addEventListener("change",e=>{
 const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{const txt=String(rd.result||"");
  if(fileMode==="json"){try{const o=JSON.parse(txt);if(!o.core)throw 0;S.core=o.core;S.days=o.days||{};core();dirty.core=true;Object.keys(S.days).forEach(k=>dirty.days.add(k));lsSave();flush();render();toast("Backup restored")}catch(_){toast("That file isn't a backup from this system.")}return}
  const r=detect(f.name,txt);if(r.error){toast(r.error);return}S.importPreview=r;render()};
 rd.readAsText(f);
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset&&el.dataset.act==="due"){setDue(el.dataset.id,el.value);render();return}
 if(!el.dataset||!el.dataset.path)return;const sc=el.dataset.scope;
 let v=el.type==="checkbox"?el.checked:el.value;if(el.type==="number")v=el.value===""?"":Number(el.value);
 setP(root(sc),el.dataset.path,v);markDirty(sc);
 if(el.type==="checkbox"||el.tagName==="SELECT"||el.type==="number"||el.type==="url"||el.type==="date"||/\.conf$|\.name$|\.from$|\.to$|^travelProfile\./.test(el.dataset.path))renderAfterField(el);
});
/* Browsers fire "change" on a date as soon as it is a valid date, which can be mid-typing (the year 0002, then 0020…).
   Redrawing then throws away the cursor and the next fields you're filling in (a flight's times, seat, confirmation).
   So while you're in a form field the redraw waits until you've left the fields altogether. */
let fieldIn=null,redrawLater=false;
const inField=()=>{const a=document.activeElement;return!!(fieldIn||(a&&a.matches&&a.matches("input,textarea,select")))};
document.addEventListener("focusin",e=>{fieldIn=e.target.matches&&e.target.matches("input,textarea,select")?e.target:null});
document.addEventListener("focusout",e=>{if(fieldIn===e.target)fieldIn=null;if(redrawLater)setTimeout(()=>{if(redrawLater&&!inField()){redrawLater=false;render()}},0)});
function renderAfterField(el){
 // Chrome can report the page body as focused while it moves between a date's month, day and year, so focus is tracked here too.
 if(el.type==="checkbox"||el.tagName==="SELECT"||!inField()){render();return}
 redrawLater=true}
document.addEventListener("input",e=>{const el=e.target;
 if(el.dataset&&el.dataset.tnote){setNote(el.dataset.tnote,el.value);return}
 if(el.id==="capIn"){const p=document.getElementById("capParse");if(p)p.innerHTML=captureChips(parseCapture(el.value));return}
 if(el.id==="taskSearch"){S.taskQuery=el.value;const pos=el.selectionStart;render();const n=document.getElementById("taskSearch");if(n){n.focus();n.setSelectionRange(pos,pos)}return}
 if(el.id==="palIn"){S.pal.q=el.value;S.pal.i=0;renderPal();return}
 if(!el.dataset||!el.dataset.path||["checkbox","number","date","url","time"].includes(el.type)||el.tagName==="SELECT")return;setP(root(el.dataset.scope),el.dataset.path,el.value);markDirty(el.dataset.scope)});
document.addEventListener("submit",e=>{
 const f=e.target;e.preventDefault();
 if(f.id==="capture"){const v=f.elements.q.value;const p=parseCapture(v);if(!p.title)return;addCaptured(p);render();const n=document.getElementById("capIn");if(n)n.focus();return}
 if(f.id==="addTask"){const fd=new FormData(f),title=String(fd.get("title")||"").trim();if(!title)return;core().tasks.push({id:uid(),title,due:String(fd.get("due")||""),time:String(fd.get("time")||""),area:String(fd.get("area")),prio:Number(fd.get("prio")),subs:String(fd.get("subs")||"").split("\n").map(s=>s.trim()).filter(Boolean).map(t=>({t,done:false})),notes:String(fd.get("notes")||""),done:false});markDirty("core");render();toast("Task added");return}
 if(f.id==="addWeight"){const fd=new FormData(f),w=Number(fd.get("w")),d=String(fd.get("d")||todayIso());if(!w)return;const B=core().body;B.log=B.log.filter(x=>x.d!==d);const row={d,w};const wa=Number(fd.get("waist"));if(wa)row.waist=wa;B.log.push(row);markDirty("core");render();toast("Logged "+w+" lb");return}
 if(f.id==="addTrip"){const fd=new FormData(f),place=String(fd.get("place")||"").trim(),st=String(fd.get("start")||""),en=String(fd.get("end")||"");if(!place||!st||!en||en<st){toast("Add a destination and a return date after the start.");return}let a=AP_BY[String(fd.get("ap")||"")]||apSearch(place)[0]||null;if(a&&!fd.get("ap")&&!a.k.includes(place.split(",")[0].trim().toLowerCase()))a=null;
  const fromTxt=String(fd.get("from")||"").trim();let o=AP_BY[String(fd.get("fromAp")||"")]||(fromTxt?apSearch(fromTxt)[0]:null);if(o&&!fd.get("fromAp")&&!o.k.includes(fromTxt.split(",")[0].trim().toLowerCase()))o=null;const home=o?o.c:"ATL";
  const id=uid(),code=a?a.c:"";core().trips.push({id,name:String(fd.get("name")||"").trim()||(a?a.city+" trip":place),place,start:st,end:en,intl:a&&o?a.cc!==o.cc:fd.get("intl")==="1",tz:a?a.tz:"",cc:a?a.cc:"",ap:code,purpose:"",dests:["other"],legs:[{id:"l1",from:home,to:code,date:st,hint:""},{id:"l2",from:code,to:home,date:en,hint:""}],stays:[{id:"s1",city:"other",in:st,out:en,hint:""}]});S.trip=id;S.newTrip=false;markDirty("core");render();return}
 if(f.dataset.addsub){const v=f.elements.t.value.trim();if(!v)return;addSub(f.dataset.addsub,v);render();const nf=document.querySelector(`#main .subadd[data-addsub="${f.dataset.addsub}"] input`);if(nf)nf.focus();return}
 if(f.dataset.add){const key=f.dataset.add,cfg=LISTS[key],row={};cfg.f.forEach(x=>{const el=f.elements[x.k];row[x.k]=x.num?Number(el.value||0):el.value.trim()});if(!row[cfg.f[0].k])return;core()[key].push(row);markDirty("core");render()}
});
document.addEventListener("keydown",e=>{
 const typing=e.target.matches("input,textarea,select");
 if((e.key==="k"&&(e.metaKey||e.ctrlKey))||(e.key==="/"&&!typing&&!S.pal)){e.preventDefault();S.pal?closePal():openPal();return}
 if(S.pal){const it=palItems(S.pal.q);if(e.key==="Escape"){closePal();return}if(e.key==="ArrowDown"){e.preventDefault();S.pal.i=Math.min(it.length-1,S.pal.i+1);renderPal();return}if(e.key==="ArrowUp"){e.preventDefault();S.pal.i=Math.max(0,S.pal.i-1);renderPal();return}if(e.key==="Enter"){e.preventDefault();runPal(S.pal.i);return}return}
 if(!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&/^[1-9]$/.test(e.key)){const v=["command","today","work","health","personal"][Number(e.key)-1];if(v)go("view",v)}
 if(!typing&&e.key==="Enter"&&e.target.matches(".wh")){e.target.click()}
});

{let th="dark";try{th=localStorage.getItem(LS+"-theme")||"dark"}catch(e){}document.documentElement.dataset.theme=th}
if(EMB&&!EMB_HOME)S.view="today";
if(!cloudMode()){lsLoad();core();render()}else{core();render()}

{const q=new URLSearchParams(location.search),v=q.get("v");if(v||q.has("add")){history.replaceState(null,"",location.pathname);if(v)go("view",v);if(q.has("add"))setTimeout(openPal,50)}}

connect();
