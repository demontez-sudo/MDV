<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DaySilk</title>
<meta name="description" content="DaySilk: Demontez Culbreath's command portal for daily, work and health flow.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17110D">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DaySilk">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a dark command rail on the left, a working canvas on the right; the Command page opens on a date-led briefing band. */
:root{
  --bg:#E7E1D8; --surface:#F2EDE6; --sunk:#DBD3C8; --ink:#1E1712; --muted:#695C52; --line:#CABFB2;
  --accent:#7A3218; --accent-ink:#F4EDE4; --gold:#94703A; --ok:#4A5A36; --warn:#A1301A; --info:#3F5666;
  --rail:#17110D; --rail-ink:#EAE1D5; --rail-muted:#9C8B7D; --rail-line:#2C231D; --rail-hi:#2A201A;
  --band:#1E1712; --band-ink:#EDE4D9; --band-muted:#B5A291;
  --k-prime:#A07A3C; --k-focus:#7A3218; --k-connect:#3F5666; --k-move:#4A5A36; --k-recharge:#9A8B7C; --k-close:#5A4862; --k-travel:#B9893F;
  --c-atl:#DBD3C8; --c-ny:#C3C9CC; --c-paris:#E0CDBE; --c-cali:#CBD0B4; --c-travel:#EADBC3;
  --serif:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15100D; --surface:#1E1814; --sunk:#0F0B09; --ink:#EDE4D9; --muted:#A3958A; --line:#352C25;
    --accent:#C9774A; --accent-ink:#15100D; --gold:#D2AE6E; --ok:#9DAE7A; --warn:#E5805B; --info:#8FA9BA;
    --rail:#0E0A08; --rail-line:#241C17; --rail-hi:#231B16; --band:#0E0A08;
    --k-prime:#D2AE6E; --k-focus:#C9774A; --k-connect:#8FA9BA; --k-move:#9DAE7A; --k-recharge:#8C7F73; --k-close:#A48CB0; --k-travel:#D9A85A;
    --c-atl:#251E19; --c-ny:#1F2427; --c-paris:#2D221B; --c-cali:#23291B; --c-travel:#33271A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15100D; --surface:#1E1814; --sunk:#0F0B09; --ink:#EDE4D9; --muted:#A3958A; --line:#352C25;
  --accent:#C9774A; --accent-ink:#15100D; --gold:#D2AE6E; --ok:#9DAE7A; --warn:#E5805B; --info:#8FA9BA;
  --rail:#0E0A08; --rail-line:#241C17; --rail-hi:#231B16; --band:#0E0A08;
  --k-prime:#D2AE6E; --k-focus:#C9774A; --k-connect:#8FA9BA; --k-move:#9DAE7A; --k-recharge:#8C7F73; --k-close:#A48CB0; --k-travel:#D9A85A;
  --c-atl:#251E19; --c-ny:#1F2427; --c-paris:#2D221B; --c-cali:#23291B; --c-travel:#33271A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.lbl,.eyebrow{font-family:var(--mono)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
h1,h2,h3{text-wrap:balance}
h2.section{font-family:var(--serif);font-weight:500;font-size:clamp(32px,4.4vw,46px);line-height:1.02;margin:4px 0 8px}
.lead{color:var(--muted);max-width:68ch;margin:0 0 22px}
h3{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h3 .eyebrow{font-weight:400}
h4{font-size:14px;font-weight:700;margin:0 0 6px}

/* ===== App frame ===== */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--rail);color:var(--rail-ink);padding:22px 14px 18px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 18px;border-bottom:1px solid var(--rail-line);margin-bottom:10px}
.brand svg{width:44px;height:44px;flex:none}
.brand b{display:block;font-family:var(--serif);font-weight:500;font-size:22px;line-height:1}
.brand span{display:block;font-size:12px;color:var(--rail-muted);margin-top:4px}
.navgroup{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rail-muted);margin:16px 10px 6px}
.rail button.nv{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-weight:500;display:flex;align-items:center;gap:10px;color:var(--rail-ink)}
.rail button.nv svg{width:17px;height:17px;flex:none;opacity:.75}
.rail button.nv:hover{background:var(--rail-hi)}
.rail button.nv[aria-current="true"]{background:var(--rail-ink);color:var(--rail)}
.rail button.nv[aria-current="true"] svg{opacity:1}
.rail .nv .k{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--rail-muted)}
.rail .nv[aria-current="true"] .k{color:var(--rail)}
.badge{font-family:var(--mono);font-size:10.5px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px;line-height:17px;margin-left:auto}
.rail .cmdk{all:unset;cursor:pointer;margin:6px 4px 4px;border:1px solid var(--rail-line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--rail-muted);display:flex;justify-content:space-between}
.rail .cmdk:hover{border-color:var(--rail-muted);color:var(--rail-ink)}
.rail .foot{margin-top:auto;padding:16px 10px 0;font-size:12px;color:var(--rail-muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rail-line)}
.rail .clocks{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-family:var(--mono);font-size:11.5px}
.rail .clocks b{font-weight:500;color:var(--rail-ink);text-align:right}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
main{padding:28px clamp(16px,4vw,48px) 96px;min-width:0;max-width:1320px}
.topbar{display:none}

/* ===== Grids & blocks ===== */
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:36px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.col{display:flex;flex-direction:column;gap:30px;min-width:0}
.block{border-top:2px solid var(--ink);padding-top:14px;min-width:0}
.block.soft{border-top:1px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:30px}
.spacer{height:30px}

/* ===== Buttons, chips ===== */
.btn{cursor:pointer;border:1px solid var(--ink);background:transparent;padding:7px 13px;border-radius:6px;font-weight:600;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:3px 9px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);padding:1px 8px;border-radius:20px;white-space:nowrap}
.chip.over{border-color:var(--warn);color:var(--warn);font-weight:700}
.chip.soon{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
.mdv-k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}.mdv-k b{display:block;font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.1}.mdv-k small{font-size:12px;color:var(--muted)}
.mdv-h{margin:14px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mdv-t{list-style:none;margin:0 0 14px;padding:0}.mdv-t li{display:grid;grid-template-columns:62px 1fr;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.mdv-t li:first-child{border-top:0}.mdv-t li>span{font-size:12px}.mdv-t small{grid-column:2;color:var(--muted);font-size:12px}
.cal .ev.mdv{border-left:2px solid var(--f-work)}
@media(max-width:600px){.mdv-k{grid-template-columns:repeat(2,1fr)}}
.tpl{list-style:none;margin:0;padding:0}.tpc{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.tpc:first-child{border-top:0}
.tpc>i{width:8px;height:8px;border-radius:50%;background:var(--muted);align-self:start;margin-top:6px}.tpc-ok>i{background:var(--ok)}.tpc-bad>i{background:var(--warn)}.tpc-todo>i{background:var(--accent)}
.tpc b{display:block;font-size:14px}.tpc small{display:block;font-size:13px;color:var(--muted);line-height:1.45}.tpc .btn{white-space:nowrap}
.tptrip{padding:14px 0;border-top:1px solid var(--line)}.tptrip:first-of-type{border-top:0;padding-top:4px}.tptn{font-family:var(--serif);font-size:20px;font-weight:500}
@media(max-width:600px){.tpc{grid-template-columns:10px 1fr}.tpc .btn{grid-column:2;justify-self:start}}
.chip.area{background:var(--sunk);border-color:transparent}
.chip.note{border-color:var(--gold);color:var(--gold)}
.chip.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.filters button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 22px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink)}
.notice{border-left:3px solid var(--gold);padding:10px 14px;background:var(--surface);margin:0 0 18px;font-size:14px;border-radius:0 6px 6px 0}
.warnbar{background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:6px;margin:0 0 22px;font-weight:600}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
.quote{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.35;max-width:46ch;margin:0 0 18px}
ul.plain{margin:0;padding-left:18px} ul.plain li{margin:4px 0}

/* ===== Hero band ===== */
.band{position:relative;background:var(--band);color:var(--band-ink);margin:-28px calc(-1*clamp(16px,4vw,48px)) 28px;padding:30px clamp(16px,4vw,48px) 26px;overflow:hidden}
.band::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(237,228,217,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(237,228,217,.05) 1px,transparent 1px);background-size:32px 32px}
.band::after{content:"";position:absolute;right:-12%;top:-50%;width:62%;height:200%;background:radial-gradient(closest-side,rgba(160,122,60,.28),transparent);pointer-events:none}
.band>*{position:relative;z-index:1}
.band-row{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero-num{font-family:var(--serif);font-size:clamp(100px,15vw,190px);line-height:.78;letter-spacing:-.03em}
.hero-day{font-family:var(--serif);font-style:italic;font-size:clamp(28px,4vw,46px);line-height:1}
.hero-month{color:var(--band-muted);margin-top:6px}
.hero-sys{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#D2AE6E;margin-bottom:10px}
.score{margin-left:auto;display:flex;align-items:center;gap:14px}
.ring{width:118px;height:118px;flex:none}
.ring .t{font-family:var(--serif);font-size:30px;fill:var(--band-ink)}
.ring .s{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;fill:var(--band-muted)}
.score-legend{font-family:var(--mono);font-size:11.5px;color:var(--band-muted);display:grid;gap:3px}
.score-legend b{color:var(--band-ink);font-weight:500}
.band-now{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px 26px;margin-top:22px;padding-top:16px;border-top:1px solid rgba(237,228,217,.16)}
.band-now b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:400;color:var(--band-muted);margin-bottom:2px}
.band-now div{font-weight:600;font-size:15.5px;min-width:0}
.daynav{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}
.band .btn{border-color:rgba(237,228,217,.35);color:var(--band-ink)}
.band .btn:hover{background:var(--band-ink);color:var(--band)}

/* ===== Briefing ===== */
.brief{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.ins{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.ins .sev{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding-top:3px;display:flex;align-items:center;gap:7px}
.ins .sev::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.sev.act{color:var(--warn)} .sev.today{color:var(--accent)} .sev.heads{color:var(--info)} .sev.win{color:var(--ok)} .sev.tip{color:var(--gold)}
.ins p{margin:0} .ins p small{display:block;color:var(--muted);font-size:13px}

/* ===== Daily flow ===== */
.phase{margin-bottom:18px}
.phase-h{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.phase-h .nm{font-family:var(--serif);font-size:24px;font-weight:500}
.phase-h .rng{font-family:var(--mono);font-size:11px;color:var(--muted)}
.phase-h .pp{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.blk{display:grid;grid-template-columns:62px 4px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.blk time{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:2px}
.blk .bar{border-radius:2px;background:var(--kc,var(--line))}
.blk.past{opacity:.55}
.blk.cur{background:var(--surface);border:1px solid var(--ink);border-radius:8px;padding:12px;margin:4px -13px}
.blk.done .bt{text-decoration:line-through;text-decoration-color:var(--gold);color:var(--muted)}
.blk .bh{display:flex;gap:10px;align-items:flex-start}
.blk .bt{font-weight:600;flex:1;min-width:0}
.blk .bt small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.blk .kind{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--kc);white-space:nowrap;padding-top:3px}
.steps{list-style:none;margin:6px 0 0;padding:0;font-size:13.5px}
.steps li label{display:flex;gap:8px;align-items:flex-start;padding:2px 0;cursor:pointer;color:var(--muted)}
.steps li input:checked+span{text-decoration:line-through;opacity:.7}
.bnote{margin-top:6px}
.bnote summary{cursor:pointer;font-size:12px;color:var(--gold);list-style:none;display:inline-flex;gap:6px;font-family:var(--mono)}
.bnote summary::-webkit-details-marker{display:none}
.bnote textarea{margin-top:6px;min-height:64px}
.k-prime{--kc:var(--k-prime)} .k-focus{--kc:var(--k-focus)} .k-connect{--kc:var(--k-connect)} .k-move{--kc:var(--k-move)} .k-recharge{--kc:var(--k-recharge)} .k-close{--kc:var(--k-close)} .k-travel{--kc:var(--k-travel)}

/* ===== Checks ===== */
.checks{list-style:none;margin:0;padding:0}
.checks>li{border-bottom:1px solid var(--line)}
.ck{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer}
input[type=checkbox]{appearance:none;flex:none;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:4px;margin:2px 0 0;display:grid;place-content:center;cursor:pointer;background:transparent}
.steps input[type=checkbox],.subs input[type=checkbox]{width:15px;height:15px;border-width:1.2px;margin-top:3px}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:"";width:8px;height:4px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ck input:checked+span,.subs input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--gold)}
.ck small{display:block;color:var(--muted);font-size:12px}
.progress{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:7px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.progress.gold i{background:var(--gold)}

/* ===== Tasks ===== */
.task{border-bottom:1px solid var(--line);padding:12px 0}
.task-top{display:flex;gap:12px;align-items:flex-start}
.task-title{font-weight:600;flex:1;min-width:0}
.task.done .task-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--gold)}
.task-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center;font-weight:400}
.task-meta input[type=date]{border:1px solid var(--line);background:transparent;border-radius:4px;padding:1px 4px;font-size:12px}
.task details{margin:6px 0 0 30px}
.task details summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.task-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:8px}
.task-body .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.task-body textarea{min-height:92px}
.subs{list-style:none;margin:0;padding:0}
.subs li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:14px}
.subs label{display:flex;gap:9px;align-items:flex-start;cursor:pointer;flex:1}
.subadd{display:flex;gap:6px;margin-top:6px}
.subadd input{flex:1;padding:4px 8px;font-size:13px}
.task-bar{margin-left:30px;max-width:340px}
.notepeek{margin:4px 0 0 30px;font-size:13px;color:var(--muted);border-left:2px solid var(--gold);padding-left:8px;white-space:pre-wrap;max-height:3.1em;overflow:hidden}
.del{cursor:pointer;background:none;border:0;color:var(--muted);font-size:17px;line-height:1;padding:0 4px}
.del:hover{color:var(--accent)}
.queue{counter-reset:q}
.queue .task-title::before{counter-increment:q;content:counter(q);font-family:var(--serif);font-size:20px;margin-right:10px;color:var(--gold)}
.why{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ===== Inputs ===== */
input.txt,select.txt,textarea.txt{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea.txt{min-height:110px;resize:vertical;line-height:1.5}
.top3{display:flex;flex-direction:column;gap:8px;counter-reset:t}
.top3 div{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:8px}
.top3 div::before{counter-increment:t;content:counter(t);font-family:var(--serif);font-size:21px}
.capture{position:relative}
.capture input{padding-left:34px;font-size:15px}
.capture::before{content:"+";position:absolute;left:12px;top:6px;font-size:20px;color:var(--gold)}
.parse{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:22px}
.count-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.counter{border:1px solid var(--line);padding:10px 12px;border-radius:8px;background:var(--surface)}
.counter .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.counter .val{font-family:var(--serif);font-size:30px;line-height:1.1}
.counter .val small{font-family:var(--sans);font-size:12px;color:var(--muted)}
.counter .ctl{display:flex;gap:6px;margin-top:4px}
.counter button{cursor:pointer;border:1px solid var(--line);background:transparent;width:30px;height:26px;border-radius:5px;font-weight:700}
.counter button:hover{border-color:var(--ink)}
.counter.hit{border-color:var(--ok)}

/* ===== Tables ===== */
.tw{overflow-x:auto;border-top:1px solid var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{overflow-wrap:anywhere;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap}
tr.hl td,tr.hl th{background:var(--ink);color:var(--bg)}
td .txt,td select{padding:4px 6px;font-size:13px}
.addrow{display:grid;gap:8px;margin-top:12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));align-items:end}
.addrow label,.fld{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.stat{font-family:var(--serif);font-size:44px;line-height:1}
.stat small{font-family:var(--sans);font-size:14px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0}

/* ===== Calendar month ===== */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h3{font-family:var(--serif);font-weight:500;font-size:28px;margin:0 8px 0 0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{font-family:var(--mono);font-size:11px;color:var(--muted);padding:4px 6px}
.cell{all:unset;box-sizing:border-box;cursor:pointer;min-height:104px;padding:6px 7px;border-radius:6px;display:flex;flex-direction:column;gap:3px;font-size:11.5px;line-height:1.3;overflow:hidden;border:1px solid transparent}
.cell:hover{border-color:var(--ink)}
.cell.out{opacity:.35}
.cell.today{outline:2px solid var(--accent);outline-offset:-2px}
.cell .dn{font-family:var(--serif);font-size:20px;line-height:1;display:flex;justify-content:space-between;align-items:baseline}
.cell .dn small{font-family:var(--sans);font-size:10.5px;color:var(--muted)}
.cell .ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .ev.t{font-weight:700}
.cell .ev.e{color:var(--accent);font-weight:600}
.cell .dots{display:none;gap:3px;margin-top:auto}
.cell .dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cell .dots i.t{background:var(--ink)}
.l-atl{background:var(--c-atl)} .l-ny{background:var(--c-ny)} .l-paris{background:var(--c-paris)} .l-cali{background:var(--c-cali)} .l-travel{background:var(--c-travel)} .l-other{background:var(--c-travel)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px;background:var(--sw)}

/* ===== Week grid ===== */
.weekwrap{overflow-x:auto;border-top:2px solid var(--ink);padding-top:10px}
.week{display:grid;grid-template-columns:44px repeat(7,minmax(104px,1fr));min-width:800px;gap:0 4px}
.week .wh{font-size:12px;padding:4px 4px 8px;cursor:pointer;border-radius:6px}
.week .wh:hover{background:var(--surface)}
.week .wh b{display:block;font-family:var(--serif);font-size:22px;font-weight:500;line-height:1}
.week .wh.today b{color:var(--accent)}
.week .wh small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcol{position:relative;height:760px;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 39px,var(--line) 40px)}
.wcol.travel{background-color:var(--c-travel)}
.hours{position:relative;height:760px}
.hours span{position:absolute;right:6px;font-family:var(--mono);font-size:10px;color:var(--muted);transform:translateY(-50%)}
.wb{position:absolute;left:3px;right:3px;border-radius:4px;padding:2px 5px;font-size:10.5px;line-height:1.2;overflow:hidden;background:var(--kc);color:var(--bg);border:1px solid var(--bg)}
.wb b{font-weight:600}
.wb.done{opacity:.45}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--warn);z-index:2}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.budget{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:6px 0 10px}
.budget i{display:block;height:100%;background:var(--kc)}
.budget-key{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px;font-size:13px}
.budget-key div{display:flex;align-items:center;gap:8px}
.budget-key div::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--kc);flex:none}
.budget-key b{margin-left:auto;font-family:var(--mono);font-weight:500;font-size:12px}

/* ===== Travel ===== */
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:26px}
.trip{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.trip:hover{border-color:var(--ink)}
.trip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.trip .route{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.trip b{font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.1}
.trip .cd{font-family:var(--mono);font-size:12px}
.trip.past{opacity:.55}
.ticket{border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr) 150px;overflow:hidden;margin-bottom:12px}
.ticket .main{padding:14px 16px;min-width:0}
.ticket .stub{border-left:2px dashed var(--line);padding:14px;display:flex;flex-direction:column;gap:6px;justify-content:center;background:var(--sunk)}
.ticket .iata{display:flex;align-items:center;gap:14px;margin:4px 0 10px}
.ticket .iata b{font-family:var(--serif);font-size:36px;font-weight:500;line-height:1}
.ticket .iata .ln{flex:1;height:1px;background:var(--line);position:relative}
.ticket .iata .ln::after{content:"✈";position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:var(--surface);padding:0 6px;font-size:14px;color:var(--gold)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fgrid .txt{padding:5px 8px;font-size:13px}
.ready{font-family:var(--mono);font-size:11px}
.req{padding:12px 0;border-bottom:1px solid var(--line)}
.req h4{display:flex;gap:8px;align-items:center}

/* ===== Fuel ===== */
.menu{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:8px;min-width:940px}
.menuwrap{overflow-x:auto;border-top:2px solid var(--ink);padding-top:12px}
.mday{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mday.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mday h4{font-family:var(--serif);font-size:20px;font-weight:500;margin:0;display:flex;justify-content:space-between;align-items:baseline}
.meal .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meal p{margin:1px 0 0;font-size:13px;line-height:1.35}
.meal.out p{color:var(--accent);font-weight:600}
.meal.out .mac{font-family:var(--sans);font-size:12px;line-height:1.35}
.meal .mac{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.macro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.macro div{border-top:1px solid var(--line);padding-top:8px}
.macro b{display:block;font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.05}
.macro span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.avoid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.avoid div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px}
.avoid b{display:block;margin-bottom:2px}
.spark{width:100%;height:auto;display:block}
.spark text{font-family:var(--mono);font-size:10px;fill:var(--muted)}

/* ===== Guide ===== */
.spot{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.spot h4{margin:0;font-family:var(--serif);font-weight:500;font-size:19px}
.spot p{margin:2px 0 0;font-size:14px}
.spot .acts{display:flex;gap:6px;align-items:flex-start}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.event{display:grid;grid-template-columns:90px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.event .when{font-family:var(--serif);font-size:22px;line-height:1.05}
.event .when small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:3px}
.event h4{font-size:16px;margin:0}
.event p{margin:3px 0 0;font-size:14px}

/* ===== Command palette ===== */
.pal{position:fixed;inset:0;z-index:50;background:rgba(14,10,8,.55);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.pal .box{width:min(620px,100%);background:var(--surface);border:1px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 18px;font-size:17px;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li{padding:9px 12px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.pal li[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.pal li small{font-family:var(--mono);font-size:11px;opacity:.7;white-space:nowrap}
.pal .hint{font-family:var(--mono);font-size:11px;color:var(--muted);padding:8px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:60}

/* ===== Responsive ===== */
@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:940px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .topbar{display:block;position:sticky;top:0;z-index:20;background:var(--rail);color:var(--rail-ink);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0}
  .topbar .tb{display:flex;align-items:center;gap:10px;padding-bottom:6px}
  .topbar svg.logo{width:30px;height:30px}
  .topbar .tt{font-family:var(--serif);font-size:19px}
  .topbar .cmdk{all:unset;cursor:pointer;margin-left:auto;border:1px solid var(--rail-line);border-radius:7px;padding:4px 10px;font-size:12px;color:var(--rail-muted)}
  .topbar nav{display:flex;gap:2px;overflow-x:auto;padding-bottom:8px}
  .topbar nav button{all:unset;cursor:pointer;padding:6px 11px;border-radius:6px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--rail-ink)}
  .topbar nav button[aria-current="true"]{background:var(--rail-ink);color:var(--rail)}
  .grid2,.grid3{grid-template-columns:1fr;gap:28px}
  .colR{order:-1}
  main{padding-top:20px}
  .band{margin-top:-20px}
  .score{margin-left:0}
  .cell{min-height:60px;font-size:10px;padding:4px}
  .cell .ev{display:none}
  .cell .dots{display:flex}
  .event{grid-template-columns:72px 1fr}
  .event .acts{grid-column:2}
  .task-body{grid-template-columns:1fr}
  .ticket{grid-template-columns:1fr}
  .ticket .stub{border-left:0;border-top:2px dashed var(--line)}
}
@media (max-width:560px){
  .grid4{grid-template-columns:1fr 1fr}
  .ins{grid-template-columns:1fr;gap:4px}
  .band-now{grid-template-columns:1fr 1fr}
  .topbar .cmdk{min-width:28px;text-align:center}
  .ins .btn{justify-self:start}
  .macro{grid-template-columns:1fr 1fr}
  .blk.cur{margin:4px -8px}
  .ring{width:96px;height:96px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.req h4{flex-wrap:wrap}.req .chip{white-space:normal}
/* Models */
.mgrid{display:grid;grid-template-columns:1fr;gap:0;margin-bottom:28px;border-top:1px solid var(--ink)}
.mcard{border-bottom:1px solid var(--line);padding:14px 0}
.mcard>summary{cursor:pointer;list-style:none}
.mcard>summary::-webkit-details-marker{display:none}
.mcard .mh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mcard .mh b{font-family:var(--serif);font-size:20px;font-weight:500}
.mcard .mbody{padding:14px 0 4px}
.mcard .mbody th{text-align:left;vertical-align:top;width:120px;font-weight:600}
.mcard .pills .chip{white-space:normal}
h3.grp{font-family:var(--serif);font-weight:500;font-size:22px;margin:8px 0 8px}
.gantt{min-width:760px}
.grow{display:grid;grid-template-columns:180px 1fr;align-items:center;min-height:30px;border-bottom:1px solid var(--line)}
.gname{font-size:13px;padding-right:8px}
.gtrack{position:relative;height:30px}
.ghead .gtrack{height:24px}
.gm{position:absolute;top:4px;font-family:var(--mono);font-size:11px;color:var(--muted);border-left:1px solid var(--line);padding-left:4px;height:100%}
.gs{position:absolute;top:6px;bottom:6px;background:var(--sunk);border:1px solid var(--line)}
.gb{position:absolute;top:8px;height:14px;border-radius:3px}
.gb.opt{background:transparent!important;border:2px dashed var(--muted)}
.g-paris{background:var(--accent)}.g-ny{background:var(--info)}.g-atl{background:var(--gold)}
.gb.opt.g-paris{border-color:var(--accent)}.gb.opt.g-ny{border-color:var(--info)}
.gnow{position:absolute;top:0;bottom:0;border-left:2px solid var(--warn)}
.gnote{position:absolute;left:12px;top:7px;font-size:12px;color:var(--muted);font-style:italic}
.gk{display:inline-block;width:12px;height:8px;border-radius:2px}.gsk{background:var(--sunk);border:1px solid var(--line)}
@media (max-width:700px){.grow{grid-template-columns:120px 1fr}.mcard .mbody th{width:90px}}
.wb.wev{left:38%;right:2px;border:1px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.25);z-index:2}
.cal .ev.u{font-weight:600;color:var(--info)}
details.medit{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
details.block>summary{cursor:pointer}
/* Sign-in */
#auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--rail);color:var(--rail-ink)}
.authbox{width:100%;max-width:380px}
.authbox .logo{width:56px;height:56px}
.authbox h1{font-family:var(--serif);font-weight:500;font-size:40px;margin:14px 0 4px}
.authbox .muted{color:var(--rail-muted)}
.authbox form{display:grid;gap:12px;margin-top:20px}
.authbox label{display:grid;gap:4px;font-size:13px;color:var(--rail-muted)}
.authbox .txt{background:var(--rail-hi);color:var(--rail-ink);border-color:var(--rail-line)}
.authbox .btn.solid{background:var(--gold);color:var(--rail);border-color:var(--gold)}
.authlinks{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px}
.authlinks .linkbtn{color:var(--rail-ink)}
.authmsg{margin-top:14px;padding:10px 12px;border-left:3px solid var(--gold);background:var(--rail-hi);font-size:14px}

/* ================= Executive layer (2026-10 redesign) ================= */
:root{--gold-x:#C9A46A}
:root[data-theme="dark"]{--bg:#0E0B09;--surface:#16120F;--sunk:#0A0807;--ink:#EDE4D9;--muted:#A3958A;--line:#2A221C;--gold:#C9A46A;--rail:#0B0907;--rail-line:#221B16;--rail-hi:#1C1612}
body{background:var(--bg)}
main{max-width:1600px}
body[data-view="today"] main{padding-top:18px}
.xi{width:18px;height:18px;flex:none}.xi.sm{width:14px;height:14px}.xi.lg{width:26px;height:26px}
/* Sidebar */
.rail{padding:26px 16px 18px;gap:0}
.xbrand{padding:0 8px 22px;border-bottom:1px solid var(--rail-line);margin-bottom:16px}
.mono-dc{font-family:var(--serif);font-size:34px;letter-spacing:-2px;color:var(--rail-ink);line-height:1}
.mono-dc.sm{font-size:22px}
.xbrand b{display:block;font-family:var(--serif);font-weight:400;letter-spacing:.14em;text-transform:uppercase;font-size:17px;margin-top:12px}
.xbrand span{display:block;font-size:13px;color:var(--rail-muted);margin-top:4px}
.xnavlist{display:flex;flex-direction:column;gap:4px}
.rail button.nv{padding:11px 14px;border-radius:6px;font-size:15px;gap:14px;border-left:2px solid transparent}
.rail button.nv svg{width:19px;height:19px}
.rail button.nv[aria-current="true"]{background:linear-gradient(90deg,rgba(201,164,106,.18),rgba(201,164,106,.04));color:var(--rail-ink);border-left-color:var(--gold-x)}
.rail button.nv[aria-current="true"] svg{color:var(--gold-x)}
.xsep{border:0;border-top:1px solid var(--rail-line);margin:14px 6px}
.xlabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rail-muted);margin:26px 8px 10px}
.xco{display:flex;flex-direction:column;gap:8px}
.xcard{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--rail-line);border-radius:8px;color:var(--rail-ink);text-decoration:none;background:rgba(255,255,255,.015)}
.xcard:hover{border-color:var(--gold-x)}
.xcard b{display:block;font-family:var(--serif);font-weight:500;letter-spacing:.08em;font-size:14px}
.xcard small{display:block;font-size:11.5px;color:var(--rail-muted)}
.xcard .xi{margin-left:auto;color:var(--rail-muted)}
.cm{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold-x);color:var(--gold-x);font-family:var(--serif);font-size:14px;flex:none}
.cm-casa{border-color:#B9B0A4;color:#E5DED4}.cm-cavyre{border-color:#E5DED4;color:#E5DED4;font-size:11px;letter-spacing:-1px}.cm-me{border-color:var(--line);color:var(--muted)}
.xclocks{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-family:var(--mono);font-size:12px;color:var(--rail-muted);margin:26px 8px 0;padding-top:18px;border-top:1px solid var(--rail-line)}
.xclocks b{font-weight:500;color:var(--rail-ink);text-align:right}
.xme{display:flex;align-items:center;gap:12px;margin:auto 8px 6px;padding-top:22px}
.xme .av{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#6E5546;color:#F3E9DD;font-family:var(--serif);font-size:15px;flex:none}
.xme b{display:block;font-size:13px;font-weight:600}.xme small{display:block;font-size:12px;color:var(--rail-muted)}
.rail button.nv.xset{font-size:13.5px;color:var(--rail-muted);padding:8px 14px}
.xsave{font-size:11px;color:var(--rail-muted);padding:4px 14px 0}
.topbar nav a.tco{all:unset;cursor:pointer;padding:6px 10px;border:1px solid var(--rail-line);border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--gold-x)}
/* Hero */
.xhero{position:relative;border-radius:10px;overflow:hidden;background:radial-gradient(120% 140% at 85% 10%,#3A2C22 0%,#1A1410 45%,#0E0B09 100%);color:#F3EADF;margin-bottom:14px;border:1px solid var(--line)}
.xhero::before{content:"";position:absolute;inset:0;background:var(--hero,none) center/cover no-repeat;opacity:.55}
.xhero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,11,9,.94) 0%,rgba(14,11,9,.7) 45%,rgba(14,11,9,.35) 70%,rgba(14,11,9,.82) 100%)}
.xhero-in{position:relative;z-index:1;padding:20px 26px 22px}
.xeyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#CFC3B6}.xeyebrow i{font-style:normal;margin:0 .6em;opacity:.6}
.xhero-row{display:grid;grid-template-columns:auto auto auto 1fr auto auto;align-items:center;gap:26px;margin-top:6px}
.xnum{font-family:var(--serif);font-size:clamp(96px,10vw,150px);line-height:.86;letter-spacing:-.04em;font-weight:400}
.xday .d{font-family:var(--serif);font-style:italic;font-size:clamp(38px,4vw,58px);line-height:1}
.xday .m{font-size:17px;margin-top:8px;color:#E3D8CB}
.xday .loc{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-x);margin-top:6px}
.xquote{font-family:var(--serif);font-size:17px;line-height:1.45;padding-left:24px;border-left:1px solid rgba(243,234,223,.3);color:#EDE3D7}
.xsig{font-family:var(--serif);font-style:italic;font-size:64px;color:var(--gold-x);opacity:.55;letter-spacing:-6px;align-self:end}
.xtag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-align:right;max-width:210px;align-self:end;color:#E9DFD3}
.xscore{display:flex;align-items:center;gap:18px}
.xring{width:76px;height:76px;color:currentColor}.xring.lg{width:120px;height:120px}
.xring text{font-family:var(--serif);font-size:22px;fill:currentColor}.xring tspan{font-size:11px}
.xring.sm{width:34px;height:34px}.xring.sm text{font-size:26px;font-family:var(--sans);font-weight:600}.xring.sm tspan{font-size:16px}
.xscore dl{display:grid;grid-template-columns:auto auto;gap:4px 20px;margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.xscore dt{color:#B8AB9E}.xscore dd{margin:0;text-align:right}
/* Strip */
.xstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:22px}
.xstat{position:relative;display:flex;gap:14px;align-items:center;padding:16px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.xstat .xi{color:var(--ink);opacity:.85}
.xstat .lbl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.xstat b{display:block;font-family:var(--serif);font-weight:500;font-size:19px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xstat small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.xstat>div{min-width:0}
.badge2{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--gold-x);color:#1A140F;font-weight:600}
/* Big 3 */
.xsec-h{display:flex;align-items:baseline;gap:14px;margin:0 0 10px}
.xsec-h h3{font-family:var(--serif);font-weight:400;letter-spacing:.22em;text-transform:uppercase;font-size:17px;margin:0}
.xsec-h .linkbtn{margin-left:auto}
.xbig3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
.xb3{position:relative;display:flex;gap:22px;align-items:center;padding:20px 22px;border:1px solid var(--line);border-radius:8px;min-height:84px;overflow:hidden;background:linear-gradient(110deg,#1A1511 0%,#231B15 60%,#2E241C 100%)}
.xb3.b3-casa{background:linear-gradient(110deg,#1A1511 0%,#201C18 55%,#2B2722 100%)}
.xb3.b3-cavyre{background:linear-gradient(110deg,#1A1511 0%,#1E1A17 55%,#26211D 100%)}
.xb3 .n{font-family:var(--serif);font-size:44px;line-height:1;color:#E7DDD1}
.xb3 b{display:block;font-family:var(--serif);font-weight:500;font-size:22px;color:#F1E8DD}
.xb3 span:not(.n){display:block;color:#E3D8CB;font-size:15px;margin-top:2px}
.xb3 small{display:block;color:#A99B8E;font-size:13px;margin-top:2px}
.xb3 .go{margin-left:auto;align-self:flex-end;display:grid;place-items:center;width:32px;height:32px;border-radius:6px;background:rgba(243,234,223,.12);color:#F1E8DD}
.xb3 .go:hover{background:var(--gold-x);color:#1A140F}
.xbigedit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:-10px 0 22px}.xbigedit label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
/* Main grid */
.xmain{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:16px;align-items:start}
.xright{display:flex;flex-direction:column;gap:16px;min-width:0}
.xpanel{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:16px 16px;min-width:0}
.xpanel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.xpanel-h h3,.xpanel h4{font-family:var(--serif);font-weight:500;font-size:20px;margin:0}
.xpanel h4{font-size:17px;margin-bottom:8px}
.xpanel-h .linkbtn,.xpanel-h select{margin-left:auto}
.linkbtn .xi{vertical-align:-2px}
/* Paper (light) panels */
.paper{--ink:#1E1712;--muted:#6E6157;--line:#E2D9CD;--surface:#F4EFE8;background:#F4EFE8;color:#1E1712;border-radius:8px}
.paper .btn{border-color:#CFC4B6;color:#1E1712}.paper .btn.solid{background:#14100D;color:#F4EFE8;border-color:#14100D}
.sched{padding:18px 20px}
.sched-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sched-h h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 12px 0 0}
.sched-h .addev{margin-left:auto}
.ib{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:6px;color:inherit}
.ib:hover{border-color:var(--gold-x)}
.datepill{border:1px solid var(--line);border-radius:6px;padding:5px 14px;font-size:13px;font-weight:600}
.addevbox{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;background:#FBF8F3}
.srows{border-top:1px solid var(--line)}
.srow{position:relative;border-bottom:1px solid var(--line)}
.srow>details>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:118px 3px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 40px 9px 6px}
.srow>details>summary::-webkit-details-marker{display:none}
.srow time{font-family:var(--mono);font-size:11.5px;color:#5E5249}
.sbar{width:3px;height:22px;border-radius:2px;background:var(--tc,#8F8378)}
.stt b{font-size:13.5px;font-weight:600;margin-right:10px}.stt small{font-size:12.5px;color:#7A6D62}
.stt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11.5px;padding:3px 10px;border-radius:4px;background:var(--pc,#E8E1D8);color:var(--tc,#5E5249);white-space:nowrap;min-width:64px;text-align:center}
.srow>input[type=checkbox]{position:absolute;right:8px;top:12px;width:16px;height:16px;accent-color:#14100D}
.srow.cur{background:#EFE0CC}
.srow.done .stt b,.srow.done .stt small{text-decoration:line-through;opacity:.55}
.sbody{padding:4px 46px 14px 142px}.sbody .steps{margin:0 0 10px}.sbody textarea{min-height:56px;background:#FBF8F3}
.golink{text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.t-mdv{--tc:#3F5A86;--pc:#D9E0EC}.t-casa{--tc:#4E6B4A;--pc:#DCE6D8}.t-cavyre{--tc:#A2493A;--pc:#F3D9D2}.t-personal{--tc:#8B7B6C;--pc:#E9E2D8}.t-body{--tc:#B26A3C;--pc:#F4DECD}.t-recovery{--tc:#9A7A3A;--pc:#F1E5CB}.t-travel{--tc:#5A4862;--pc:#E5DDEA}.t-meeting{--tc:#3F5666;--pc:#DCE4EA}.t-focus{--tc:#7A3218;--pc:#F0D8CC}
/* Life essentials */
.xlife{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.xlc{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:118px;padding:12px 10px;border-radius:7px;border:1px solid var(--line);background:linear-gradient(180deg,#2A211B 0%,#16120F 100%);color:#F1E8DD;overflow:hidden}
.xlc .xi.lg{position:absolute;top:12px;left:10px;opacity:.55;width:24px;height:24px}
.xlc b{font-family:var(--serif);font-weight:500;font-size:17px}
.xlc small{font-size:11px;color:#B5A797;line-height:1.3;padding-right:30px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xlc .xring.sm{position:absolute;right:6px;bottom:8px}
.xlc:hover,.xlc[aria-pressed="true"]{border-color:var(--gold-x)}
.lc-fuel{background:linear-gradient(180deg,#2C2319 0%,#16120F 100%)}.lc-care{background:linear-gradient(180deg,#241F1B 0%,#16120F 100%)}.lc-travel{background:linear-gradient(180deg,#26211F 0%,#16120F 100%)}
.xlife.big{grid-template-columns:repeat(6,minmax(0,1fr))}.xlife.big .xlc{min-height:150px}
/* Briefing */
.xbrief{display:flex;flex-direction:column}
.xbr{display:grid;grid-template-columns:30px 110px minmax(0,1fr) auto 30px;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.xbr:first-child{border-top:0}
.xbr .nm{font-size:13px;font-weight:600}
.xbr p{margin:0;font-size:13px}.xbr p small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.xbr .cnt{font-size:12.5px;color:var(--muted);white-space:nowrap}
/* Upcoming + quick actions */
.xduo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.txt.sm{padding:4px 8px;font-size:12.5px;width:auto}
.xup{padding:4px 0}
.xu{display:grid;grid-template-columns:48px 16px minmax(0,1fr);gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.xu:last-child{border-bottom:0}
.xu .dt{font-size:12px;color:var(--muted)}
.xu b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.xu small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xqa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qa{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:62px;border-radius:6px;background:#F4EFE8;color:#1E1712;font-size:12.5px;font-weight:600;text-align:center;padding:6px}
.qa.qo{flex-direction:row;min-height:38px;text-decoration:none}
.qa:hover{outline:2px solid var(--gold-x)}
/* Check-in */
.xcheck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.xcheck .count-row{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1280px){.xhero-row{grid-template-columns:auto auto 1fr auto}.xsig,.xtag{display:none}.xstrip{grid-template-columns:repeat(3,minmax(0,1fr))}.xmain{grid-template-columns:1fr}.xlife{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.xhero-row{grid-template-columns:auto 1fr;gap:16px}.xquote{display:none}.xscore{grid-column:1/-1}.xbig3,.xcheck,.xduo,.xbigedit{grid-template-columns:1fr}.xstrip{grid-template-columns:repeat(2,minmax(0,1fr))}.xlife.big{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.xhero-in{padding:16px}.xnum{font-size:84px}.xstrip{grid-template-columns:1fr 1fr}.xstat{padding:12px}.xstat b{font-size:16px}.xstat .xi.lg{display:none}.srow>details>summary{grid-template-columns:62px 3px minmax(0,1fr);padding-right:34px}.srow .pill{display:none}.srow time{font-size:10.5px}.stt{white-space:normal}.stt small{display:block}.sbody{padding:4px 12px 14px}.xbr{grid-template-columns:30px minmax(0,1fr) 30px}.xbr .nm,.xbr .cnt{display:none}.xlife,.xlife.big{grid-template-columns:repeat(2,minmax(0,1fr))}.xqa{grid-template-columns:repeat(2,minmax(0,1fr))}.xscore dl{grid-template-columns:auto auto auto auto}.xring.lg{width:92px;height:92px}.sched{padding:14px 12px}.xb3 .n{font-size:34px}}
.xlife:not(.big) .xlc small{display:none}.xlife:not(.big) .xlc{min-height:104px}
/* Day templates (executive) */
.tplbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;margin-bottom:6px;scrollbar-width:none}
.tplbar::-webkit-scrollbar{display:none}
.tplchip{all:unset;cursor:pointer;white-space:nowrap;padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;color:var(--muted)}
.tplchip:hover{border-color:var(--gold-x);color:var(--ink)}
.tplchip[aria-pressed="true"]{background:var(--gold-x);border-color:var(--gold-x);color:#1A140F;font-weight:600}
.tplgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.tplsum{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.tplsum .pill{min-width:0}
.tplsteps{margin:0 0 10px;padding-left:18px;font-size:13px;line-height:1.6;color:#3A2F27}
.mkt{display:flex;flex-direction:column}
.mkt-h,.mkt-r{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:14px;padding:10px 2px;border-top:1px solid var(--line)}
.mkt-h{border-top:0;padding-top:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.mkt-h b{font-weight:500}
.mkt-d{font-family:var(--serif);font-size:16px;color:var(--gold-x)}
.mkt-r span:not(.mkt-d){display:block;font-size:13px;line-height:1.45}.mkt-r span+span{margin-top:3px;color:var(--muted)}
.mkt-l{display:none}
.rules{margin:0;padding:0;list-style:none;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.rules li:first-child{border-top:0}
.rules li::before{content:counter(r,decimal-leading-zero);font-family:var(--serif);color:var(--gold-x);font-size:15px}
@media (max-width:1100px){.tplgrid{grid-template-columns:1fr}}
@media (max-width:600px){.mkt-h{display:none}.mkt-r{grid-template-columns:1fr;gap:6px}.mkt-l{display:block;font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}.tplchip{padding:7px 13px;font-size:13px}}
/* Life cards: ring top-right, text full-width at bottom */
.xlc .xring.sm{top:10px;right:10px;bottom:auto}
.xlc b{display:block;line-height:1.15;overflow-wrap:anywhere;font-size:16px}
.xlc small{padding-right:0}
.xlife:not(.big) .xlc{min-height:112px}
.xlife:not(.big){grid-template-columns:repeat(6,minmax(0,1fr))}
.xlife:not(.big) .xlc{padding:12px 10px;container-type:inline-size}
.xlife:not(.big) .xlc b{white-space:nowrap;overflow-wrap:normal;font-size:clamp(11px,13cqi,17px);letter-spacing:0;overflow:hidden;text-overflow:clip}
.xlc .xring.sm{width:30px;height:30px}
.xlc .xi.lg{width:22px;height:22px}
@media (max-width:600px){.xlife:not(.big){display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px}.xlife:not(.big)::-webkit-scrollbar{display:none}.xlife:not(.big) .xlc{flex:0 0 31%;scroll-snap-align:start}}
/* Reschedule */
.resched{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#FBF8F3}
.rs-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.rs-h b{font-size:13px}
.rs-q{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.resched .chip{all:unset;cursor:pointer;font-size:12px;padding:4px 10px;border:1px solid #CFC4B6;border-radius:999px}
.resched .chip:hover{border-color:#14100D}
.rs-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.rs-f label{font-size:12px;color:#6E6157}.rs-f .txt{background:#fff;margin-top:4px}
.rs-a{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.movedtag{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9A5A1E;background:#F4DECD;border-radius:4px;padding:2px 6px;margin-right:8px}
/* Urgent alert */
.urgent{border:1px solid #8E3B2E;background:linear-gradient(180deg,rgba(162,73,58,.22),rgba(162,73,58,.08));border-radius:8px;padding:12px 16px;margin-bottom:16px}
.urg-h{display:flex;align-items:center;gap:10px;color:#F3D9D2}.urg-h .xi{color:#E8836F}
.urg-h b{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#1A0F0C;background:#E8836F;padding:3px 8px;border-radius:4px}
.urg-h span{font-size:14px;font-weight:600}.urg-h .linkbtn{margin-left:auto;color:#F3D9D2}
.urg-list{margin-top:10px;display:flex;flex-direction:column}
.urg-r{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid rgba(232,131,111,.25)}
.urg-r input[type=checkbox]{width:16px;height:16px;accent-color:#E8836F}
.urg-t b{display:block;font-size:14px;color:var(--ink)}.urg-t small{display:block;font-size:12px;color:#D9B3A9;margin-top:2px}
.urg-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.urg-a .txt.sm{margin-left:6px}
@media (max-width:600px){.urg-r{grid-template-columns:20px minmax(0,1fr)}.urg-a{grid-column:2;justify-content:flex-start}.rs-q{margin-left:0}}
.dayhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 16px}
.dh-t{display:flex;align-items:center;gap:14px}.dh-t b{display:block;font-family:var(--serif);font-style:italic;font-size:26px;font-weight:400}.dh-t small{color:var(--muted);font-size:13px}
.xnum.sm{font-size:56px;line-height:1}
.dayhead>.btn:last-child{margin-left:auto}
@media (max-width:600px){.dayhead>.btn:last-child{margin-left:0}.xnum.sm{font-size:44px}}
/* ================= Smart calendar ================= */
.smartadd{margin:0 0 18px}
.sa-in{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 14px;background:var(--surface)}
.sa-in:focus-within{border-color:var(--gold-x)}
.sa-in .txt{border:0;background:transparent;flex:1;min-width:0;padding:8px 4px;font-size:15px}
.sa-in .txt:focus{outline:none;box-shadow:none}
.sa-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:24px}
.chip.warn{background:#5A2A20;color:#F3D9D2;border-color:#8E3B2E}
/* clickable calendar items */
.cal .cell{cursor:pointer;text-align:left}
.cal .ev[role=button]{display:block;cursor:pointer;border-radius:3px}
.cal .ev[role=button]:hover{background:rgba(201,164,106,.18)}
.cal .ev.done{text-decoration:line-through;opacity:.55}
.cal .dn{display:flex;align-items:baseline;gap:4px}
.cadd{margin-left:auto;font-style:normal;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;font-size:14px;line-height:1;opacity:0;transition:opacity .15s;background:var(--gold-x);color:#1A140F;cursor:pointer}
.cal .cell:hover .cadd,.cal .cell:focus-within .cadd{opacity:1}
@media (hover:none){.cadd{opacity:.85}}
.wcol{cursor:copy}
.wb[role=button]{cursor:pointer}.wb[role=button]:hover{filter:brightness(1.15);z-index:3}
.wb.done{opacity:.5}.wb.done b{text-decoration:line-through}
.xu.click{cursor:pointer}.xu.click:hover b{text-decoration:underline}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
/* item sheet */
body.sheet-open{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:80}
.sheet-bg{position:absolute;inset:0;background:rgba(8,6,5,.6);backdrop-filter:blur(2px)}
.sheet-card{position:absolute;top:0;right:0;bottom:0;width:min(480px,100%);display:flex;flex-direction:column;border-radius:12px 0 0 12px;box-shadow:-20px 0 60px rgba(0,0,0,.45);animation:sheetin .18s ease-out}
@keyframes sheetin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{position:relative;padding:22px 22px 16px;border-bottom:1px solid var(--line);border-left:4px solid var(--tc,#8F8378);border-radius:12px 0 0 0}
.sheet-h .ib{position:absolute;top:16px;right:16px;font-size:20px}
.sheet-h h3{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.15;margin:10px 40px 6px 0}
.sheet-h p{margin:0;color:#5E5249;font-size:14px}
.sheet-body{flex:1;overflow-y:auto;padding:16px 22px 28px}
.sheet-act{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.sheet-act label.btn{cursor:pointer}.sr{position:absolute;opacity:0;width:1px;height:1px}
.sheet-warn{display:flex;gap:8px;align-items:flex-start;background:#F3D9D2;color:#5A2A20;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.sheet-info{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.sheet-r{display:flex;gap:10px;align-items:center;font-size:14px}.sheet-r .xi{color:#7A6D62}
.sheet-notes{white-space:pre-wrap;font-size:14px;line-height:1.55;background:#FBF8F3;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.late{color:#A2493A}
.sheet-sub{font-family:var(--serif);font-weight:500;font-size:17px;margin:16px 0 8px}
.sheet-body textarea.txt{min-height:70px;background:#fff}
.sheet-danger{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.sheet-danger .linkbtn{color:#A2493A}
.rs-f.wide{grid-template-columns:repeat(2,minmax(0,1fr))}.rs-f .full{grid-column:1/-1}
.evedit .rs-f .txt{background:#fff}
@media (max-width:600px){.sheet-card{top:auto;left:0;width:100%;max-height:90vh;border-radius:14px 14px 0 0;animation:sheetup .2s ease-out}.sheet-h{border-radius:14px 14px 0 0}
 @keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
 .sa-in{flex-wrap:wrap}.sa-in .txt{flex-basis:100%}.cal .ev[role=button]{padding:2px 0}}
.wh{position:relative}.wh .cadd{position:absolute;top:6px;right:6px}.wh:hover .cadd{opacity:1}
#itemsheet .resched [data-act=rsdel]{display:none}
@media (max-width:600px){.sa-in .txt{flex-basis:calc(100% - 34px)}.sa-in .btn{flex:1}}
/* Outlook */
.badge2.inl{position:static;margin-left:6px}
.mail{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 4px;border-top:1px solid var(--line);color:inherit;text-decoration:none;position:relative}
.mrow:first-child{border-top:0}.mrow:hover{background:rgba(201,164,106,.06)}
.mdot{width:7px;height:7px;border-radius:50%;margin-top:6px}.mrow.unread .mdot{background:var(--gold-x)}
.mrow b{display:block;font-size:13px;font-weight:600}.mrow:not(.unread) b{font-weight:500;color:var(--muted)}
.mrow span{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mrow small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow time{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mflag{position:absolute;right:4px;bottom:8px;font-style:normal;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#E8836F}
.mfoot{margin:8px 0 0}
.okdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4E9A5E;margin-right:6px}
.dest{display:block;font-size:12px;color:#6E6157;margin-bottom:10px}.dest .txt{background:#fff;margin-top:4px}
.t-outlook{--tc:#2F5E9E;--pc:#DCE6F4}

/* ---------- Mail ---------- */
.badge.gold{background:var(--gold);color:#1d1a17}
.mx{display:grid;grid-template-columns:190px minmax(280px,360px) minmax(0,1fr);border:1px solid var(--line);border-radius:10px;background:var(--surface);height:calc(100vh - 210px);min-height:520px;overflow:hidden}
.mx-folders{display:flex;flex-direction:column;gap:2px;padding:12px 10px;border-right:1px solid var(--line);background:var(--sunk);overflow:auto}
.mx-new{justify-content:center;margin-bottom:10px;display:flex;gap:6px;align-items:center}
.mx-f{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;font-size:14px}
.mx-f:hover{background:var(--surface)}
.mx-f[aria-current=true]{background:var(--surface);font-weight:700;box-shadow:inset 3px 0 0 var(--gold)}
.mx-f b{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--gold)}
.mx-f:focus-visible,.mx-row:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.mx-list{border-right:1px solid var(--line);overflow:auto;min-width:0}
.mx-search{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mx-search .txt{flex:1;min-width:0;margin:0}
.mx-lh{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.mx-lh .linkbtn{text-transform:none;letter-spacing:0;display:inline-flex;gap:4px;align-items:center}
.mx-pad{padding:14px}
.mx-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:10px minmax(0,1fr) auto;column-gap:8px;row-gap:2px;width:100%;padding:11px 14px;border-bottom:1px solid var(--line)}
.mx-row:hover{background:var(--sunk)}
.mx-row[aria-current=true]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--gold)}
.mx-dot{width:7px;height:7px;border-radius:50%;margin-top:6px}
.mx-row.unread .mx-dot{background:var(--gold)}
.mx-who{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-row.unread .mx-who,.mx-row.unread .mx-sub{font-weight:700}
.mx-row time{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mx-sub,.mx-pre{grid-column:2/4;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-pre{color:var(--muted);font-size:12.5px;grid-column:2/3}
.mx-ic{grid-column:3;grid-row:3;display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:12px}
.mx-flagged{color:var(--warn)}
.mx-tag{font-style:normal;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:6px;color:var(--muted)}
.mx-tag.hi{color:var(--warn);border-color:var(--warn)}
.mx-more{margin:12px auto;display:block}
.mx-pane{overflow:auto;min-width:0;display:flex;flex-direction:column}
.mx-empty{margin:auto;text-align:center;color:var(--muted);padding:30px}
.mx-empty .xi{width:34px;height:34px;opacity:.5}
.mx-read,.mcomp{display:flex;flex-direction:column;gap:12px;padding:14px 20px 20px;min-height:100%;box-sizing:border-box}
.mx-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1;padding-top:2px}
.mx-bar .btn{display:inline-flex;gap:5px;align-items:center}
.mx-sp{flex:1}
.mx-back{display:none!important}
.ibtn{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:6px;border:1px solid var(--line)}
.ibtn:hover{background:var(--sunk)}.ibtn:focus-visible{outline:2px solid var(--gold)}
.ibtn.on{color:var(--warn);border-color:var(--warn)}
.mx-subj{margin:4px 0 0;font-size:21px;line-height:1.25}
.mx-meta{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:start}
.mx-meta>div{min-width:0;overflow-wrap:anywhere}
.mx-av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700}
.mx-att{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.mx-att span{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--sunk)}
.mx-frame{flex:1;width:100%;min-height:420px;border:1px solid var(--line);border-radius:8px;background:#fff}
.mx-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.55}
.mx-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mx-foot .btn{display:inline-flex;gap:5px;align-items:center}
.mx-ct{font-size:15px}
.mx-fld{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
.mx-fld span{width:58px;font-size:13px;color:var(--muted)}
.mx-fld input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;padding:8px 0;color:inherit;outline:none}
.mx-fld input[readonly]{color:var(--muted)}
.mx-fld:focus-within{border-color:var(--gold)}
.mx-body{flex:1;min-height:240px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;font-size:15px;line-height:1.55;background:var(--bg);color:inherit}
.mx-body:focus{outline:2px solid var(--gold);outline-offset:-1px}
.mx-quote{border-left:3px solid var(--line);padding:4px 12px;color:var(--muted);font-size:13px}
.mx-quote p{margin:4px 0;white-space:pre-wrap;max-height:7.5em;overflow:hidden}
@media (max-width:1100px){
 .mx{grid-template-columns:minmax(260px,330px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 .mx-folders{grid-column:1/-1;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;gap:4px}
 .mx-new{margin:0 6px 0 0;flex:0 0 auto}
 .mx-f{flex:0 0 auto;padding:6px 10px;font-size:13px}
 .mx-f[aria-current=true]{box-shadow:inset 0 -3px 0 var(--gold)}
}
@media (max-width:700px){
 .mx{grid-template-columns:minmax(0,1fr);height:auto;min-height:0;border-radius:8px;overflow:visible}
 .mx-folders .xi{display:none}
 .mx-list{border-right:0}
 .mx.pane-on .mx-list,.mx.pane-on .mx-folders{display:none}
 .mx:not(.pane-on) .mx-pane{display:none}
 .mx-back{display:inline-flex!important}
 .mx-read,.mcomp{padding:12px 14px 18px}
 .mx-bar{top:0}
 .mx-subj{font-size:19px}
 .mx-meta{grid-template-columns:34px minmax(0,1fr)}.mx-meta time{grid-column:2}
 .mx-frame{min-height:65vh}
 .mx-body{min-height:200px}
}
.wg-steps{margin:8px 0 12px;padding-left:20px;line-height:1.6}

/* ---------- Phones: no zoom on load or when typing ---------- */
/* iPhone Safari zooms the whole page in when a field under 16px gets focus, and keeps it zoomed. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (pointer:coarse){input,select,textarea,.txt,.mx-fld input,.mx-body,.sa-in .txt,.fgrid .txt{font-size:16px!important}}
.mx-err{border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:13px;margin:0}

/* ================= DaySilk Portal shell (desks, command, flows, Vera) ================= */
:root{--f-daily:#9A7134;--f-work:#3F5F8A;--f-health:#4C7041;--hq-glass:rgba(255,255,255,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--f-daily:#D2AE6E;--f-work:#8FAAD3;--f-health:#9DBB86}}
:root[data-theme="dark"]{--f-daily:#D2AE6E;--f-work:#8FAAD3;--f-health:#9DBB86}
:root[data-theme="light"]{--f-daily:#9A7134;--f-work:#3F5F8A;--f-health:#4C7041}
main{padding-top:22px}
body[data-view="today"] main{padding-top:14px}

/* Sidebar */
.hb-brand{display:flex;align-items:center;gap:14px}
.hb-brand b{margin-top:0!important}
.hb-search{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;margin:0 4px 14px;padding:9px 12px;border:1px solid var(--rail-line);border-radius:8px;color:var(--rail-muted);font-size:13px}
.hb-search:hover{border-color:var(--gold-x);color:var(--rail-ink)}
.hb-search kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;border:1px solid var(--rail-line);border-radius:4px;padding:0 5px}
.pv-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:34px 34px 30px;margin:0 0 26px;border:1px solid var(--line);border-radius:10px;background:radial-gradient(120% 140% at 0% 0%,rgba(200,169,106,.13),transparent 55%),linear-gradient(180deg,#1d1814,#120f0d)}
.pv-hero h2{font-family:var(--serif,"Bodoni Moda",serif);font-weight:400;font-size:clamp(34px,4.4vw,56px);line-height:1.02;margin:10px 0 10px;letter-spacing:-.01em}.pv-hero p{color:var(--muted,#a99);max-width:620px;margin:0}
.pv-hring{display:flex;flex-direction:column;align-items:center;gap:6px}.pv-hring small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted,#a99)}
.pv-duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}.pv-duo>.xpanel{margin:0}
.pv-goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:18px}.pv-goal{margin:0}
.pv-gh{display:grid;grid-template-columns:auto 1fr 64px;gap:14px;align-items:center;margin-bottom:14px}.pv-gh .n,.pv-n{font-family:var(--serif,serif);font-size:30px;color:var(--gold-x,#c8a96a);line-height:1}.pv-n{font-size:18px;margin-right:6px}.pv-gh h3{margin:0;font-family:var(--serif,serif);font-weight:400;font-size:22px}.pv-gh small{color:var(--muted,#a99)}.pv-gh .xring{width:64px;height:64px}
.pv-tl{position:relative;padding-left:14px;border-left:1px solid var(--line)}.pv-ms{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}.pv-ms input{margin-top:3px}.pv-ms b{display:block;font-weight:500}.pv-ms small{color:var(--muted,#a99)}.pv-ms.done b{text-decoration:line-through;opacity:.55}
.pv-list{list-style:none;margin:0;padding:0}.pv-list li{position:relative;padding:9px 0 9px 18px;border-bottom:1px solid var(--line)}.pv-list li:last-child{border-bottom:0}.pv-list li:before{content:"";position:absolute;left:2px;top:17px;width:6px;height:6px;border-radius:50%;background:var(--gold-x,#c8a96a)}
.pv-steps{list-style:none;margin:0;padding:0}.pv-steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.pv-steps li:last-child{border-bottom:0}.pv-steps .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--gold-x,#c8a96a);color:var(--gold-x,#c8a96a);display:grid;place-items:center;font-size:12px}
.pv-week{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}.pv-wd{margin:0;display:flex;flex-direction:column;gap:6px}.pv-wd b{font-family:var(--serif,serif);font-weight:400;font-size:20px}.pv-wd small{color:var(--muted,#a99)}
.pv-big{font-family:var(--serif,serif);font-size:28px;margin:4px 0}.pv-alert{display:flex;flex-direction:column;gap:4px;padding:16px 18px;margin-bottom:18px;border-radius:8px;border:1px solid rgba(214,120,90,.5);background:rgba(214,120,90,.08)}
@media (max-width:760px){.pv-duo{grid-template-columns:1fr}.pv-hero{flex-direction:column;align-items:flex-start;padding:24px}}
.pv-on{max-width:760px}.pv-bar{display:block;height:6px;background:var(--line,#333);border-radius:4px;overflow:hidden;margin:14px 0 6px}.pv-bar.sm{height:4px;margin:6px 0}.pv-bar i{display:block;height:100%;background:var(--accent,#c8a96a)}
.pv-q{margin:18px 0}.pv-ql{display:block;font-weight:600;margin-bottom:8px}.pv-n{display:inline-block;min-width:26px;color:var(--accent,#c8a96a);font-variant-numeric:tabular-nums}
.pv-opts{display:flex;flex-wrap:wrap;gap:6px}.pv-opt{border:1px solid var(--line,#444);background:transparent;color:inherit;border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}.pv-opt[aria-pressed=true]{background:var(--ink,#eee);color:var(--bg,#111);border-color:transparent}
.pv-habs{display:flex;flex-direction:column;gap:6px}.pv-hab{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line,#333);background:transparent;color:inherit;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}.pv-hab[aria-pressed=true]{opacity:.55}.pv-hab[aria-pressed=true] span{text-decoration:line-through}
.pv-day{list-style:none;padding:0;margin:0}.pv-day li{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line,#2a2a2a)}.pv-day li small{display:block}.pv-day li.now b{color:var(--accent,#c8a96a)}
.pv-log{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.pv-log span{height:22px;border-radius:4px;background:var(--line,#333)}.pv-log .l1{background:#7a3b33}.pv-log .l2{background:#9a6a3a}.pv-log .l3{background:#a89a5a}.pv-log .l4{background:#6f9a6a}.pv-log .l5{background:#3f8a5a}
.hb-desks{display:flex;flex-direction:column;gap:4px}
.rail button.nv.hd-one{font-size:15px}
.hd{border-radius:8px}
.hd.open{background:rgba(255,255,255,.018)}
.hd-h{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:13px;padding:10px 12px 10px 14px;border-radius:7px;color:var(--rail-ink)}
.hd-h:hover{background:var(--rail-hi)}
.hd-h>.xi:first-child{width:19px;height:19px;color:var(--fc,var(--gold-x));opacity:.9}
.hd-h>span:not(.badge){display:flex;flex-direction:column;font-size:15px;font-weight:500;line-height:1.2}
.hd-h small{font-size:11px;color:var(--rail-muted);font-weight:400;margin-top:2px}
.hd-h .hd-c{margin-left:auto;color:var(--rail-muted);transition:transform .18s}
.hd-h .badge+.hd-c{margin-left:8px}
.hd.open .hd-c{transform:rotate(90deg)}
.hd-pgs{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 23px;padding-left:10px;border-left:1px solid var(--rail-line)}
.rail button.nv.hd-pg{padding:7px 10px;font-size:13.5px;gap:10px;border-left:2px solid transparent;color:#D5CABD}
.rail button.nv.hd-pg svg{width:15px;height:15px}
.rail button.nv.hd-pg[aria-current="true"]{color:var(--rail-ink);border-left-color:var(--fc,var(--gold-x));background:linear-gradient(90deg,rgba(201,164,106,.16),rgba(201,164,106,.02))}
.rail button.nv.hd-pg[aria-current="true"] svg{color:var(--fc,var(--gold-x))}
.rail .xlabel{margin-top:22px}
.badge.gold{background:var(--gold-x);color:#1A140F}

/* Topbar */
.topbar{display:block;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px)) 0 0;color:var(--ink)}
.hb-top{display:flex;align-items:center;gap:12px;padding:11px clamp(16px,4vw,48px);max-width:1600px}
.hb-menu{display:none!important}
.hb-crumb{display:flex;align-items:center;gap:8px;min-width:0}
.hb-crumb span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.hb-crumb .xi{color:var(--muted)}
.hb-crumb b{font-family:var(--serif);font-weight:500;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-flows{display:flex;gap:6px;margin-left:auto}
.hb-flows button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--muted)}
.hb-flows button:hover{border-color:var(--fc)}
.hb-flows i{width:7px;height:7px;border-radius:50%;background:var(--fc)}
.hb-flows b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.hb-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:600}
.hb-btn:hover{border-color:var(--gold-x)}
.hb-vera{background:linear-gradient(120deg,#2A2017,#14100D);color:#F1E6D6;border-color:#4A3A2A}
.hb-vera .xi{color:var(--gold-x)}
.hb-vera:hover{border-color:var(--gold-x)}
.hb-sub{display:none}
.topbar .ib{color:var(--ink)}

/* Shared command pieces */
.hq-crit{color:var(--warn);font-style:normal;font-weight:700}
.qbtn{cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.qbtn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.qbtn:hover{border-color:var(--gold-x)}
.hq-vm{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#3A2C1E,#120E0B);border:1px solid var(--gold-x);color:var(--gold-x);flex:none}
.hq-vm .xi{width:16px;height:16px}

/* Hero */
.hq-hero{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:center;padding:24px 28px;border-radius:12px;border:1px solid var(--line);background:radial-gradient(120% 160% at 90% 0%,#33271D 0%,#17120E 50%,#0D0A08 100%);color:#F1E8DD;margin-bottom:14px}
.hq-hero .eyebrow{color:#BFAF9F}
.hq-title{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.05;margin:8px 0 8px}
.hq-lead{color:#D9CDBF;margin:0 0 16px;max-width:70ch;font-size:15px}
.hq-hero .hq-crit{color:#F09A7A}
.hq-ask{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 8px;border:1px solid rgba(241,232,221,.18);border-radius:10px;background:rgba(255,255,255,.05);max-width:720px}
.hq-ask input{flex:1;min-width:0;border:0;background:transparent;color:#F1E8DD;font-size:14.5px;padding:6px 2px;outline:none}
.hq-ask input::placeholder{color:#A99A8B}
.hq-ask:focus-within{border-color:var(--gold-x)}
.hq-ask .btn.solid{background:var(--gold-x);border-color:var(--gold-x);color:#1A140F}
.hq-vacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hq-va{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid rgba(241,232,221,.18);border-radius:999px;font-size:12.5px;color:#E6DBCD}
.hq-va:hover{border-color:var(--gold-x);color:#fff}
.hq-va .xi{color:var(--gold-x)}
.hq-map{width:100%;height:auto;max-width:320px;justify-self:end}
.hq-edge{stroke:rgba(241,232,221,.14);stroke-width:1.5;stroke-dasharray:3 4}
.hq-edge.on{stroke:#C9A46A;stroke-opacity:.75;stroke-dasharray:none;stroke-width:1.8}
.hq-ebadge{fill:#1A140F;stroke:#C9A46A;stroke-width:1.2}
.hq-etxt{fill:#F1E8DD;font:600 11px var(--mono)}
.hq-node{fill:#15110D;stroke:var(--fc);stroke-width:2.2}
:root .hq-node{--fc:#C9A46A}
.hq-hero{--f-daily:#D2AE6E;--f-work:#8FAAD3;--f-health:#9DBB86}
.hq-nv{fill:#F5ECE1;font:500 20px var(--serif)}
.hq-nl{fill:#B3A595;font:500 7.5px var(--mono);letter-spacing:.14em}

/* Flow cards */
.hq-flows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
