<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shrink photos</title><meta name="robots" content="noindex">
<style>
:root{color-scheme:dark;--bg:#0e0c09;--panel:#15130f;--ink:#f3efe8;--mute:#a89f92;--gold:#d4b077;--line:rgba(255,255,255,.12);--bad:#e08f82;--ok:#7ccf97}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 18px 80px}h1{font:500 30px Georgia,serif;margin:0 0 6px}p{margin:.3em 0}.mute{color:var(--mute)}
.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px 18px;margin:16px 0}
button{font:inherit;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);padding:9px 18px;cursor:pointer;min-height:42px}
button.go{background:var(--gold);border-color:var(--gold);color:#15110c;font-weight:600}button.danger{border-color:var(--bad);color:var(--bad)}button:disabled{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
td.num{text-align:right;white-space:nowrap}.st{font-size:13px}.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}.st.work{color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.grow{flex:1}.name{word-break:break-all}
#msg{padding:12px 14px;border-radius:10px;background:rgba(224,143,130,.12);border:1px solid rgba(224,143,130,.4);color:var(--bad);display:none}
</style></head><body><main>
<h1>Shrink photos already in storage</h1>
<p class="mute">Each big model photo is shrunk (longest side 4000&nbsp;px, JPEG) and the profile is pointed at the smaller copy. <b>The original is kept</b> until you press <i>Delete originals</i> at the end, so you can check the site first and undo any photo.</p>
<div id="msg"></div>
<div class="card" id="scan"><p class="mute">Looking for big photos…</p></div>
<div class="card" id="waiting" hidden></div>
</main><script src="app.js"></script></body></html>
