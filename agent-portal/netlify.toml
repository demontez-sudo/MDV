[functions]

  [functions.emails]
  included_files = [
    "./emails/**",
    "./emails/**"
  ]

[build]
publish = "."
functions = "netlify/functions"

[[headers]]
for = "/"

  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/admin"

  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/admin/"

  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/assets/*"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/admin/assets/*"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/*"

  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  X-Frame-Options = "SAMEORIGIN"
  Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https:;"

[[headers]]
for = "/index.html"

  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/sw.js"

  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/manifest.webmanifest"

  [headers.values]
  Content-Type = "application/manifest+json; charset=utf-8"
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/assets/*"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/api/*"

  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"




[[headers]]
for = "/admin/manifest.webmanifest"
  [headers.values]
  Content-Type = "application/manifest+json; charset=utf-8"
  Cache-Control = "public, max-age=0, must-revalidate"

