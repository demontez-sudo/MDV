<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Private Selection · Maison de Veux</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{
  --paper:#f5f0e7;--paper2:#faf7f1;--ink:#171512;--muted:#756c61;--gold:#a57a42;
  --line:#d8cdbd;--black:#11110f;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Inter',Arial,Helvetica,sans-serif
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#eee9e1;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button,a{touch-action:manipulation}
button{cursor:pointer}
img,video{max-width:100%}
a{color:inherit}
.state{min-height:100vh;display:grid;place-items:center;padding:40px;font:16px var(--serif);color:var(--muted)}
.shell{width:min(1280px,calc(100% - 36px));margin:22px auto 76px;background:var(--paper);border:1px solid var(--line);min-height:calc(100vh - 44px);position:relative;overflow:hidden}.shell:before{content:'PRIVATE / CASTING';position:absolute;right:-16px;top:168px;font:96px/.8 var(--serif);letter-spacing:-5px;color:rgba(165,122,66,.055);writing-mode:vertical-rl;pointer-events:none}
.topbar{height:92px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 42px;border-bottom:1px solid var(--line);background:rgba(245,240,231,.97);position:sticky;top:0;z-index:30}
.prepared{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);line-height:1.55}
.prepared b{display:block;color:var(--ink);font-size:11px;letter-spacing:1.4px;margin-top:2px}
.wordmark{font:38px/1 var(--serif);letter-spacing:.3px;text-align:center}
.private{justify-self:end;font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted)}
.hero{padding:42px 42px 28px;border-bottom:1px solid var(--line);position:relative}.hero:after{content:'MDV / 01';position:absolute;right:42px;top:18px;font-size:8px;letter-spacing:2px;color:var(--gold)}
.kicker{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:13px}
.hero-row{display:flex;align-items:end;justify-content:space-between;gap:30px}
.hero h1{font:54px/.93 var(--serif);font-weight:400;margin:0;letter-spacing:-1.5px;max-width:650px}
.hero h1 em{font-weight:400;color:var(--gold)}
.hero-meta{text-align:right;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);line-height:1.8}
.filters{display:flex;gap:28px;padding:20px 42px 0;align-items:center;overflow:auto;white-space:nowrap}
.filter{border:0;border-bottom:2px solid transparent;background:transparent;padding:0 0 11px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.filter.on{color:var(--ink);border-bottom-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 14px;padding:22px 42px 46px;align-items:start}
.card{display:block;border:0;border-top:1px solid var(--line);background:transparent;padding-top:10px;position:relative}.card:nth-child(3n+2){margin-top:34px}.card:nth-child(3n+3){margin-top:68px}
.card-media{position:relative;overflow:hidden;background:#ddd4c7;aspect-ratio:4/5;max-height:430px;border:1px solid var(--line)}
.card-media img,.card-media video{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transition:transform .5s ease}
.card:hover .card-media img{transform:scale(1.015)}
.card-no{position:absolute;top:18px;left:18px;z-index:2;font:11px var(--sans);letter-spacing:1.8px;color:#fff;text-shadow:0 1px 8px #000}
.card-info{padding:16px 2px 4px;display:flex;flex-direction:column;min-height:188px}
.card-info small{font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold)}
.card-name{font:27px/.98 var(--serif);text-transform:uppercase;margin:9px 0 8px;letter-spacing:-.4px}
.card-sub{font-size:9px;line-height:1.7;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.card-actions{margin-top:15px;display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.action{min-height:40px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:9px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase}
.action.light{background:transparent;color:var(--gold);border-color:transparent;text-align:left;padding-left:0}
.action.light.on{color:#8f542e}
.action.light.on::before{content:"♥ "}
.action.light:not(.on)::before{content:"♡ "}
.empty{padding:70px 42px;font:22px var(--serif);color:var(--muted)}
.footer{display:flex;justify-content:space-between;gap:20px;padding:26px 42px;background:var(--black);color:#ede4d7;font-size:8px;letter-spacing:1.5px;text-transform:uppercase}
.footer button{border:0;background:transparent;color:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit}
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:45;width:min(960px,calc(100% - 28px));background:#171512;color:#f3eadc;border:1px solid #3c3932;display:none;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:12px 14px 12px 18px;box-shadow:0 12px 36px rgba(0,0,0,.25)}
.dock.show{display:grid}
.dock-label{font-size:8px;letter-spacing:1.7px;text-transform:uppercase;white-space:nowrap}
.dock-models{display:flex;gap:7px;overflow:auto}
.dock-chip{display:flex;align-items:center;gap:8px;min-width:130px;background:#f3eee6;color:#171512;padding:5px 8px;border:0;text-align:left}
.dock-chip img{width:34px;height:42px;object-fit:cover}
.dock-chip span{font-size:8px;line-height:1.25;text-transform:uppercase}
.dock-chip i{font-style:normal;margin-left:auto;color:#756c61}
.dock-request{height:44px;background:#f3eee6;color:#171512;border:0;padding:0 20px;font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap}

.editorial-strip{margin:4px 42px 0;padding:18px 0 4px;display:grid;grid-template-columns:1.2fr .8fr;gap:28px;border-top:1px solid var(--line)}
.editorial-quote{font:20px/1.35 var(--serif);font-style:italic;max-width:620px}.editorial-notes{display:flex;justify-content:flex-end;gap:22px;align-items:start;font-size:8px;line-height:1.7;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}.editorial-notes b{color:var(--gold);font-weight:400;display:block}
/* model mode */
.model-page{min-height:100vh;background:var(--paper)}
.model-top{height:78px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 34px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(245,240,231,.97);z-index:35}
.back{border:0;background:transparent;text-align:left;font-size:9px;letter-spacing:1.7px;text-transform:uppercase}
.model-count{justify-self:end;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.model-stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.72fr);min-height:0;max-width:1180px;margin:0 auto;padding:30px 34px 34px;gap:30px}
.model-visual{background:#ddd3c6;position:relative;height:min(86vh,900px);min-height:620px;border:1px solid var(--line);overflow:hidden}.model-visual:after{content:'MAISON DE VEUX';position:absolute;left:18px;bottom:16px;color:#fff;font-size:8px;letter-spacing:2.4px;text-shadow:0 1px 8px #000}
.model-visual img,.model-visual video{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.model-copy{padding:24px 0 10px 30px;border-left:1px solid var(--line);display:flex;flex-direction:column}
.model-copy .kicker{margin-bottom:8px}
.model-title{font:52px/.9 var(--serif);text-transform:uppercase;margin:0 0 14px}
.model-title span{display:block}
.model-subline{font-size:9px;line-height:1.6;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
.metrics{border-top:1px solid var(--line);margin-top:4px}
.metric{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)}
.metric dt{font-size:8px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.metric dd{margin:0;font:16px var(--serif)}
.model-actions{margin-top:24px;display:grid;gap:9px}
.model-actions a,.model-actions button{min-height:46px;display:grid;place-items:center;text-decoration:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.model-actions .secondary{background:transparent;color:var(--ink)}
.tabs{display:flex;gap:26px;padding:18px 42px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:auto;white-space:nowrap}
.tab{border:0;border-bottom:2px solid transparent;background:transparent;padding:0 0 9px;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.tab.on{border-bottom-color:var(--gold);color:var(--ink)}
.materials{padding:20px 42px 48px}
.media-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:1180px;margin:auto}
.media-tile{background:#ddd3c6;aspect-ratio:4/5;overflow:hidden;border:1px solid var(--line);max-height:380px}
.media-tile img,.media-tile video{width:100%;height:100%;object-fit:cover;display:block}
.info-panel{max-width:840px;font:18px/1.65 var(--serif);color:#5a5148}
.avail-panel{max-width:780px;border:1px solid var(--line);padding:32px}
.avail-panel h3{font:36px var(--serif);font-weight:400;margin:0 0 12px}
.avail-panel p{font:16px/1.6 var(--serif);color:#5a5148}

/* request modal */
.modal-bg{position:fixed;inset:0;background:rgba(18,17,15,.76);z-index:80;display:grid;place-items:center;padding:24px}
.modal{width:min(760px,96vw);max-height:92vh;overflow:auto;background:var(--paper);border:1px solid var(--line)}
.modal-head{display:flex;justify-content:space-between;align-items:start;padding:28px 32px;border-bottom:1px solid var(--line)}
.modal-head h2{font:38px var(--serif);font-weight:400;margin:6px 0 0}
.modal-close{border:1px solid var(--line);background:transparent;width:42px;height:42px}
.modal-body{padding:28px 32px}
.request-models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:22px}
.request-model{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:9px;background:var(--paper2)}
.request-model img{width:42px;height:54px;object-fit:cover}
.request-model input{accent-color:#171512}
.request-model b{font:14px var(--serif);font-weight:400}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:grid;gap:7px}
.field.wide{grid-column:1/-1}
.field span{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:#fbf8f2;padding:13px;color:var(--ink);border-radius:0}
.field textarea{min-height:110px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.modal-actions button{min-height:44px;padding:0 18px;border:1px solid var(--ink);background:transparent;font-size:8px;letter-spacing:1.5px;text-transform:uppercase}
.modal-actions .send{background:var(--ink);color:var(--paper)}
.modal-msg{padding-top:12px;font-size:12px;color:#8b5c37}

/* toast */
.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#171512;color:#f5f0e7;padding:14px 18px;font-size:11px;opacity:0;pointer-events:none;transform:translateY(12px);transition:.22s}
.toast.show{opacity:1;transform:none}

@media(max-width:1080px){
  .grid{grid-template-columns:1fr}
  .card{grid-template-columns:minmax(0,1.5fr) 280px}
  .model-stage{grid-template-columns:1fr}
  .model-copy{border-left:0;border-top:1px solid var(--line)}
}
@media(max-width:720px){
  .shell{width:100%;margin:0;border:0}
  .topbar{height:74px;padding:0 18px;grid-template-columns:1fr auto}
  .prepared{display:none}.wordmark{font-size:27px;text-align:left}.private{font-size:8px}
  .hero{padding:36px 20px 26px}.hero-row{display:block}.hero h1{font-size:47px}.hero-meta{text-align:left;margin-top:16px}
  .filters{padding-left:20px;padding-right:20px;gap:20px}
  .grid{padding:14px 20px 40px;gap:10px}
  .card{grid-template-columns:1fr 150px;min-height:360px}.card-info{padding:18px 14px}.card-name{font-size:24px}
  .footer{padding:22px 20px}
  .dock{grid-template-columns:1fr auto}.dock-label{display:none}.dock-models{max-width:60vw}.dock-chip{min-width:102px}.dock-request{padding:0 12px}
  .model-top{height:68px;padding:0 18px}.wordmark.model-wordmark{font-size:25px}
  .model-stage{min-height:0}.model-visual{min-height:58vh}.model-copy{padding:34px 22px}.model-title{font-size:50px}
  .tabs{padding-left:20px;padding-right:20px}.materials{padding:18px 20px 40px}.media-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.editorial-strip{margin:0 20px;grid-template-columns:1fr}.editorial-notes{justify-content:flex-start}
  .request-models{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}
}
@media(max-width:440px){
  .card{grid-template-columns:1fr}.card-media{min-height:430px}.card-info{min-height:230px}
  .dock-models{display:none}.dock{grid-template-columns:1fr}.dock-request{width:100%}
  .media-grid{grid-template-columns:1fr 1fr}
}
@media print{
  body{background:#fff}.topbar,.filters,.dock,.model-actions,.tabs,.footer button,.modal-bg{display:none!important}.shell{width:100%;margin:0;border:0}.grid{padding:10px}.card{break-inside:avoid}
}

/* CAVYRE 16.12.26 — single-model image scale authority */
.grid.single-model{
  grid-template-columns:minmax(0,700px)!important;
  justify-content:center;
}
.grid.single-model .card{
  grid-template-columns:minmax(0,1fr) 260px!important;
  min-height:0!important;
}
.grid.single-model .card-media{
  aspect-ratio:4/5;
  max-height:500px;
}
.grid.single-model .card-info{
  min-height:390px;
}
.model-stage.single-model-stage{
  grid-template-columns:minmax(0,1.08fr) minmax(330px,.72fr)!important;
  min-height:0!important;
  align-items:start;
}
.model-stage.single-model-stage .model-visual{
  min-height:0!important;
  height:min(86vh,900px)!important;
  max-height:900px!important;
  background:#eee8de;
}
.model-stage.single-model-stage .model-visual img,
.model-stage.single-model-stage .model-visual video{
  object-fit:contain!important;
  object-position:center center!important;
  background:#eee8de;
}
@media(max-width:720px){
  .grid.single-model{grid-template-columns:1fr!important}
  .grid.single-model .card{grid-template-columns:1fr!important}
  .grid.single-model .card-media{max-height:430px}
  .grid.single-model .card-info{min-height:0}
  .model-stage.single-model-stage{grid-template-columns:1fr!important}
  .model-stage.single-model-stage .model-visual{height:auto!important;max-height:none!important}
  .model-stage.single-model-stage .model-visual img,
  .model-stage.single-model-stage .model-visual video{max-height:68vh;object-fit:contain!important}
}


/* CAVYRE 16.12.37 — Mobile private package access */
@media(max-width:760px){
  html,body{max-width:100%;overflow-x:hidden}
  .shell{width:100%!important;max-width:100%!important;padding-left:14px!important;padding-right:14px!important}
  .topbar,.hero,.editorial-strip,.filters,.grid,.model-stage,.request-stage{max-width:100%!important}
  .grid{grid-template-columns:1fr!important}
  .card{transform:none!important;margin:0 0 22px!important}
  .card-media{max-height:520px!important}
  .model-stage{grid-template-columns:1fr!important}
  .model-visual{max-height:none!important;height:auto!important}
  .model-visual img,.model-visual video{width:100%!important;height:auto!important;max-height:72vh!important;object-fit:contain!important}
  .shortlist-dock{left:10px!important;right:10px!important;bottom:10px!important;width:auto!important;max-width:none!important}
  button,a,input,textarea,select{touch-action:manipulation}
}

</style>
</head>

<main id="app" class="state">Preparing private selection…</main>
<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const app=document.getElementById('app'),modalRoot=document.getElementById('modalRoot'),toast=document.getElementById('toast');
let data=null,filter='all',shortlist=new Set(),viewed=new Set(),detailTab='book';

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function token(){try{const q=new URL(location.href).searchParams.get('token');if(q)return q;const m=location.pathname.match(/\/p\/([^/?#]+)/);return m?decodeURIComponent(m[1]):''}catch(e){return''}}
function mediaOf(m){const arr=Array.isArray(m&&m.media)?m.media:[];return arr.find(x=>String(x.media_type||'').toLowerCase()!=='video')||arr[0]||null}
function isVideo(x){return String(x&&x.media_type||'').toLowerCase()==='video'||/\.(mp4|mov|webm|m4v)(\?|#|$)/i.test(String(x&&x.url||''))}
function mediaTag(x,cls){if(!x||!x.url)return '<div class="empty">Image pending.</div>';return isVideo(x)?'<video class="'+(cls||'')+'" src="'+esc(x.url)+'" muted playsinline preload="metadata"></video>':'<img class="'+(cls||'')+'" src="'+esc(x.url)+'" alt="" loading="lazy">'}
let jspdfReady=null;
function loadJsPDF(){if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve();if(jspdfReady)return jspdfReady;jspdfReady=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';s.onload=()=>resolve();s.onerror=()=>reject(new Error('Could not load the PDF library. Check your connection and try again.'));document.head.appendChild(s)});return jspdfReady}
function loadImg(url){return new Promise(resolve=>{if(!url)return resolve(null);const im=new Image();im.crossOrigin='anonymous';im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src=url})}
function ccCover(ctx,im,x,y,w,h){if(!im){ctx.fillStyle='#e4dccd';ctx.fillRect(x,y,w,h);return}const ir=im.width/im.height,r=w/h;let sw=im.width,sh=im.height,sx=0,sy=0;if(ir>r){sw=im.height*r;sx=(im.width-sw)/2}else{sh=im.width/r;sy=(im.height-sh)/2}ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h)}
async function compCardFront(m,ctx,W,H){
 const front=await loadImg((mediaOf(m)||{}).url);
 ccCover(ctx,front,0,0,W,H);
 let g=ctx.createLinearGradient(0,0,0,H*0.26);g.addColorStop(0,'rgba(10,9,7,.58)');g.addColorStop(1,'rgba(10,9,7,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H*0.26);
 g=ctx.createLinearGradient(0,H*0.68,0,H);g.addColorStop(0,'rgba(10,9,7,0)');g.addColorStop(1,'rgba(10,9,7,.72)');ctx.fillStyle=g;ctx.fillRect(0,H*0.68,W,H*0.32);
 const pad=W*0.065;
 ctx.fillStyle='#f7f2e8';ctx.textBaseline='alphabetic';
 (function wordmark(x0,y0,size,spacing){let cx=x0;for(const ch of 'MAISON '){ctx.font='600 '+size+'px Inter, sans-serif';ctx.fillText(ch,cx,y0);cx+=ctx.measureText(ch).width+spacing}for(const ch of 'de'){ctx.font='500 italic '+(size*1.05)+'px "Cormorant Garamond", serif';ctx.fillText(ch,cx,y0);cx+=ctx.measureText(ch).width+spacing*.6}cx+=spacing*.4;for(const ch of ' VEUX'){if(ch===' '){cx+=spacing*1.4;continue}ctx.font='600 '+size+'px Inter, sans-serif';ctx.fillText(ch,cx,y0);cx+=ctx.measureText(ch).width+spacing}})(pad,H*0.085,W*0.032,W*0.006);
 ctx.fillStyle='#f7f2e8';ctx.globalAlpha=.82;
 (function letterSpaced(text,size,spacing,x0,y0){ctx.font=size+'px Inter, sans-serif';let cx=x0;for(const ch of text){ctx.fillText(ch,cx,y0);cx+=ctx.measureText(ch).width+spacing}})('NEW YORK · PARIS',W*0.018,W*0.008,pad,H*0.085+W*0.05);
 ctx.globalAlpha=1;
 const full=(m.display_name||'Model').trim().toUpperCase();
 var fsz=W*0.135;ctx.font='500 italic '+fsz+'px "Cormorant Garamond", serif';
 var maxW=W-pad*2;while(ctx.measureText(full).width>maxW&&fsz>W*0.05){fsz-=W*0.004;ctx.font='500 italic '+fsz+'px "Cormorant Garamond", serif';}
 const ny=H*0.9;ctx.fillText(full,pad,ny);
 const tw=ctx.measureText(full).width;
 ctx.fillRect(pad,ny+H*0.014,Math.min(tw,W-pad*2),H*0.0016);
}
async function compCardBack(m,ctx,W,H){
 ctx.fillStyle='#f5f0e7';ctx.fillRect(0,0,W,H);
 const pad=W*0.065;
 ctx.fillStyle='#171512';
 const full=(m.display_name||'Model').trim().toUpperCase();
 var bfsz=W*0.095;ctx.font='500 '+bfsz+'px "Cormorant Garamond", serif';ctx.textBaseline='alphabetic';
 var bmaxW=W-pad*2;while(ctx.measureText(full).width>bmaxW&&bfsz>W*0.04){bfsz-=W*0.003;ctx.font='500 '+bfsz+'px "Cormorant Garamond", serif';}
 const nameY=H*0.115;ctx.fillText(full,pad,nameY);
 const gridTop=H*0.155,gridBottom=H*0.805,gridLeft=pad,gridRight=W*0.66,gap=W*0.012;
 const pics=(m.media||[]).filter(x=>!isVideo(x)&&x.url).slice(0,4);
 const cellW=(gridRight-gridLeft-gap)/2,cellH=(gridBottom-gridTop-gap)/2;
 const cells=[[gridLeft,gridTop],[gridLeft+cellW+gap,gridTop],[gridLeft,gridTop+cellH+gap],[gridLeft+cellW+gap,gridTop+cellH+gap]];
 for(let i=0;i<4;i++){const src=pics.length?pics[i%pics.length]:null;const im=await loadImg(src&&src.url);const [cx,cy]=cells[i];ccCover(ctx,im,cx,cy,cellW,cellH)}
 const mm=m.measurements||{},rows=[['HEIGHT',mm.height_display],['BUST',mm.bust_display],['CHEST',mm.chest_display],['WAIST',mm.waist_display],['HIPS',mm.hips_display],['SHOE',mm.shoe],['EYES',mm.eyes],['HAIR',mm.hair]].filter(x=>x[1]);
 let ry=gridTop+H*0.03;const rx=gridRight+W*0.05;
 ctx.textBaseline='alphabetic';
 for(const [label,val] of rows){
  ctx.fillStyle='#8a8074';ctx.font='600 '+(W*0.015)+'px Inter, sans-serif';
  (function letterSpaced(text,size,spacing,x,y){ctx.font=size+'px Inter, sans-serif';let cx=x;for(const ch of text){ctx.fillText(ch,cx,y);cx+=ctx.measureText(ch).width+spacing}})(label,W*0.014,W*0.003,rx,ry);
  ctx.fillStyle='#171512';ctx.font='500 '+(W*0.028)+'px "Cormorant Garamond", serif';ctx.fillText(String(val),rx,ry+H*0.038);
  ry+=H*0.083;
 }
 const footY=H*0.855;
 ctx.strokeStyle='#d8cdbd';ctx.lineWidth=Math.max(1,W*0.0015);ctx.beginPath();ctx.moveTo(pad,footY);ctx.lineTo(W-pad,footY);ctx.stroke();
 ctx.fillStyle='#171512';(function wordmark(x0,y0,size,spacing){ctx.textBaseline='alphabetic';let cx=x0;for(const ch of 'MAISON '){ctx.font='600 '+size+'px Inter, sans-serif';ctx.fillText(ch,cx,y0);cx+=ctx.measureText(ch).width+spacing}for(const ch of 'de'){ctx.font='500 italic '+(size*1.05)+'px "Cormorant Garamond", serif';ctx.fillText(ch,cx,y0);cx+=ctx.measureText(ch).width+spacing*.6}cx+=spacing*.4;for(const ch of ' VEUX'){if(ch===' '){cx+=spacing*1.4;continue}ctx.font='600 '+size+'px Inter, sans-serif';ctx.fillText(ch,cx,y0);cx+=ctx.measureText(ch).width+spacing}})(pad,footY+H*0.05,W*0.016,W*0.003);
 ctx.fillStyle='#8a8074';ctx.font='500 '+(W*0.013)+'px Inter, sans-serif';
 (function letterSpaced(text,size,spacing,x,y){ctx.font=size+'px Inter, sans-serif';let cx=x;for(const ch of text){ctx.fillText(ch,cx,y);cx+=ctx.measureText(ch).width+spacing}})('NEW YORK · PARIS',W*0.012,W*0.005,pad,footY+H*0.075);
 const agent=m.agent||{},info=[agent.name&&('Agent  '+agent.name),agent.address&&('Address  '+agent.address),agent.email&&('Email  '+agent.email),agent.phone&&('Contact  '+agent.phone)].filter(Boolean);
 ctx.font='500 '+(W*0.014)+'px Inter, sans-serif';ctx.fillStyle='#43403a';
 info.forEach((line,i)=>ctx.fillText(line,W*0.44,footY+H*0.05+i*H*0.028));
}
async function generateCompCard(m,btn){
 if(!(m.media||[]).some(x=>!isVideo(x)&&x.url)){showToast('No photo available yet for a comp card');return}
 const original=btn&&btn.textContent;
 try{
  if(btn){btn.disabled=true;btn.textContent='Preparing…'}
  await loadJsPDF();
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const W=1650,H=2550;
  const c1=document.createElement('canvas');c1.width=W;c1.height=H;await compCardFront(m,c1.getContext('2d'),W,H);
  const c2=document.createElement('canvas');c2.width=W;c2.height=H;await compCardBack(m,c2.getContext('2d'),W,H);
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'in',format:[5.5,8.5],orientation:'portrait'});
  doc.addImage(c1.toDataURL('image/jpeg',0.93),'JPEG',0,0,5.5,8.5);
  doc.addPage([5.5,8.5],'portrait');
  doc.addImage(c2.toDataURL('image/jpeg',0.93),'JPEG',0,0,5.5,8.5);
  doc.save((m.display_name||'Model').replace(/[^\w\- ]+/g,'').trim()+' Comp Card.pdf');
 }catch(e){showToast(e.message||'Could not build the comp card')}
 finally{if(btn){btn.disabled=false;btn.textContent=original||'Download Comp Card'}}
}
function market(){const ms=(data&&data.models)||[];return (ms.find(x=>x.market)&&ms.find(x=>x.market).market)||''}
function tags(m){const all=[m.gender,m.stage,m.headline,m.bio,m.note].filter(Boolean).join(' ').toLowerCase();return all}
function matches(m){
 if(filter==='all')return true;
 const g=String(m.gender||'').toLowerCase(),t=tags(m);
 if(filter==='women')return /^(women|female|woman)$/.test(g);
 if(filter==='men')return /^(men|male|man)$/.test(g);
 return t.includes(filter);
}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2800)}
function setHash(v){history.pushState({},'',location.pathname+location.search+(v?'#'+v:''));route()}
function currentModel(){const m=location.hash.match(/^#model-(.+)$/);return m?decodeURIComponent(m[1]):null}
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||d.verified!==true)throw new Error(d.error||'Request could not be saved');return d}
function track(eventType,modelId){post('/api/public/package/activity',{token:token(),event_type:eventType,model_id:modelId||null}).catch(()=>{})}

async function toggleShortlist(id){
 if(shortlist.has(id)){
  shortlist.delete(id);renderDock();syncShortlistButtons(id);
  try{await post('/api/public/package/feedback',{token:token(),model_id:id,feedback_type:'remove_shortlist'});showToast('Removed from shortlist')}catch(e){shortlist.add(id);renderDock();syncShortlistButtons(id);showToast(e.message)}
 }else{
  shortlist.add(id);renderDock();syncShortlistButtons(id);
  try{await post('/api/public/package/feedback',{token:token(),model_id:id,feedback_type:'shortlist'});showToast('Shortlisted for your review')}catch(e){shortlist.delete(id);renderDock();syncShortlistButtons(id);showToast(e.message)}
 }
}
function syncShortlistButtons(id){
 document.querySelectorAll('[data-shortlist="'+CSS.escape(String(id))+'"]').forEach(b=>{const on=shortlist.has(String(id));b.classList.toggle('on',on);b.textContent=on?'Shortlisted':'Add to Shortlist'})
}
function renderDock(){
 let dock=document.getElementById('shortlistDock');if(!dock)return;
 const ids=[...shortlist],models=(data.models||[]).filter(m=>ids.includes(String(m.id)));
 dock.classList.toggle('show',models.length>0);
 dock.querySelector('[data-dock-count]').textContent=String(models.length).padStart(2,'0');
 const box=dock.querySelector('[data-dock-models]');
 box.innerHTML=models.map(m=>{const lead=mediaOf(m);return '<button class="dock-chip" data-remove-short="'+esc(m.id)+'">'+(lead&&!isVideo(lead)?'<img src="'+esc(lead.url)+'" alt="">':'')+'<span>'+esc(m.display_name)+'</span><i>×</i></button>'}).join('');
 box.querySelectorAll('[data-remove-short]').forEach(b=>b.onclick=()=>toggleShortlist(b.getAttribute('data-remove-short')));
}
function shortlistDockMarkup(){return '<aside class="dock" id="shortlistDock"><div class="dock-label">Your Shortlist · <span data-dock-count>00</span></div><div class="dock-models" data-dock-models></div><button class="dock-request" id="dockRequest">Request Availability →</button></aside>'}

function card(m,i){
 const lead=mediaOf(m),sub=[m.market||market(),'Available',m.stage].filter(Boolean).join(' · '),on=shortlist.has(String(m.id));
 return '<article class="card" data-card="'+esc(m.id)+'"><button class="card-media" type="button" data-open="'+esc(m.id)+'" style="border:0;padding:0;text-align:initial">'+mediaTag(lead)+'<span class="card-no">'+String(i+1).padStart(2,'0')+'</span></button><div class="card-info"><small>'+String(i+1).padStart(2,'0')+'</small><div class="card-name">'+esc(m.display_name||'Model')+'</div><div class="card-sub">'+esc(sub)+'</div><div class="card-actions"><button class="action" data-open="'+esc(m.id)+'">View Profile →</button><button class="action light '+(on?'on':'')+'" data-shortlist="'+esc(m.id)+'">'+(on?'Shortlisted':'Add to Shortlist')+'</button></div></div></article>';
}
function renderIndex(){
 const p=data.package||{},models=(data.models||[]).filter(matches),recipient=data.recipient&&data.recipient.display_name;
 document.title=(p.title||'Private Selection')+' · Maison de Veux';
 app.className='';app.innerHTML='<section class="shell"><header class="topbar"><div class="prepared">Prepared for'+(recipient?'<b>'+esc(recipient)+'</b>':'<b>Private Client</b>')+'</div><div class="wordmark">Maison de Veux</div><div class="private">Private Package</div></header><section class="hero"><div class="kicker">Private Selection / '+esc(market())+'</div><div class="hero-row"><h1>Selected <em>for You</em></h1><div class="hero-meta">'+String((data.models||[]).length).padStart(2,'0')+' models<br>'+(market()?esc(market())+' · ':'')+'Private review</div></div></section><nav class="filters">'+['all','women','men','runway','editorial','commercial'].filter(x=>x==='all'||filter===x||(data.models||[]).some(m=>{const f=filter;filter=x;const r=matches(m);filter=f;return r})).map(x=>'<button class="filter '+(filter===x?'on':'')+'" data-filter="'+x+'">'+x+'</button>').join('')+'</nav><section class="editorial-strip"><div class="editorial-quote">A focused edit of talent selected for this brief — less catalogue, more casting room.</div><div class="editorial-notes">'+(market()?'<span><b>MARKET</b>'+esc(market())+'</span>':'')+'<span><b>ACCESS</b>Private</span><span><b>STATUS</b>Current</span></div></section><section class="grid '+((data.models||[]).length===1?'single-model':'')+'">'+(models.length?models.map((m,i)=>card(m,i)).join(''):'<div class="empty">No models match this filter.</div>')+'</section><footer class="footer"><span>Maison de Veux · New York / Paris</span><span><button id="printPackage">Download Lookbook</button> · <button id="contactMaison">Contact Maison</button> · Private &amp; confidential</span></footer></section>'+shortlistDockMarkup();
 app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderIndex()});
 app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>setHash('model-'+b.getAttribute('data-open')));
 app.querySelectorAll('[data-shortlist]').forEach(b=>b.onclick=()=>toggleShortlist(b.getAttribute('data-shortlist')));
 document.getElementById('dockRequest').onclick=()=>openRequest();
 document.getElementById('printPackage').onclick=()=>window.print();
 document.getElementById('contactMaison').onclick=()=>openRequest();
 renderDock();
}

function measures(m){
 const mm=m.measurements||{},rows=[
 ['Height',mm.height_display],['Bust / Chest',mm.bust_display||mm.chest_display],['Waist',mm.waist_display],['Hips',mm.hips_display],['Eyes',mm.eyes],['Hair',mm.hair],['Shoe',mm.shoe],['Dress',mm.dress],['Suit',mm.suit]
 ].filter(x=>x[1]);
 return rows.map(x=>'<div class="metric"><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>').join('');
}
function mediaForTab(m,tab){
 const arr=Array.isArray(m.media)?m.media:[];
 if(tab==='motion')return arr.filter(isVideo);
 if(tab==='digitals')return arr.filter(x=>/digital|polaroid|polaroid|digitals/i.test(String(x.category||'')));
 if(tab==='book')return arr.filter(x=>!isVideo(x)&&!/digital|polaroid/i.test(String(x.category||''))) || arr;
 return arr;
}
function renderDetail(id){
 const models=data.models||[],idx=models.findIndex(m=>String(m.id)===String(id));if(idx<0){history.replaceState({},'',location.pathname+location.search);renderIndex();return}
 const m=models[idx],lead=mediaOf(m),on=shortlist.has(String(m.id));
 if(!viewed.has(String(m.id))){viewed.add(String(m.id));track('model_viewed',m.id)}
 app.className='';app.innerHTML='<section class="model-page"><header class="model-top"><button class="back" id="backSelection">← Private Selection</button><div class="wordmark model-wordmark">Maison de Veux</div><div class="model-count">'+String(idx+1).padStart(2,'0')+' / '+String(models.length).padStart(2,'0')+'</div></header><section class="model-stage '+(models.length===1?'single-model-stage':'')+'"><div class="model-visual">'+mediaTag(lead)+'</div><aside class="model-copy"><div class="kicker">'+esc([m.market||market(),'Available'].filter(Boolean).join(' · '))+'</div><h1 class="model-title">'+String(m.display_name||'Model').split(/\s+/).map(x=>'<span>'+esc(x)+'</span>').join('')+'</h1><div class="model-subline">'+esc([m.stage,m.headline].filter(Boolean).join(' · ')||'Maison de Veux Model')+'</div><dl class="metrics">'+(measures(m)||'<div class="metric"><dt>Measurements</dt><dd>On request</dd></div>')+'</dl><div class="model-actions">'+(m.profile_url?'<a href="'+esc(m.profile_url)+'" target="_blank" rel="noopener" data-profile-open="'+esc(m.id)+'">View Full Book →</a>':'')+'<button class="secondary '+(on?'on':'')+'" data-shortlist="'+esc(m.id)+'">'+(on?'♥ Shortlisted':'♡ Add to Shortlist')+'</button><button class="secondary" id="requestThisModel">Request Availability</button><button class="secondary" id="requestComp">Download Comp Card</button></div></aside></section><nav class="tabs">'+(function(){const approved=new Set(((data.package&&data.package.approved_sections)||['book','digitals','motion']).map(x=>String(x).toLowerCase()));const tabs=['book','digitals','motion'].filter(x=>approved.has(x)).concat(['info','availability']);if(!tabs.includes(detailTab))detailTab=tabs[0]||'info';return tabs.map(t=>'<button class="tab '+(detailTab===t?'on':'')+'" data-tab="'+t+'">'+t+'</button>').join('')})()+'</nav><section class="materials" id="materials"></section></section>'+shortlistDockMarkup();
 document.getElementById('backSelection').onclick=()=>{history.pushState({},'',location.pathname+location.search);detailTab='book';renderIndex()};
 app.querySelectorAll('[data-shortlist]').forEach(b=>b.onclick=()=>toggleShortlist(b.getAttribute('data-shortlist')));
 app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{detailTab=b.dataset.tab;renderMaterials(m)});
 document.querySelector('[data-profile-open]')?.addEventListener('click',()=>track('profile_opened',m.id));
 document.getElementById('requestThisModel').onclick=()=>openRequest([String(m.id)]);
 document.getElementById('requestComp').onclick=async(e)=>{post('/api/public/package/feedback',{token:token(),model_id:m.id,feedback_type:'request_more_info',note:'Comp card downloaded from private package.'}).catch(()=>{});await generateCompCard(m,e.currentTarget)};
 document.getElementById('dockRequest').onclick=()=>openRequest();
 renderMaterials(m);renderDock();
}
function renderMaterials(m){
 const box=document.getElementById('materials');if(!box)return;
 app.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===detailTab));
 if(detailTab==='info'){box.innerHTML='<div class="info-panel">'+(m.bio?'<p>'+esc(m.bio)+'</p>':'<p>Additional model information is available through Maison de Veux.</p>')+'<dl class="metrics">'+measures(m)+'</dl></div>';return}
 if(detailTab==='availability'){box.innerHTML='<div class="avail-panel"><div class="kicker">Current Availability</div><h3>'+esc([m.display_name,m.market||market()].filter(Boolean).join(' · '))+'</h3><p>Request current dates, casting availability, fitting options, shoot holds or runway availability directly from Maison de Veux.</p><button class="action" id="availabilityRequest">Request Availability →</button></div>';document.getElementById('availabilityRequest').onclick=()=>openRequest([String(m.id)]);return}
 const items=mediaForTab(m,detailTab);box.innerHTML=items.length?'<div class="media-grid">'+items.map(x=>'<div class="media-tile">'+(isVideo(x)?'<video src="'+esc(x.url)+'" controls playsinline preload="metadata"></video>':'<img src="'+esc(x.url)+'" alt="" loading="lazy">')+'</div>').join('')+'</div>':'<div class="empty">No '+esc(detailTab)+' materials are included in this package.</div>';
}

function openRequest(forceIds){
 track('request_form_opened');
 const pre=new Set((forceIds&&forceIds.length?forceIds:[...shortlist]).map(String));
 const models=data.models||[];
 modalRoot.innerHTML='<div class="modal-bg" id="requestBg"><div class="modal"><header class="modal-head"><div><div class="kicker">Private Booking Request</div><h2>Request Availability</h2></div><button class="modal-close" id="closeRequest">×</button></header><div class="modal-body"><div class="request-models">'+models.map(m=>{const lead=mediaOf(m);return '<label class="request-model"><input type="checkbox" data-request-model="'+esc(m.id)+'" '+(pre.has(String(m.id))?'checked':'')+'>'+(lead&&!isVideo(lead)?'<img src="'+esc(lead.url)+'" alt="">':'')+'<b>'+esc(m.display_name)+'</b></label>'}).join('')+'</div><div class="form-grid"><label class="field"><span>Project</span><input id="rqProject" placeholder="Campaign, runway, editorial, fitting…"></label><label class="field"><span>Dates</span><input id="rqDates" placeholder="Sep 10–12, 2026"></label><label class="field"><span>Location</span><input id="rqLocation" placeholder="New York"></label><label class="field"><span>Usage</span><input id="rqUsage" placeholder="Runway / campaign / e-commerce…"></label><label class="field wide"><span>Message</span><textarea id="rqMessage" placeholder="Add project details, timing, budget or special requests…"></textarea></label></div><div class="modal-msg" id="rqMsg"></div><div class="modal-actions"><button id="cancelRequest">Cancel</button><button class="send" id="sendRequest">Send Request →</button></div></div></div></div>';
 const close=()=>{modalRoot.innerHTML='';if(location.hash==='#request')history.replaceState({},'',location.pathname+location.search)};
 document.getElementById('closeRequest').onclick=close;document.getElementById('cancelRequest').onclick=close;document.getElementById('requestBg').onclick=e=>{if(e.target.id==='requestBg')close()};
 document.getElementById('sendRequest').onclick=async function(){
   const ids=[...modalRoot.querySelectorAll('[data-request-model]:checked')].map(x=>x.getAttribute('data-request-model'));
   const msg=document.getElementById('rqMsg');if(!ids.length){msg.textContent='Select at least one model.';return}
   const val=id=>(document.getElementById(id)?.value||'').trim(),names=(data.models||[]).filter(m=>ids.includes(String(m.id))).map(m=>m.display_name);
   const note=['Models Requested: '+names.join(', '),'Project: '+(val('rqProject')||'—'),'Dates: '+(val('rqDates')||'—'),'Location: '+(val('rqLocation')||'—'),'Usage: '+(val('rqUsage')||'—'),'Message: '+(val('rqMessage')||'—')].join('\n');
   this.disabled=true;msg.textContent='Sending request…';
   try{await post('/api/public/package/feedback',{token:token(),model_ids:ids,feedback_type:'request_availability',note:note});ids.forEach(id=>shortlist.add(String(id)));showToast('Availability request sent');close();renderDock()}catch(e){msg.textContent=e.message;this.disabled=false}
 };
}

function route(){
 if(!data)return;
 if(location.hash==='#request'){renderIndex();setTimeout(()=>openRequest(),0);return}
 const id=currentModel();if(id){detailTab='book';renderDetail(id)}else renderIndex()
}
window.addEventListener('popstate',route);
window.addEventListener('hashchange',route);

async function load(){
 const t=token();if(!t){app.textContent='This package link is invalid.';return}
 try{
  const r=await fetch('/api/public/package?token='+encodeURIComponent(t),{cache:'no-store'});
  const d=await r.json().catch(()=>({}));if(!r.ok||d.verified!==true)throw new Error(d.error||'This package is unavailable.');
  data=d;shortlist=new Set((d.feedback_state&&d.feedback_state.shortlisted_model_ids||[]).map(String));route()
 }catch(e){app.className='state';app.textContent=e.message||'This package is unavailable.'}
}
load();
})();
