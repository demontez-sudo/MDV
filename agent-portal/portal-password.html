<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Model Portal · Change Password</title>
<style>:root{--line:#6c332d;--ink:#f0e7df;--muted:#a99086;--accent:#ef6f65;--gold:#c8a06f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 75% 12%,#371715 0,#160b0a 34%,#090706 82%);color:var(--ink);font-family:Arial,sans-serif}body{display:grid;place-items:center;padding:24px}.card{width:min(560px,96vw);border:1px solid var(--line);background:linear-gradient(180deg,rgba(30,14,13,.97),rgba(12,9,8,.98));padding:38px;box-shadow:0 30px 100px #0008}small{font:9px monospace;letter-spacing:.2em;color:var(--accent)}h1{font:38px Georgia,serif;font-weight:400;margin:10px 0}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:24px}label{display:block;font:9px monospace;letter-spacing:.15em;color:var(--gold);margin:14px 0 7px}input{width:100%;height:50px;background:#0d0b09;border:1px solid #594139;color:var(--ink);padding:0 14px;font-size:15px}button{width:100%;height:50px;margin-top:18px;border:1px solid #a44a42;background:#a83e38;color:#fff;font:bold 10px monospace;letter-spacing:.14em}button:disabled{opacity:.5}.msg{display:none;margin-top:14px;padding:12px;border:1px solid #49342e;font-size:12px}.error{color:#ff9a90}.ok{color:#a5e3b6}.back{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:12px;text-decoration:none}</style></head>
<body data-model-password-release="16.12.68"><div class="card"><small>MAISON DE VEUX · MODEL PORTAL</small><h1>Create your permanent password</h1><div class="sub">Enter the Model Portal email and temporary password your agency gave you. You do not need to already be signed in.</div>
<label>MODEL PORTAL EMAIL</label><input id="email" type="email" autocomplete="username"><label>TEMPORARY / CURRENT PASSWORD</label><input id="current" type="password" autocomplete="current-password"><label>NEW PERMANENT PASSWORD</label><input id="pw1" type="password" autocomplete="new-password"><label>CONFIRM NEW PASSWORD</label><input id="pw2" type="password" autocomplete="new-password"><button id="save">SET PERMANENT PASSWORD →</button><div id="err" class="msg error"></div><div id="ok" class="msg ok"></div><a class="back" href="/portal">← Back to Model Portal</a></div>
<script>(function(){'use strict';var KEY='sb-mogyngdhmzbjmcdqeoxu-auth-token',err=document.getElementById('err'),ok=document.getElementById('ok'),btn=document.getElementById('save');function show(e,m){err.style.display=e?'block':'none';ok.style.display=e?'none':'block';(e?err:ok).textContent=m||''}function persist(s){if(s&&s.access_token&&s.refresh_token)localStorage.setItem(KEY,JSON.stringify(s))}
btn.onclick=async function(){var email=(document.getElementById('email').value||'').trim(),cur=document.getElementById('current').value||'',a=document.getElementById('pw1').value||'',b=document.getElementById('pw2').value||'';if(!email)return show(true,'Enter your Model Portal email.');if(!cur)return show(true,'Enter your temporary or current password.');if(a.length<10)return show(true,'Use at least 10 characters for your new password.');if(a!==b)return show(true,'New passwords do not match.');if(a===cur)return show(true,'Choose a new password different from your temporary/current password.');btn.disabled=true;btn.textContent='VERIFYING & CHANGING…';try{var r=await fetch('/api/model/password/direct-change',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email,current_password:cur,new_password:a,organization_slug:'maison-de-veux'})});var d=await r.json().catch(function(){return{}});if(!r.ok||!d.ok||!d.credential_verified)throw new Error(d.error||d.message||'Password could not be changed.');persist(d.session);show(false,'Password changed and login verified. Opening your Model Portal…');setTimeout(function(){location.replace(d.redirect_to||'/portal')},800)}catch(e){show(true,e.message||'Password could not be changed.');btn.disabled=false;btn.textContent='SET PERMANENT PASSWORD →'}};document.getElementById('pw2').addEventListener('keydown',function(e){if(e.key==='Enter')btn.click()})})();</script></body></html>
