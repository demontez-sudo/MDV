<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DaySilk</title>
<meta name="description" content="DaySilk runs your work, your day, your health and your life in one system, built from your answers.">
<meta name="theme-color" content="#17110D">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DaySilk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* DaySilk: espresso and gold, Bodoni Moda headings, Hanken Grotesk text. */
:root{
  --bg:#E7E1D8;--surface:#F2EDE6;--sunk:#DBD3C8;--ink:#1E1712;--muted:#695C52;--line:#CABFB2;
  --accent:#7A3218;--accent-ink:#F4EDE4;--gold:#94703A;--ok:#4A5A36;--warn:#A1301A;--info:#3F5666;
  --rail:#17110D;--rail-ink:#EAE1D5;--rail-muted:#9C8B7D;--rail-line:#2C231D;--rail-hi:#2A201A;
  --k-work:#7A3218;--k-daily:#A07A3C;--k-personal:#3F5666;--k-life:#4A5A36;--k-rest:#9A8B7C;
  --serif:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0B09;--surface:#16120F;--sunk:#0A0807;--ink:#EDE4D9;--muted:#A3958A;--line:#2A221C;
  --accent:#C9774A;--accent-ink:#15100D;--gold:#C9A46A;--ok:#9DAE7A;--warn:#E5805B;--info:#8FA9BA;
  --rail:#0B0907;--rail-line:#221B16;--rail-hi:#1C1612;
  --k-work:#C9774A;--k-daily:#C9A46A;--k-personal:#8FA9BA;--k-life:#9DAE7A;--k-rest:#8C7F73;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0B09;--surface:#16120F;--sunk:#0A0807;--ink:#EDE4D9;--muted:#A3958A;--line:#2A221C;
  --accent:#C9774A;--accent-ink:#15100D;--gold:#C9A46A;--ok:#9DAE7A;--warn:#E5805B;--info:#8FA9BA;
  --rail:#0B0907;--rail-line:#221B16;--rail-hi:#1C1612;
  --k-work:#C9774A;--k-daily:#C9A46A;--k-personal:#8FA9BA;--k-life:#9DAE7A;--k-rest:#8C7F73;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}.late{color:var(--warn)}.okc{color:var(--ok)}
[hidden]{display:none!important}

/* Shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 18px;border-bottom:1px solid var(--rail-line);margin-bottom:14px}
.brand .mk{width:38px;height:38px;border:1px solid var(--gold);display:grid;place-items:center;font:500 15px var(--serif);color:var(--gold);letter-spacing:.04em}
.brand b{display:block;font:500 18px var(--serif);letter-spacing:.02em}
.brand small{color:var(--rail-muted);font-size:12px}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--rail-ink);font-size:15px}
.nav:hover{background:var(--rail-hi)}.nav[aria-current="page"]{background:var(--rail-hi);box-shadow:inset 2px 0 0 var(--gold)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .ct{margin-left:auto;font:600 11px var(--mono);background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:1px 7px}
.rail-sec{font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--rail-muted);padding:16px 12px 6px}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--rail-line);display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--rail-hi);display:grid;place-items:center;font:500 14px var(--serif);color:var(--gold);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.rail-foot b{display:block;font-size:14px}.rail-foot small{display:block;color:var(--rail-muted);font-size:12px}
.top{display:flex;align-items:center;gap:12px;padding:14px 48px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.top .crumb{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top .sp{flex:1}
.menu{display:none}
main{padding:34px 48px 80px;max-width:1240px}
.save{font:500 11px var(--mono);color:var(--muted)}

/* Type and blocks */
.section{font:500 clamp(34px,4vw,50px)/1.05 var(--serif);margin:6px 0 10px}
.lead{color:var(--muted);max-width:720px;margin:0 0 26px;font-size:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.panel h3{font:500 22px var(--serif);margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel h3 .eyebrow{font-size:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.stack{display:grid;gap:18px;align-content:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{color:var(--muted);font-style:italic;margin:6px 0}

/* Controls */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:14px;background:var(--surface);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:#120E0B;border-color:var(--gold)}
.btn.sm{padding:5px 11px;font-size:13px}.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:default}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.txt{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px}
textarea.txt{min-height:90px;resize:vertical}
label.fld{display:grid;gap:5px;font-size:13px;color:var(--muted)}
label.fld .txt{color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 13px;border:1px solid var(--line);border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.ck{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px 0;border-top:1px solid var(--line)}
.ck:first-child{border-top:0}
.ck input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--gold);flex:none}
.ck.done span{color:var(--muted);text-decoration:line-through}
.ck small{display:block;color:var(--muted);font-size:12px}

/* Today */
.hero{background:var(--rail);color:var(--rail-ink);border-radius:14px;padding:30px 32px;display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;margin-bottom:22px}
.hero .num{font:500 84px/0.9 var(--serif);color:var(--gold)}
.hero h2{font:500 30px var(--serif)}
.hero p{margin:4px 0 0;color:var(--rail-muted)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--rail-line) 0);display:grid;place-items:center}
.ring b{width:76px;height:76px;border-radius:50%;background:var(--rail);display:grid;place-items:center;font:500 24px var(--serif)}
.hero-score small{display:block;text-align:center;font:500 9px var(--mono);letter-spacing:.12em;color:var(--rail-muted);margin-top:6px}
.hero{border:1px solid var(--rail-line)}
.nown{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font:500 22px var(--serif);margin-top:2px}.stat small{color:var(--muted)}
.big3{display:grid;gap:10px}
.b3{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.b3 .n{font:500 20px var(--serif);color:var(--gold)}
.b3 input.txt{border:0;background:transparent;padding:4px 0}
.b3.done input.txt{text-decoration:line-through;color:var(--muted)}

/* Timeline */
.tl{display:grid}
.blk{display:grid;grid-template-columns:96px 4px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk time{font:500 13px var(--mono);color:var(--muted)}
.blk .sw{height:100%;min-height:30px;border-radius:3px;background:var(--k-daily)}
.blk b{display:block;font-size:15px}.blk small{color:var(--muted);font-size:13px}
.blk.now{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 12%,transparent));}
.blk.done b{text-decoration:line-through;color:var(--muted)}
.k-work{background:var(--k-work)!important}.k-daily{background:var(--k-daily)!important}.k-personal{background:var(--k-personal)!important}.k-life{background:var(--k-life)!important}.k-rest{background:var(--k-rest)!important}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* Templates editor */
.tplbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tedit{display:grid;grid-template-columns:110px 1fr 140px 34px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.tedit:first-of-type{border-top:0}
.tedit .txt{padding:7px 9px;font-size:14px}
.ib{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.ib:hover{background:var(--sunk);color:var(--ink)}

/* Month */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font:500 11px var(--mono);color:var(--muted);padding:4px 6px}
.cell{min-height:96px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 7px;cursor:pointer;font-size:12px;overflow:hidden}
.cell.out{opacity:.45}.cell.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cell .dn{font:500 17px var(--serif);display:block;margin-bottom:2px}
.cell .ev{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--accent);padding-left:5px;margin-top:2px}
.cell .tk{border-left-color:var(--gold)}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.cal-head h3{font:500 26px var(--serif);margin-right:auto}

/* Tasks */
.task{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task small{display:block;color:var(--muted);font-size:12px}
.pill{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.addrow{display:grid;grid-template-columns:1fr 150px 140px auto;gap:8px;margin-bottom:16px}

/* Onboarding and auth */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);background:var(--bg)}
.gate-brand{background:var(--rail);color:var(--rail-ink);padding:56px 52px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.gate-brand .word{font:500 clamp(54px,7vw,92px)/1 var(--serif);letter-spacing:.01em}
.gate-brand .rule{width:64px;height:1px;background:var(--gold)}
.gate-brand p{color:var(--rail-muted);max-width:420px;margin:0;font-size:16px}
.gate-brand ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px;color:var(--rail-ink)}
.gate-brand li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:10px;vertical-align:middle}
.gate-form{padding:56px clamp(24px,6vw,80px);display:flex;flex-direction:column;justify-content:center;max-width:620px}
.gate-form h1{font:500 40px var(--serif);margin-bottom:8px}
.gate-form form{display:grid;gap:14px;margin-top:18px}
.authmsg{padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.authmsg.err{border-color:var(--warn);color:var(--warn)}
.steps{display:flex;gap:6px;margin:0 0 22px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--gold)}
.ob-actions{display:flex;gap:10px;justify-content:space-between;margin-top:24px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.opt b{display:block;font:500 19px var(--serif)}.opt small{color:var(--muted);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.25)}

@media (max-width:980px){
  .grid3{grid-template-columns:1fr 1fr}
  .gate{grid-template-columns:1fr}.gate-brand{padding:40px 24px}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .rail{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .menu{display:inline-flex}
  .top{padding:12px 16px}main{padding:24px 16px 70px}
  .grid2,.grid3,.nown,.fgrid,.opts{grid-template-columns:1fr}
  .hero{grid-template-columns:auto 1fr;padding:22px 20px}.hero .hero-score{display:none}.hero .num{font-size:60px}
  .addrow{grid-template-columns:1fr 1fr}.addrow .txt:first-child{grid-column:1/-1}
  .tedit{grid-template-columns:90px 1fr 34px}.tedit select{grid-column:2}
  .blk{grid-template-columns:70px 4px 1fr}.blk>.btn,.blk>.ib{grid-column:3;justify-self:start}
  .cell{min-height:58px;padding:4px}.cell .ev{display:none}.cell .dn{font-size:14px}
  .gate-form{padding:32px 16px}
}

/* ---------- DaySilk additions ---------- */
.mono{font-family:var(--mono)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.row.line{justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);flex-wrap:nowrap}
.row.line:first-of-type{border-top:0}
.tname{font:500 22px var(--serif)!important;border:0!important;background:transparent!important;padding:0!important;width:auto;flex:1}
.focus{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--gold) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));border-radius:12px;padding:12px 16px;margin-bottom:22px;font-size:15px}
.focus svg{color:var(--gold);flex:none;margin-top:3px}.focus .sep{color:var(--muted);margin:0 10px}
.plist{margin:0;padding-left:18px;display:grid;gap:8px}.plist li::marker{color:var(--gold)}
.vision{border-left:3px solid var(--gold)}.vision p{font:400 20px/1.45 var(--serif);margin:6px 0 0}
.goal{padding:10px 0;border-top:1px solid var(--line)}.goal:first-of-type{border-top:0}.goal input[type=range]{width:100%;accent-color:var(--gold)}
.av.sm{width:30px;height:30px;font-size:13px;background:var(--sunk);color:var(--ink)}.av.sm svg{width:15px;height:15px}
.av.lg{width:64px;height:64px;font-size:24px}
.fgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.trial{all:unset;cursor:pointer;margin:14px 6px 0;padding:9px 12px;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:13px;text-align:center}
.ev.te{border-left-color:var(--info)!important}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.colh{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px}
.colh b{font:500 16px var(--serif)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.card small{color:var(--muted);font-size:12px}.card.due{border-left:3px solid var(--warn)}
.panel .card+.card{margin-top:8px}

/* Scorecard */
.score{display:grid}
.srow{display:grid;grid-template-columns:minmax(0,1.4fr) 110px minmax(0,1fr) 90px 30px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}.srow small{display:block;font-size:12px}
.srow .txt{padding:7px 9px}
.spark{display:flex;gap:3px;align-items:flex-end;height:30px}.spark i{flex:1;background:var(--gold);opacity:.75;border-radius:2px}

/* Team */
.codebox{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--bg);border:1px dashed var(--gold);border-radius:10px;padding:10px 14px}
.codebox b{font:500 22px var(--mono);letter-spacing:.18em}
.post{padding:12px 0;border-top:1px solid var(--line)}.post:first-of-type{border-top:0}.post p{margin:6px 0}
.post.pin{background:color-mix(in srgb,var(--gold) 8%,transparent);margin:0 -10px;padding:12px 10px;border-radius:8px}
.sop{border-top:1px solid var(--line);padding:10px 0}.sop:first-of-type{border-top:0}
.sop summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.sop ol{margin:10px 0;padding-left:20px;display:grid;gap:4px}

/* Inbox */
.provs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opt[disabled]{opacity:.5;cursor:default}
.mlist{padding:4px 0}
.mrow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:14px;width:100%;padding:11px 20px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.mrow:first-child{border-top:0}.mrow:hover{background:var(--sunk)}
.mrow .mfrom,.mrow .msub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .msub b{font-weight:500}.mrow.unread .mfrom,.mrow.unread .msub b{font-weight:700}
.mrow.unread{box-shadow:inset 3px 0 0 var(--gold)}
.mrow .mdate{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}

.plan li{padding-left:16px;position:relative}.plan li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* Getting started */

/* Admin */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}

@media (max-width:1100px){.plans,.provs{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:1fr 1fr}.fgrid.four{grid-template-columns:1fr 1fr}}

/* ---------- Logo and sunrise ---------- */
.ds-logo{display:block;overflow:visible}
.ds-word{font-family:"Bodoni Moda",Didot,"Bodoni 72",serif;font-weight:400;font-size:84px;letter-spacing:22px}
.ds-logo.rise .ds-sun{animation:ds-rise 2s cubic-bezier(.18,.72,.2,1) both}
.ds-logo.rise .ds-rays{transform-box:view-box;transform-origin:300px 158px;animation:ds-spin 2.4s cubic-bezier(.2,.7,.2,1) both}
.ds-logo.rise .ds-glow{animation:ds-glow 2.6s ease-out both}
.ds-logo.rise .ds-edge{stroke-dasharray:640;animation:ds-draw 1.4s ease-out both}
.ds-logo.rise .ds-word{animation:ds-word 1.1s .95s ease-out both}
@keyframes ds-rise{from{transform:translateY(150px)}to{transform:none}}
@keyframes ds-spin{from{transform:rotate(-18deg)}to{transform:none}}
@keyframes ds-glow{0%,40%{opacity:0}75%{opacity:1}100%{opacity:.8}}
@keyframes ds-draw{from{stroke-dashoffset:640}to{stroke-dashoffset:0}}
@keyframes ds-word{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.ds-splash{position:fixed;inset:0;z-index:200;background:radial-gradient(ellipse at 50% 45%,#22160D 0%,#120C08 60%,#0C0806 100%);display:grid;place-items:center;padding:24px;cursor:pointer;transition:opacity .55s ease}

.brandword{display:inline-flex;align-items:center;gap:10px}.brandword .ds-logo{width:44px;height:auto}
.ds-logo.tight{overflow:hidden}
.ds-word{font-variation-settings:"opsz" 96}

  .btn{min-height:44px}.btn.sm{min-height:36px}

  .panel{border-radius:18px}

/* ---------- Your-DaySilk design: the founder portal's Command Center and Today, shared with every member ---------- */

/* Hero */
.hq-hero{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:center;padding:24px 28px;border-radius:12px;border:1px solid var(--line);background:radial-gradient(120% 160% at 90% 0%,#33271D 0%,#17120E 50%,#0D0A08 100%);color:#F1E8DD;margin-bottom:14px}
.hq-hero .eyebrow{color:#BFAF9F}
.hq-title{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.05;margin:8px 0 8px}
.hq-lead{color:#D9CDBF;margin:0 0 16px;max-width:70ch;font-size:15px}
.hq-hero .hq-crit{color:#F09A7A}
.hq-ask{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 8px;border:1px solid rgba(241,232,221,.18);border-radius:10px;background:rgba(255,255,255,.05);max-width:720px}
.hq-ask input{flex:1;min-width:0;border:0;background:transparent;color:#F1E8DD;font-size:14.5px;padding:6px 2px;outline:none}
.hq-ask input::placeholder{color:#A99A8B}
.hq-ask:focus-within{border-color:var(--gold-x)}
.hq-ask .btn.solid{background:var(--gold-x);border-color:var(--gold-x);color:#1A140F}
.hq-vacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hq-va{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid rgba(241,232,221,.18);border-radius:999px;font-size:12.5px;color:#E6DBCD}
.hq-va:hover{border-color:var(--gold-x);color:#fff}
.hq-va .xi{color:var(--gold-x)}
.hq-map{width:100%;height:auto;max-width:320px;justify-self:end}
.hq-edge{stroke:rgba(241,232,221,.14);stroke-width:1.5;stroke-dasharray:3 4}
.hq-edge.on{stroke:#C9A46A;stroke-opacity:.75;stroke-dasharray:none;stroke-width:1.8}
.hq-ebadge{fill:#1A140F;stroke:#C9A46A;stroke-width:1.2}
.hq-etxt{fill:#F1E8DD;font:600 11px var(--mono)}
.hq-node{fill:#15110D;stroke:var(--fc);stroke-width:2.2}
:root .hq-node{--fc:#C9A46A}
.hq-hero{--f-daily:#D2AE6E;--f-work:#8FAAD3;--f-health:#9DBB86}
.hq-nv{fill:#F5ECE1;font:500 20px var(--serif)}
.hq-nl{fill:#B3A595;font:500 7.5px var(--mono);letter-spacing:.14em}

/* Flow cards */
.hq-flows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.hq-flow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:16px 18px 14px;border:1px solid var(--line);border-top:3px solid var(--fc);border-radius:10px;background:var(--surface);min-width:0}
.hq-flow:hover{border-color:var(--fc)}
.hq-fh{display:flex;align-items:center;gap:10px}
.hq-fh .xi{color:var(--fc)}
.hq-fh b{font-family:var(--serif);font-weight:500;font-size:19px}
.hq-fq{margin-left:auto;font-size:12px;color:var(--muted)}
.hq-fq em{font-style:normal;color:var(--warn);font-weight:700}
.hq-fb{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hq-fv{font-family:var(--serif);font-size:46px;line-height:.9}
.hq-fv small{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px;letter-spacing:.06em}
.hq-spark{width:120px;height:30px;flex:none}
.hq-flow ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.hq-flow li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.hq-flow li span{color:var(--muted)}
.hq-flow li b{font-weight:600;text-align:right}
.hq-fgo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fc)}

/* Day bar */
.hq-day{margin-bottom:14px}
.hq-leg{display:flex;gap:12px;margin-left:8px}
.hq-leg i{font-style:normal;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.hq-leg i::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--fc)}
.hq-bar{position:relative;height:66px;border-radius:8px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/19 - 1px),var(--line) calc(100%/19 - 1px),var(--line) calc(100%/19));margin-top:4px}
.hq-hr{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.hq-seg{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;top:20px;height:38px;border-radius:5px;border-left:3px solid var(--fc);background:color-mix(in srgb,var(--fc) 22%,var(--surface));padding:4px 6px;overflow:hidden;font-size:11px;line-height:1.25;color:var(--ink)}
.hq-seg span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hq-seg:hover{background:color-mix(in srgb,var(--fc) 38%,var(--surface));z-index:2}
.hq-seg.done{opacity:.5}
.hq-now{position:absolute;top:14px;bottom:2px;width:2px;background:var(--warn);border-radius:2px;z-index:3}
.hq-now::before{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn)}

/* Grid, queue, links */
.hq-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.hq-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.hq-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hq-chips button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--ink)}
.hq-chips button span{font-family:var(--mono);font-weight:400;color:var(--muted);margin-left:3px}
.hq-chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hq-chips button[aria-pressed="true"] span{color:inherit;opacity:.7}
.hq-qlist{display:flex;flex-direction:column}
.hq-q{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 6px 10px 8px;border-top:1px solid var(--line);position:relative}
.hq-q:first-child{border-top:0}
.hq-q.sev-critical{background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 12%,transparent),transparent 60%)}
.hq-q.sev-critical::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--warn);border-radius:2px}
.hq-dot{width:9px;height:9px;border-radius:50%;background:var(--fc)}
.hq-qt{min-width:0}
.hq-qt b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hq-qt small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hq-sev{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.sev-critical .hq-sev{color:var(--warn);font-weight:600}.sev-high .hq-sev{color:var(--accent)}.sev-win .hq-sev{color:var(--ok)}
.hq-ftag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fc);border:1px solid color-mix(in srgb,var(--fc) 45%,transparent);border-radius:4px;padding:1px 6px}
.hq-acts{display:flex;gap:5px}
.hq-more{margin-top:8px;font-size:13px}
.hq-link{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.hq-link:first-of-type{border-top:0}
.hq-lp{display:flex;align-items:center;gap:3px}
.hq-lp i{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fc);border:1px solid color-mix(in srgb,var(--fc) 45%,transparent);border-radius:4px;padding:2px 5px;min-width:44px;text-align:center}
.hq-lp .xi{color:var(--muted)}
.hq-link b{display:block;font-size:13.5px;font-weight:600}
.hq-link small{display:block;font-size:12px;color:var(--muted)}
.hq-up .xu:last-child{border-bottom:0}
.hq-desks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:start}
.hq-desk{border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px;background:var(--surface);border-top:3px solid var(--fc,var(--line))}
.hq-dh{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;margin-bottom:10px}
.hq-dh .xi{grid-row:span 2;color:var(--fc,var(--gold-x))}
.hq-dh b{font-family:var(--serif);font-weight:500;font-size:17px}
.hq-dh small{font-size:12px;color:var(--muted)}
.hq-dp{display:flex;flex-direction:column}
.hq-dp button,.hq-dp a{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:6px 4px;border-top:1px solid var(--line);font-size:13px}
.hq-dp button:hover,.hq-dp a:hover{color:var(--fc,var(--gold-x))}
.hq-dp .xi{color:var(--muted)}

/* KPIs, lanes, mini tasks */
.hq-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.hq-kpi{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:13px 14px;min-width:0;border-top:3px solid var(--fc,var(--line))}
.hq-kpi .lbl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hq-kpi b{display:block;font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.15;margin:4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hq-kpi b small{font-family:var(--sans);font-size:12px;color:var(--muted)}
.hq-kpi small{display:block;font-size:12px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hq-kpi .progress{margin:0}
.hq-kpi b small{display:inline;margin:0 0 0 4px;font-size:13px}
.hq-lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hq-lane{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hq-lh{display:flex;align-items:center;gap:10px}
.hq-lh b{font-family:var(--serif);font-weight:500;font-size:17px}
.hq-lh .ib{margin-left:auto}
.hq-lane>p{margin:0;font-size:13px}
.hq-lane>small{font-size:12px}
.hq-mts{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:4px}
.hq-mt{display:grid;grid-template-columns:18px minmax(0,1fr);gap:4px 8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.hq-mt span{line-height:1.35}
.hq-mt .chip{grid-column:2;justify-self:start;font-size:11px}
@media (max-width:1280px){.hq-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.hq-wk{grid-template-columns:repeat(4,minmax(0,1fr))}.hb-flows{display:none}}
@media (max-width:1100px){.hq-grid{grid-template-columns:1fr}.hq-lanes{grid-template-columns:1fr}.hq-hero{grid-template-columns:1fr}.hq-map{justify-self:center;max-width:280px}}
.sbody{padding:4px 46px 14px 142px}.sbody .steps{margin:0 0 10px}.sbody textarea{min-height:56px;background:#FBF8F3}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.xhero-in{padding:16px}.xnum{font-size:84px}.xstrip{grid-template-columns:1fr 1fr}.xstat{padding:12px}.xstat b{font-size:16px}.xstat .xi.lg{display:none}.srow>details>summary{grid-template-columns:62px 3px minmax(0,1fr);padding-right:34px}.srow .pill{display:none}.srow time{font-size:10.5px}.stt{white-space:normal}.stt small{display:block}.sbody{padding:4px 12px 14px}.xbr{grid-template-columns:30px minmax(0,1fr) 30px}.xbr .nm,.xbr .cnt{display:none}.xlife,.xlife.big{grid-template-columns:repeat(2,minmax(0,1fr))}.xqa{grid-template-columns:repeat(2,minmax(0,1fr))}.xscore dl{grid-template-columns:auto auto auto auto}.xring.lg{width:92px;height:92px}.sched{padding:14px 12px}.xb3 .n{font-size:34px}}
@media (max-width:600px){.hq-hero{padding:18px 16px}.hq-q{grid-template-columns:10px minmax(0,1fr) auto}.hq-q .hq-ftag{display:none}.hq-q .hq-acts{grid-column:2/-1}.hq-link{grid-template-columns:minmax(0,1fr)}.hq-link .qbtn{justify-self:start}.hq-seg span{display:none}.hq-hr{font-size:9px}.hq-leg{display:none}.hq-grid .xpanel-h .muted.small{display:none}}

.ph{--ph-bg:var(--bg);--ph-card:var(--surface);--ph-line:var(--line);--ph-gold:var(--gold-x);min-height:100vh;min-height:100svh;background:var(--ph-bg);-webkit-user-select:none;user-select:none}

.ph.sub .ph-top{flex-wrap:wrap}
.ph-back{all:unset;cursor:pointer;flex:1 1 100%;display:flex;align-items:center;gap:4px;font:600 15px var(--sans);color:var(--ph-gold);margin:-2px 0 4px;font-size:22px;line-height:1}.ph-back span{font-size:15px}
.ph-r{display:flex;align-items:center;gap:8px;flex:none}
.ph-pre{font:600 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--ph-line);border-radius:4px;padding:3px 6px}
.ph-act,.ph-me{all:unset;cursor:pointer;box-sizing:border-box;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.ph-act{background:var(--ink);color:var(--bg)}.ph-act svg{width:20px;height:20px;stroke-width:2.2}
.ph-act:active,.ph-me:active{transform:scale(.94)}
.ph-av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:var(--rail);color:var(--ph-gold);border:1px solid var(--ph-line);font:500 16px var(--serif)}.ph-av img{width:100%;height:100%;object-fit:cover}
.ph-main{padding:16px 16px calc(96px + env(safe-area-inset-bottom))!important;animation:ph-in .18s ease-out}
@keyframes ph-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ph-main,.ph-sheet{animation:none!important}}

/* Tab bar: solid, five equal targets, a gold bar over the current tab. */
.ph-tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--rail);border-top:1px solid var(--rail-line);padding:0 4px env(safe-area-inset-bottom)}
.ph-tabs button{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;color:var(--rail-muted);font:600 10.5px/1 var(--sans);letter-spacing:.01em}
.ph-tabs svg{width:24px;height:24px;stroke-width:1.8}
.ph-tabs button[aria-current="page"]{color:var(--gold)}
.ph-tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--gold)}
.ph-tabs button:active{opacity:.6}
.ph-tabs i{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 10.5px/18px var(--sans);font-style:normal;text-align:center}

/* Building blocks */
.ph-sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 2px 8px}
.ph-sh h3{font:700 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ph-cnt{font:600 12px var(--sans);color:var(--muted)}
.ph-list{background:var(--ph-card);border:1px solid var(--ph-line);border-radius:14px;overflow:hidden}

.ph-row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;border-top:1px solid var(--ph-line);position:relative}

.ph-row .tt small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:2px}
.ph-row .tt small .dot{width:7px;height:7px;margin:0}
.ph-row.done .tt,.ph-row.done .tt b{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.ph-row.nav{cursor:pointer;min-height:54px}.ph-row.nav>svg{width:20px;height:20px;color:var(--ph-gold);flex:none}
.ph-row.nav:active,.ph-row .tt:active{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.ph-row .go{color:var(--muted);font-size:14px;white-space:nowrap}
.ph-row.danger .tt{color:var(--warn);text-align:center}
.ph-row.more{justify-content:center;color:var(--ph-gold);font:600 13.5px var(--sans);min-height:44px;cursor:pointer}
.ph-ck{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border:1.6px solid color-mix(in srgb,var(--muted) 70%,transparent);border-radius:7px;display:grid;place-items:center;cursor:pointer;background:transparent}
.ph-ck.round{border-radius:50%}
.ph-ck:checked{background:var(--ph-gold);border-color:var(--ph-gold)}
.ph-ck:checked::after{content:"";width:6px;height:11px;border:solid #17110D;border-width:0 2.4px 2.4px 0;transform:translateY(-1px) rotate(45deg)}
.ph-empty{margin:0;padding:18px 14px;border:1px dashed var(--ph-line);border-radius:14px;color:var(--muted);font-size:14px;text-align:center}
.ph-link{all:unset;cursor:pointer;color:var(--ph-gold);font:600 13.5px var(--sans);display:inline-block;margin:10px 2px 0}
.ph-sh .ph-link{margin:0}
.ph-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:var(--sunk);border:1px solid var(--ph-line);border-radius:11px}
.ph-seg button{all:unset;cursor:pointer;text-align:center;padding:8px 6px;border-radius:8px;font:600 13.5px var(--sans);color:var(--muted);white-space:nowrap}
.ph-seg button[aria-selected="true"]{background:var(--ph-card);color:var(--ink);box-shadow:0 1px 0 var(--ph-line),0 0 0 1px var(--ph-line)}
.ph-sel{appearance:none;-webkit-appearance:none;max-width:52%;border:1px solid var(--ph-line);background:var(--ph-card);border-radius:8px;padding:5px 26px 5px 10px;font:600 12.5px var(--sans);color:var(--ink);background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}

/* Today */
.ph-hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px;background:var(--rail);color:#F1EBE2;border-radius:16px;border:1px solid var(--rail-line)}
.ph-ring{display:grid;justify-items:center;gap:2px;color:var(--gold)}.ph-ring .xring{width:84px;height:84px}.ph-ring .xring text{font-size:28px}.ph-ring .xring tspan{font-size:14px}.ph-ring small{font:700 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--rail-muted)}
.ph-nn{display:grid;gap:0;min-width:0}
.ph-nn>div{padding:8px 0;min-width:0}.ph-nn>div+div{border-top:1px solid rgba(241,235,226,.12)}
.ph-nn span{display:block;font:700 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.ph-nn>div+div span{color:var(--rail-muted)}
.ph-nn b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:600 16px/1.25 var(--sans);margin-top:3px}
.ph-nn small{color:var(--rail-muted);font-size:12.5px}
.ph-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ph-meta span{font:600 12px var(--sans);padding:5px 10px;border-radius:7px;background:var(--ph-card);border:1px solid var(--ph-line);color:var(--muted)}
.ph-meta .late{color:var(--warn)}
.ph-row.b3 .n{flex:none;width:26px;font:500 22px/1 var(--serif);color:var(--ph-gold);text-align:center}
.ph-row.b3 .tt{cursor:default}
.ph-in{all:unset;flex:1;min-width:0;font:500 15.5px var(--sans);color:var(--ink);padding:6px 0}.ph-in::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent);font-weight:400}
.ph-row.blk{gap:10px}
.ph-row.blk time{flex:none;width:62px;font:600 12px var(--mono);color:var(--muted);letter-spacing:-.01em}
.ph-row.blk .bar{flex:none;align-self:stretch;height:auto;min-height:30px;overflow:visible;width:3px;border-radius:2px;background:var(--tc,var(--gold))}
.ph-row.blk .tt{cursor:default}
.ph-row.blk.now{background:color-mix(in srgb,var(--ph-gold) 12%,var(--ph-card))}
.ph-row.blk.now time{color:var(--ph-gold)}
.ph-row.blk .tt small{display:inline-block;margin-left:8px;font:700 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ph-gold)}
.ph-row.evr .tt small{display:block;margin:2px 0 0;font:400 12.5px var(--sans);letter-spacing:0;text-transform:none;color:var(--muted)}
.ph-row .ev{font:700 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ph-chips{display:flex;flex-wrap:wrap;gap:8px}
.ph-chip{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:10px;background:var(--ph-card);border:1px solid var(--ph-line);font:500 14px var(--sans);cursor:pointer}
.ph-chip input{display:none}
.ph-chip::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.ph-chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.ph-chip.on::before{background:var(--ph-gold);border-color:var(--ph-gold)}

/* Tasks */
.ph-quick{display:flex;gap:8px;margin-bottom:12px}
.ph-quick input{flex:1;min-width:0;height:48px;box-sizing:border-box;padding:0 14px;border-radius:12px;border:1px solid var(--ph-line);background:var(--ph-card);font:500 16px var(--sans);color:var(--ink);outline:0}
.ph-quick input:focus{border-color:var(--ph-gold)}
.ph-quick button{all:unset;cursor:pointer;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--ink);color:var(--bg)}.ph-quick svg{width:20px;height:20px;stroke-width:2.2}
.ph-x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);flex:none}.ph-x svg{width:16px;height:16px}

/* Calendar */
.ph-week{display:grid;grid-template-columns:24px 1fr 24px;align-items:end;gap:4px;margin-top:14px}
.ph-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.ph-wd small{display:block;font:700 10.5px var(--sans);color:var(--muted);margin-bottom:6px}
.ph-arw{all:unset;cursor:pointer;height:44px;display:grid;place-items:center;font-size:24px;color:var(--muted)}
.ph-dc{all:unset;cursor:pointer;box-sizing:border-box;position:relative;width:100%;height:44px;border-radius:10px;display:grid;place-items:center;font:600 16px var(--sans);color:var(--ink)}
.ph-dc i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ph-gold)}
.ph-dc.today{color:var(--ph-gold);box-shadow:inset 0 0 0 1.5px var(--ph-gold)}
.ph-dc.sel{background:var(--ink);color:var(--bg);box-shadow:none}.ph-dc.sel i{background:var(--bg)}
.ph-dc.out{color:color-mix(in srgb,var(--muted) 55%,transparent)}
.ph-mon{margin-top:14px;background:var(--ph-card);border:1px solid var(--ph-line);border-radius:14px;padding:6px 8px 10px}
.ph-mh{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center}.ph-mh b{font:500 18px var(--serif)}
.ph-mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.ph-mg small{font:700 10.5px var(--sans);color:var(--muted);padding:4px 0}
.ph-mg .ph-dc{height:40px;font-size:15px}

.ph-card.me{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:16px;background:var(--ph-card);border:1px solid var(--ph-line);border-radius:14px}
.ph-card.me .ph-av{width:52px;height:52px;border-radius:14px;font-size:22px}
.ph-card.me span:not(.ph-av){flex:1;min-width:0}.ph-card.me b{display:block;font:500 20px var(--serif)}.ph-card.me small{color:var(--muted);font-size:13px}
.ph-card.me .go{flex:none!important;color:var(--muted)}
.ph-trial{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;margin-top:10px;padding:13px 16px;border-radius:14px;background:var(--rail);color:#F1EBE2;border:1px solid var(--rail-line);font-size:14px}
.ph-trial b{color:var(--gold)}.ph-trial span{float:right;color:var(--gold);font-weight:600}

#phsheet{position:fixed;inset:0;z-index:60;pointer-events:none}

.ph-x.lg{width:36px;height:36px;border-radius:10px;background:var(--sunk)}
.ph-form{display:grid;gap:12px;margin-top:14px}
.ph-big{all:unset;box-sizing:border-box;width:100%;padding:14px 0;border-bottom:1.5px solid var(--ph-line);font:500 20px var(--sans);color:var(--ink)}.ph-big:focus{border-color:var(--ph-gold)}
.ph-fl{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ph-btn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;height:52px;line-height:52px;border-radius:12px;background:var(--ink);color:var(--bg);font:700 16px var(--sans);margin-top:4px}
.ph-btn:active{transform:scale(.985)}
.ph-btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ph-line)}.ph-btn.danger{color:var(--warn)}

.ph-main .panel{border-radius:14px;padding:16px;box-shadow:none}

.ph-main .grid2,.ph-main .grid3,.ph-main .grid4,.ph-main .stack{gap:10px}
.ph-main .grid2,.ph-main .grid3{grid-template-columns:1fr!important}
.ph-main .grid4{grid-template-columns:1fr 1fr!important}

.ph-main .btn{border-radius:10px}

.ph-main .tplbar{display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}.ph-main .tplbar .chip{flex:none;white-space:nowrap}
.ph .tabbar,.ph #pmenu{display:none!important}
.ph-hi{margin:0 2px 12px;font:500 15px var(--sans);color:var(--muted)}
.ph-save{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));z-index:70;transform:translate(-50%,-140%);padding:6px 12px;border-radius:8px;background:var(--ink);color:var(--bg);font:600 12px var(--sans);white-space:nowrap;pointer-events:none;opacity:0;transition:transform .2s,opacity .2s}

 <div class="panel"><h3>Coming up</h3>${up.length?up.slice(0,30).map(e=>`<div class="task"><span></span><div><span class="tt">${esc(e.data.title)}</span><small>${fmtLong(e.data.d)}${e.data.t?" · "+fmtT(e.data.t):""}${e.data.where?" · "+esc(e.data.where):""}</small></div><span></span><button class="ib" data-act="titemdel" data-id="${e.id}" aria-label="Delete">${svg("x")}</button></div>`).join(""):'<p class="empty">Nothing on the team calendar.</p>'}${past.length?`<p class="small muted" style="margin-top:12px">Recent: ${past.map(e=>esc(e.data.title)+" ("+fmtMD(e.data.d)+")").join(", ")}</p>`:""}</div></div>`}
function postRow(x){return`<div class="post ${x.data.pin?"pin":""}"><div class="row" style="justify-content:space-between"><b>${esc(mName(x.created_by))}</b><span class="small muted">${x.data.pin?"Pinned · ":""}${fmtAgo(x.created_at)}</span></div><p>${esc(x.data.text).replace(/\n/g,"<br>")}</p>${x.created_by===meId()||isAdmin()?`<div class="row" style="gap:12px">${isAdmin()?`<button class="linkbtn small" data-act="tpin" data-id="${x.id}">${x.data.pin?"Unpin":"Pin"}</button>`:""}<button class="linkbtn small" data-act="titemdel" data-id="${x.id}">Delete</button></div>`:""}</div>`}
function teamPosts(){const L=items("post").sort((a,b)=>(b.data.pin?1:0)-(a.data.pin?1:0)||(a.created_at<b.created_at?1:-1));
 return`<div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)"><div class="panel"><h3>Post to the team</h3><form data-form="teamPost" class="fgrid"><label class="fld full">Announcement<textarea class="txt" name="text" required placeholder="Wins, changes, reminders"></textarea></label><div class="full"><button class="btn solid" type="submit">Post</button></div></form></div><div class="panel"><h3>Announcements</h3>${L.length?L.map(postRow).join(""):'<p class="empty">Nothing posted yet.</p>'}</div></div>`}
function teamSops(){const L=items("sop").sort((a,b)=>a.data.title<b.data.title?-1:1);
 return`<div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)"><div class="panel"><h3>Write a playbook</h3><form data-form="teamSop" class="fgrid"><label class="fld full">Title<input class="txt" name="title" required placeholder="How we onboard a new client"></label><label class="fld full">Steps, one per line<textarea class="txt" name="steps" required rows="7"></textarea></label><label class="fld full">Who owns it<select class="txt" name="who">${memberOpts(meId())}</select></label><div class="full"><button class="btn solid" type="submit">Save playbook</button></div></form></div><div class="panel"><h3>Playbooks</h3>${L.length?L.map(x=>`<details class="sop" data-k="sop-${x.id}"><summary><b>${esc(x.data.title)}</b><span class="small muted">${x.data.who?esc(mName(x.data.who)):""}</span></summary><ol>${String(x.data.steps||"").split("\n").filter(s=>s.trim()).map(s=>`<li>${esc(s)}</li>`).join("")}</ol><button class="linkbtn small" data-act="titemdel" data-id="${x.id}">Delete</button></details>`).join(""):'<p class="empty">No playbooks yet. Start with the thing new people ask about most.</p>'}</div></div>`}
function teamGoals(){const L=items("goal");
 return`<div class="panel" style="margin-bottom:18px"><h3>Add a team goal</h3><form data-form="teamGoal" class="addrow" style="grid-template-columns:1fr 160px 140px auto;margin:0"><input class="txt" name="t" required placeholder="What the team is working toward" aria-label="Goal"><input class="txt" type="number" name="target" placeholder="Target number" aria-label="Target"><input class="txt" type="date" name="by" aria-label="By"><button class="btn solid" type="submit">Add</button></form></div>
 <div class="grid2">${L.length?L.map(x=>{const d=x.data,p=d.target?Math.min(1,(Number(d.now)||0)/d.target):0;return`<div class="panel"><div class="row" style="justify-content:space-between"><b>${esc(d.t)}</b><button class="ib" data-act="titemdel" data-id="${x.id}" aria-label="Delete">${svg("x")}</button></div><small class="muted">${d.by?"By "+fmtMD(d.by):""}${d.target?" · target "+Number(d.target).toLocaleString():""}</small><div class="row" style="margin-top:10px"><input class="txt" type="number" style="max-width:140px" data-act="tgoalnow" data-id="${x.id}" value="${esc(d.now||"")}" placeholder="Where we are" aria-label="Current">${bar(p)}<b>${Math.round(p*100)}%</b></div></div>`}).join(""):'<p class="empty">No team goals yet.</p>'}</div>`}
function teamPeople(){const T=S.team.team,adm=isAdmin();
 let h=`<div class="grid2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><div class="panel"><h3>People</h3>${S.team.members.map(m=>`<div class="task"><span class="av sm">${esc((m.name||m.email||"?")[0])}</span><div><span class="tt">${esc(m.name||m.email)}${m.user_id===meId()?" (you)":""}</span><small>${[m.title,m.email].filter(Boolean).map(esc).join(" · ")} · joined ${fmtMD(iso(new Date(m.joined_at)))}</small></div>${adm&&m.role!=="owner"&&m.user_id!==meId()&&cloud()?`<select class="txt" style="width:auto;padding:5px 8px" data-act="trole" data-id="${esc(m.user_id)}" aria-label="Role"><option value="member" ${m.role==="member"?"selected":""}>Member</option><option value="admin" ${m.role==="admin"?"selected":""}>Admin</option></select><button class="ib" data-act="tremove" data-id="${esc(m.user_id)}" aria-label="Remove from team">${svg("x")}</button>`:`<span class="pill">${ROLE[m.role]}</span><span></span>`}</div>`).join("")}</div>`;
 h+=`<div class="stack">${adm&&cloud()?`<div class="panel"><h3>Invite</h3><div class="codebox"><b>${esc(T.code)}</b><button class="btn sm" data-act="copy" data-v="${esc(inviteLink())}">Copy invite link</button></div><p class="small muted" style="margin:10px 0 0">Anyone with the code can join. <button class="linkbtn" data-act="trotate">Make a new code</button> to stop the old one working.</p></div>`:""}<div class="panel"><h3>Your title on the team</h3><form data-form="teamTitle" class="addrow" style="grid-template-columns:1fr auto;margin:0"><input class="txt" name="title" value="${esc((S.team.members.find(m=>m.user_id===meId())||{}).title||core().profile.title||"")}" aria-label="Title"><button class="btn" type="submit">Save</button></form></div>${S.team.role!=="owner"&&cloud()?`<div class="panel"><h3>Leave the team</h3><p class="small" style="margin:0 0 10px">Your own DaySilk stays. You lose access to this portal.</p><button class="btn danger" data-act="tleave">Leave ${esc(T.name)}</button></div>`:""}</div></div>`;
 return h}

/* ===== 07-mail.js ===== */
/* ---------- Inbox: every email account in one place. Gmail and Outlook connect with their own sign-in; iCloud, Yahoo, AOL,
   Zoho and any other provider connect over IMAP with an app password. Passwords and tokens are sealed on the server. ---------- */
const PROVIDERS=[
 ["google","Gmail or Google Workspace","oauth"],["microsoft","Outlook, Hotmail or Microsoft 365","oauth"],
 ["icloud","iCloud Mail","imap","https://support.apple.com/en-us/102654"],["yahoo","Yahoo Mail","imap","https://help.yahoo.com/kb/SLN15241.html"],
 ["aol","AOL Mail","imap","https://help.aol.com/articles/Create-and-manage-app-password"],["zoho","Zoho Mail","imap","https://www.zoho.com/mail/help/adminconsole/two-factor-authentication.html#alink5"],
 ["gmailpw","Gmail with an app password","imap","https://support.google.com/accounts/answer/185833"],["imap","Any other email (IMAP)","imap"]];
const PV=Object.fromEntries(PROVIDERS.map(p=>[p[0],p]));
if(!S.mail)S.mail={accounts:null,cfg:null,list:null,errs:[],acc:"all",open:null,unread:0,loading:false,connect:""};
async function mailInit(force){if(EMB_CLIENT)return;const M=S.mail;if(!cloud()||!S.user)return;if(M.accounts&&!force)return;
 try{const[cfg,acc]=await Promise.all([api("/api/mail/config"),api("/api/mail/accounts")]);M.cfg=cfg;M.accounts=acc.accounts||[]}catch(e){M.cfg={error:e.code==="not_configured"?"not_configured":e.message};M.accounts=[]}
 if(M.accounts.length)mailFetch()}
async function mailFetch(){if(EMB_CLIENT)return;const M=S.mail;M.loading=true;if(S.view==="mail")paint();
 try{const j=await api("/api/mail/inbox?account="+encodeURIComponent(M.acc));M.list=j.messages||[];M.errs=j.errors||[];M.unread=M.list.filter(x=>x.unread).length;M.at=Date.now()}catch(e){M.errs=[{error:e.message}];M.list=M.list||[]}
 M.loading=false;paint()}
function vMail(){const M=S.mail;
 let h=head("Inbox","Inbox","Every email account in one inbox. Reply from here, or turn an email into a task.");
 if(!cloud())return h+`<div class="panel"><p class="small" style="margin:0">Email connects once you have a DaySilk account. Gmail, Outlook, iCloud, Yahoo, AOL, Zoho and any IMAP provider work.</p></div>`;
 if(!M.accounts){mailInit();return h+`<p class="empty">Loading your accounts…</p>`}
 h+=tabs("mail",[["inbox","Inbox"+(M.unread?" ("+M.unread+")":"")],["compose","Write"],["accounts","Accounts ("+M.accounts.length+")"]]);
 if(S.tabs.mail==="accounts"||!M.accounts.length)return h+mailAccounts();
 if(S.tabs.mail==="compose")return h+mailCompose();
 return h+mailInbox()}
function mailInbox(){const M=S.mail,l=M.list||[];
 let h=`<div class="row" style="margin-bottom:14px"><select class="txt" style="width:auto" data-act="macc" aria-label="Account"><option value="all">All accounts</option>${M.accounts.map(a=>`<option value="${esc(a.id)}" ${M.acc===a.id?"selected":""}>${esc(a.address)}</option>`).join("")}</select><button class="btn sm" data-act="mrefresh" ${M.loading?"disabled":""}>${M.loading?"Checking…":"Check mail"}</button>${M.at?`<span class="small muted">Updated ${fmtAgo(M.at)}</span>`:""}</div>`;
 M.errs.forEach(e=>{const a=M.accounts.find(x=>x.id===e.acc);h+=`<p class="authmsg err">${a?esc(a.address)+": ":""}${esc(e.error)}${e.relink?` <button class="linkbtn" data-act="mconnect" data-v="${esc(a.provider)}">Reconnect</button>`:""}</p>`});
 if(M.open){const m=M.open;return h+`<div class="panel mailopen"><button class="linkbtn" data-act="mclose">‹ Back to inbox</button><h3 style="margin-top:12px">${esc(m.subject||"(no subject)")}</h3><p class="small muted" style="margin:0">From <b>${esc(m.fromName||m.from)}</b> ${m.fromName?"&lt;"+esc(m.from)+"&gt;":""} · ${m.date?new Date(m.date).toLocaleString():""}${m.to?"<br>To "+esc(m.to):""}</p><div class="mailbody">${m.loading?"Loading…":esc(m.text||"").replace(/\n/g,"<br>")}</div>
  <form data-form="mreply" class="fgrid" style="margin-top:16px"><label class="fld full">Reply<textarea class="txt" name="text" rows="5" required></textarea></label><div class="full row"><button class="btn solid" type="submit">Send reply</button><button class="btn" type="button" data-act="mtask">Make it a task</button></div></form></div>`}
 if(!l.length)return h+`<p class="empty">${M.loading?"Checking your mail…":"No messages."}</p>`;
 const multi=M.accounts.length>1&&M.acc==="all";
 return h+`<div class="panel mlist">${l.map((m,i)=>{const a=M.accounts.find(x=>x.id===m.acc);return`<button class="mrow ${m.unread?"unread":""}" data-act="mopen" data-i="${i}"><span class="mfrom">${esc(m.fromName||m.from)}</span><span class="msub"><b>${esc(m.subject||"(no subject)")}</b> <span class="muted">${esc(m.snippet||"")}</span></span><span class="mdate">${multi&&a?`<span class="pill">${esc(a.address.split("@")[1]||"")}</span> `:""}${m.date?fmtAgo(m.date):""}</span></button>`}).join("")}</div>`}
function mailCompose(){const M=S.mail;return`<div class="panel"><form data-form="msend" class="fgrid"><label class="fld">From<select class="txt" name="acc">${M.accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.address)}</option>`).join("")}</select></label><label class="fld">To<input class="txt" type="email" name="to" required multiple></label><label class="fld full">Subject<input class="txt" name="subject"></label><label class="fld full">Message<textarea class="txt" name="text" rows="9" required></textarea></label><div class="full"><button class="btn solid" type="submit">Send</button></div></form></div>`}
function mailAccounts(){if(EMB_CLIENT)return;const M=S.mail,cfg=M.cfg||{},c=M.connect;
 if(cfg.error==="not_configured")return`<p class="authmsg err">Email isn't switched on for this DaySilk yet. The site owner needs to add MAIL_SEAL_KEY and SUPABASE_SERVICE_ROLE_KEY in Netlify.</p>`;
 let h=M.accounts.length?`<div class="panel" style="margin-bottom:18px"><h3>Connected</h3>${M.accounts.map(a=>`<div class="task"><span class="av sm">${svg("mail")}</span><div><span class="tt">${esc(a.address)}</span><small>${esc((PV[a.provider]||[0,"Email"])[1])} · connected ${fmtMD(iso(new Date(a.created_at)))}</small></div><span></span><button class="btn sm danger" data-act="mremove" data-id="${esc(a.id)}">Disconnect</button></div>`).join("")}</div>`:`<p class="lead" style="margin-top:-6px">Connect your first email account. You can add as many as you like.</p>`;
 h+=`<div class="provs">${PROVIDERS.map(([k,n,kind])=>{const off=kind==="oauth"&&!cfg[k];return`<button class="opt" data-act="mconnect" data-v="${k}" aria-pressed="${c===k}" ${off?"disabled":""}><b>${n}</b><small>${off?"Not switched on yet":kind==="oauth"?"Sign in with "+(k==="google"?"Google":"Microsoft"):"Uses an app password"}</small></button>`}).join("")}</div>`;
 if(c&&PV[c]&&PV[c][2]==="imap"){const p=PV[c],other=c==="imap";
  h+=`<div class="panel" style="margin-top:18px"><h3>Connect ${esc(p[1])}</h3><p class="small" style="margin:0 0 12px">${other?"Use the IMAP and SMTP settings from your email provider.":"Your normal password won't work here. Create an app password for DaySilk, then paste it below."}${p[3]?` <a href="${p[3]}" target="_blank" rel="noopener">How to make an app password</a>`:""}</p><form data-form="mimap" class="fgrid"><input type="hidden" name="provider" value="${c}"><label class="fld">Email address<input class="txt" type="email" name="address" required autocomplete="off"></label><label class="fld">App password<input class="txt" type="password" name="password" required autocomplete="new-password"></label>${other?`<label class="fld">IMAP server<input class="txt" name="host" required placeholder="imap.example.com"></label><label class="fld">IMAP port<input class="txt" type="number" name="port" value="993"></label><label class="fld">SMTP server<input class="txt" name="smtpHost" required placeholder="smtp.example.com"></label><label class="fld">SMTP port<input class="txt" type="number" name="smtpPort" value="465"></label><label class="fld full">Username, if it isn't the email address<input class="txt" name="user" autocomplete="off"></label>`:""}<div class="full"><button class="btn solid" type="submit">Test and connect</button></div></form><p class="small muted" style="margin:10px 0 0">DaySilk checks the sign-in, then stores the password encrypted on the server. It's never shown again, and you can disconnect at any time.</p></div>`}
 return h}

Object.assign(ACT,{
 mrefresh:()=>mailFetch(),
 mopen:async b=>{const M=S.mail,m=M.list[+b.dataset.i];if(!m)return;M.open={...m,loading:true};if(m.unread){m.unread=false;M.unread=Math.max(0,M.unread-1)}paint();window.scrollTo(0,0);
  try{const j=await api(`/api/mail/message?account=${encodeURIComponent(m.acc)}&id=${encodeURIComponent(m.id)}`);M.open={...m,...j,loading:false}}catch(e){M.open={...m,text:"Couldn't open this email: "+e.message,loading:false}}paint()},
 mclose:()=>{S.mail.open=null;paint()},
 mtask:()=>{const m=S.mail.open;core().tasks.push({id:uid(),title:"Reply: "+(m.subject||m.from),due:todayIso(),pillar:"work",done:false,note:"From "+(m.fromName||m.from)});markDirty("core");toast("Added to today's tasks")},
 mconnect:async b=>{const k=b.dataset.v,M=S.mail;if(PV[k]&&PV[k][2]==="oauth"){try{const j=await api("/api/mail/oauth/start",{body:{provider:k,back:location.origin+location.pathname+"?v=mail"}});location.href=j.url}catch(e){toast(e.message)}return}M.connect=M.connect===k?"":k;S.tabs.mail="accounts";paint()},
 mremove:async b=>{if(!confirm("Disconnect this account? DaySilk deletes its saved sign-in."))return;try{await api("/api/mail/accounts?id="+encodeURIComponent(b.dataset.id),{method:"DELETE"});S.mail.accounts=null;S.mail.list=null;await mailInit(true);paint()}catch(e){toast(e.message)}}
});
Object.assign(CHG,{macc:el=>{S.mail.acc=el.value;S.mail.open=null;mailFetch()}});
Object.assign(FORM,{
 mimap:async(f,v)=>{const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Checking…";
  try{await api("/api/mail/connect",{body:{provider:v("provider"),address:v("address"),password:f.elements.password.value,host:v("host"),port:v("port"),smtpHost:v("smtpHost"),smtpPort:v("smtpPort"),user:v("user")}});S.mail.connect="";S.mail.accounts=null;S.tabs.mail="inbox";await mailInit(true);toast("Connected")}
  catch(e){toast(e.message);btn.disabled=false;btn.textContent="Test and connect"}},
 msend:async(f,v)=>{try{await api("/api/mail/send",{body:{account:v("acc"),to:v("to"),subject:v("subject"),text:f.elements.text.value}});f.reset();toast("Sent");S.tabs.mail="inbox";paint()}catch(e){toast("Not sent: "+e.message)}},
 mreply:async(f,v)=>{const m=S.mail.open;try{await api("/api/mail/send",{body:{account:m.acc,to:m.replyTo||m.from,subject:/^re:/i.test(m.subject||"")?m.subject:"Re: "+(m.subject||""),text:f.elements.text.value,inReplyTo:m.messageId||"",threadId:m.threadId||""}});toast("Reply sent");S.mail.open=null;paint()}catch(e){toast("Not sent: "+e.message)}}
});

/* ---------- Plan and billing ---------- */
const STATUS={trial:"Free trial",active:"Active",past_due:"Payment due",canceled:"Canceled",member:"Included with your team"};
function trialLeft(){const a=S.acct;if(!a||!a.trial_ends)return null;return Math.max(0,Math.ceil((new Date(a.trial_ends)-Date.now())/864e5))}
async function billingCfg(){if(S.bill||!cloud())return;S.bill={};try{S.bill=await api("/api/billing/config")}catch(_){S.bill={enabled:false}}paint()}
const priceLine=k=>k==="member"?"Included":money(PRICE[k])+" / "+PLANS[k].per;
function planCards(cur,act){return`<div class="plans">${["personal","pro","executive","team"].map(k=>{const p=PLANS[k];return`<div class="plan ${cur===k?"on":""}"><span class="eyebrow">${p.side==="business"?"Business":"Personal"}</span><h3>${p.n}</h3><div class="price">${money(PRICE[k])}<small> / ${p.per}</small></div><p class="small muted">${p.tag}</p><ul>${p.feats.map(f=>`<li>${esc(f)}</li>`).join("")}</ul><button class="btn ${cur===k?"":"solid"}" data-act="${act}" data-v="${k}" ${cur===k&&act!=="pickplan"?"disabled":""}>${cur===k?(act==="pickplan"?"Choose "+p.n:"Your plan"):act==="pickplan"?"Choose "+p.n:"Switch to "+p.n}</button></div>`}).join("")}</div>`}
function vBilling(){billingCfg();const a=S.acct||{},k=planOf(),left=trialLeft(),B=S.bill||{};
 let h=head("Account","Plan and billing",`You're on <b>${esc(PLANS[k].n)}</b> · ${esc(STATUS[a.status]||"Preview")}${a.status==="trial"&&left!=null?` · ${left} day${left===1?"":"s"} left`:""}.`);
 if(k==="member")return h+`<div class="panel"><p class="small" style="margin:0">Your company pays for your DaySilk. Your own pages stay private to you, even from your company.</p></div>`;
 if(cloud()&&B.enabled){h+=`<div class="panel" style="margin-bottom:22px"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${a.status==="active"?"Your subscription":"Keep DaySilk after your trial"}</h3><p class="small muted" style="margin:4px 0 0">${a.status==="active"?"Change your card, see invoices or cancel in the billing portal.":"Add a card now. You're charged "+priceLine(k)+" when the trial ends."}</p></div>${a.status==="active"||a.stripe_customer?`<button class="btn" data-act="bportal">Manage billing</button>`:`<button class="btn gold" data-act="bcheckout" data-v="${k}">Add a card</button>`}</div>${k==="team"?`<label class="fld" style="margin-top:12px;max-width:200px">Seats<input class="txt" type="number" min="1" max="500" data-scope="core" data-path="settings.seats" value="${esc(core().settings.seats||(S.team?S.team.members.length:5))}"></label>`:""}</div>`}
 else if(cloud())h+=`<p class="authmsg">Card payments aren't switched on yet, so every plan runs as a free trial for now.</p>`;
 if(a.status!=="active"&&a.status!=="member")h+=`<div class="panel" style="margin-bottom:22px"><h3>Have an access code?</h3><p class="small muted" style="margin:0 0 12px">A code gives you full access for a set time, usually 14 days.</p><form data-form="redeem" class="row" style="gap:10px;flex-wrap:wrap"><input class="txt" name="code" autocomplete="off" autocapitalize="characters" placeholder="DS-XXXX-XXXX" style="max-width:260px;text-transform:uppercase" required><button class="btn" type="submit">Use code</button></form></div>`;
 return h+planCards(k,"switchplan")+`<p class="small muted" style="margin-top:14px">Prices in US dollars. Switching to a business plan adds a few work questions so DaySilk can build your work system.</p>`}
// Access codes give N days (14 by default). A code typed at sign-up waits in "pending" until the plan is picked.
async function redeemCode(code){code=String(code||"").trim().toUpperCase();if(!code)return false;
 if(!cloud()){toast("Access codes work once you're signed in");return false}
 const{data,error}=await sb.rpc("ds_redeem_code",{p_code:code});if(error){toast(error.message);return false}
 S.acct=data;const left=trialLeft();toast(`Code accepted: ${left} day${left===1?"":"s"} of full access`);return true}
async function choosePlan(k){const c=core();c.plan=k;markDirty("core");
 if(cloud()){const{data,error}=await sb.rpc("ds_choose_plan",{p_plan:k});if(error){toast(error.message);return false}S.acct=data}else S.acct={...(S.acct||{}),plan:k,status:"trial",trial_ends:new Date(Date.now()+TRIAL_DAYS*864e5).toISOString()};
 const pc=pending().code;if(pc){setPending({code:""});await redeemCode(pc)}
 lsSave();return true}

 h+=`<div class="grid2"><div class="stack"><div class="panel"><h3>Appearance</h3><div class="chips">${[["auto","Match my device"],["light","Light"],["dark","Dark"]].map(x=>`<button class="chip" data-act="theme" data-v="${x[0]}" aria-pressed="${(c.settings.theme||"auto")===x[0]}">${x[1]}</button>`).join("")}</div></div><div class="panel"><h3>Your data</h3><p class="small" style="margin:0 0 12px">Download everything DaySilk holds for you as one file.</p><button class="btn" data-act="export">Download my data</button></div></div>`;

 h+=`<div class="grid4" style="margin-top:14px">${["personal","pro","executive","team"].map(k=>`<div class="stat"><span class="eyebrow">${PLANS[k].n}</span><b>${cnt(a=>a.plan===k)}</b></div>`).join("")}</div>`;
 const C=D.codes||[],now=Date.now();

 <div class="panel" style="overflow:auto"><h3>Access codes</h3>${C.length?`<table class="tbl"><thead><tr><th>Code</th><th>Days</th><th>Used</th><th>Expires</th><th>Note</th><th></th></tr></thead><tbody>${C.map(x=>{const dead=(x.expires_at&&new Date(x.expires_at)<now)||x.uses>=x.max_uses;return`<tr${dead?' class="muted"':""}><td><code>${esc(x.code)}</code> <button class="linkbtn" data-act="copycode" data-v="${esc(x.code)}">Copy</button></td><td>${x.days}</td><td>${x.uses} of ${x.max_uses}</td><td>${x.expires_at?fmtMD(iso(new Date(x.expires_at))):"Never"}</td><td>${esc(x.note||"")}</td><td><button class="linkbtn" data-act="delcode" data-v="${esc(x.code)}">Delete</button></td></tr>`}).join("")}</tbody></table>`:'<p class="empty">No codes yet.</p>'}</div></div>`;
 h+=`<div class="panel" style="margin-top:18px;overflow:auto"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Plan</th><th>Status</th><th>Signed up</th><th>Setup</th></tr></thead><tbody>${L.map(a=>`<tr><td>${esc(a.name||"")}</td><td>${esc(a.email||"")}</td><td>${esc((PLANS[a.plan]||{}).n||a.plan||"")}</td><td>${esc(STATUS[a.status]||a.status||"")}</td><td>${fmtMD(iso(new Date(a.created_at)))}</td><td>${a.onboarded?"Done":"Not yet"}</td></tr>`).join("")}</tbody></table></div>`;
 return h}

/* ===== 08-phone.js ===== */
/* ---------- Phone app ----------
   On a phone DaySilk runs as its own app shell, not a shrunk website: five tabs (Today, Calendar, Tasks, Work or Wellness,
   You), a title bar with one action, and sheets that rise from the bottom for adding and editing. Command Center and Today
   are one screen here. Everything else (Wellness, Life, Inbox, Team, account pages) lives under You. Desktop is unchanged. */
const PHONE_MQ=window.matchMedia("(max-width:820px)");
const isPhone=()=>PHONE_MQ.matches;
let wasPhone=isPhone();
PHONE_MQ.addEventListener("change",()=>{if(isPhone()!==wasPhone){wasPhone=isPhone();if(S.core&&core().onboarded&&!S.flow)paint()}});

// Pages that hang off the You tab, and which tab a page belongs to.
const PH_UNDER={health:"you",life:"you",mail:"you",team:"you",billing:"you",profile:"you",settings:"you",admin:"you",tmpl:"cal"};
function phTabs(){const pages=pagesNow().map(p=>p[0]),fourth=isBiz()&&pages.includes("work")?["work","Work","work"]:["health","Wellness","health"];
 return[["today","Today","today"],["cal","Calendar","cal"],["tasks","Tasks","tasks"],fourth,["you","You","user"]]}
function phTabOf(v){const T=phTabs().map(t=>t[0]);return T.includes(v)?v:PH_UNDER[v]||"today"}
function phAllowed(v){return v==="you"||v==="tmpl"||[...pagesNow(),...accountNow()].some(p=>p[0]===v)}

const phAv=P=>`<span class="ph-av">${P.photo?`<img src="${esc(P.photo)}" alt="">`:esc((P.first||"?")[0])}</span>`;
const phSec=(t,right)=>`<div class="ph-sh"><h3>${t}</h3>${right||""}</div>`;
const phSeg=(key,list,cur)=>`<div class="ph-seg" role="tablist">${list.map(([k,l])=>`<button role="tab" aria-selected="${cur===k}" data-act="phseg" data-k="${key}" data-v="${k}">${l}</button>`).join("")}</div>`;

function phoneShell(){const c=core(),P=c.profile,t=todayIso();
 if(S.view==="command")S.view="today";if(!phAllowed(S.view))S.view="today";
 const v=S.view,tab=phTabOf(v),under=PH_UNDER[v]&&!phTabs().some(x=>x[0]===v);
 const due=c.tasks.filter(x=>!x.done&&x.due&&x.due<=t).length;
 const views={today:["Today",phToday,fmtLong(t)],cal:["Calendar",phCal,MON[parse(S.calSel||t).getMonth()]+" "+parse(S.calSel||t).getFullYear()],tasks:["Tasks",phTasks,""],you:["You",phYou,""],tmpl:["Day templates",calTemplates,""]};
 const def=views[v]||(()=>{const p=[...pagesNow(),...accountNow()].find(x=>x[0]===v);return[p[1],p[3],""]})();
 const add=["today","cal","tasks"].includes(v)?`<button class="ph-act" data-act="phadd" data-m="${v==="cal"?"event":"task"}" aria-label="${v==="cal"?"Add an event":"Add a task"}">${svg("plus")}</button>`:"";
 const right=add+(v==="today"?`<button class="ph-me" data-act="go" data-v="you" aria-label="You">${phAv(P)}</button>`:"");
 const top=`<header class="ph-top${v==="today"?" big":""}">${under?`<button class="ph-back" data-act="go" data-v="${PH_UNDER[v]}">‹ <span>${PH_UNDER[v]==="cal"?"Calendar":"You"}</span></button>`:""}<div class="ph-tt">${def[2]?`<small>${esc(def[2])}</small>`:""}<h1>${esc(def[0])}</h1></div><div class="ph-r">${cloud()?"":`<span class="ph-pre">Preview</span>`}${right}</div></header>`;
 const tabs=`<nav class="ph-tabs" aria-label="Main">${phTabs().map(([k,l,ic])=>`<button data-act="go" data-v="${k}" ${tab===k?'aria-current="page"':""}>${svg(ic)}<span>${l}</span>${k==="tasks"&&due?`<i>${due}</i>`:""}</button>`).join("")}</nav>`;
 return`<div class="ph v-${v}${under?" sub":""}">${top}<main id="main" class="ph-main">${def[1]()}</main>${tabs}${phSheet()}</div>`}

/* Today: the Command Center and Today merged. Score and Now/Next, Big 3, the schedule, habits, what's due. Nothing else. */
function phToday(){const c=core(),s=todayIso();S.date=s;const d=day(s),b=blocksFor(s),sc=dayScore(s),nn=nowNext(s),T=c.templates[tmplFor(s)],tr=trainingOn(s);
 const due=c.tasks.filter(x=>!x.done&&x.due&&x.due<=s).sort((a,z)=>a.due<z.due?-1:1);
 let h=`<p class="ph-hi">${greet()}, ${esc(c.profile.first||"there")}.</p><section class="ph-hero"><div class="ph-ring">${xring(sc,"","Daily score")}<small>Score</small></div><div class="ph-nn"><div><span>Now</span><b>${esc(nn.cur?nn.cur.title:"Free time")}</b><small>${nn.cur?fmtT(nn.cur.time):"Nothing on the clock"}</small></div><div><span>Next</span><b>${esc(nn.next?nn.next.title:"Day complete")}</b><small>${nn.next?fmtT(nn.next.time):"Rest well"}</small></div></div></section>`;
 h+=`<div class="ph-meta"><span>${esc(T?T.n:"Open day")}</span>${tr?`<span>${esc(c.train.type||"Workout")} ${fmtT(trainTime())}</span>`:""}${due.length?`<span class="late">${due.length} due</span>`:""}</div>`;
 // Big 3: type straight into an empty line, tick it when it's done.
 const hints=["The one thing that moves work forward","Something for your health or home","Something for someone you love"];
 h+=phSec("Big 3")+`<div class="ph-list">${d.big.map((x,i)=>`<div class="ph-row b3 ${x.done?"done":""}"><span class="n">${i+1}</span>${x.t&&!S.editBig?`<span class="tt">${esc(x.t)}</span><input type="checkbox" class="ph-ck" aria-label="Done: ${esc(x.t)}" data-scope="day" data-path="big.${i}.done" ${x.done?"checked":""}>`:`<input class="ph-in" data-scope="day" data-path="big.${i}.t" value="${esc(x.t)}" placeholder="${hints[i]}" aria-label="Big 3 number ${i+1}">`}</div>`).join("")}</div>${d.big.some(x=>x.t)?`<button class="ph-link" data-act="editbig">${S.editBig?"Done editing":"Edit Big 3"}</button>`:""}`;
 // Schedule: from now on by default; earlier blocks fold away.
 if(b.length){const m=nowMin(),cur=nn.cur,idx=cur?b.indexOf(b.find(x=>x.id===cur.id)):b.findIndex(x=>x.time&&tMin(x.time)>m),cut=S.phEarly||idx<=0?0:idx,shown=b.slice(cut);
  h+=phSec("Schedule",`<select class="ph-sel" data-act="daytmpl" aria-label="Day template">${Object.entries(c.templates).map(([k,t])=>`<option value="${k}" ${k===tmplFor(s)?"selected":""}>${esc(t.n)}</option>`).join("")}</select>`);
