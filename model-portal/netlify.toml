[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/model/password/finalize"
  to = "/.netlify/functions/model-password-finalize"
  status = 200
  force = true

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/public-config"
  status = 200
  force = true

[[redirects]]
  from = "/api/storage/download-url"
  to = "/.netlify/functions/storage-download-url"
  status = 200
  force = true

[[redirects]]
  from = "/api/model/bootstrap"
  to = "/.netlify/functions/model-legacy-gateway?endpoint=/api/model/bootstrap"
  status = 200
  force = true

[[redirects]]
  from = "/api/model/directory"
