      var script=document.createElement('script');script.src=src;script.async=false;
      script.onload=function(){resolve(src);};script.onerror=function(){script.remove();reject(new Error('Asset failed: '+src));};

      catch(e){last=e;console.warn('[VEUX Model 16.9.6] Supabase CDN failed',cdns[i]);}
    }
    throw last||new Error('Secure login library could not load.');
  }
  async function boot(){
    var body=document.querySelector('#login .lg-body');

      await loadSupabase();
