# VEUX DESK 16.9.17 — new model profiles created in the Agency Portal.
# Existing model routes above remain explicit. This non-forced one-segment
# fallback validates the published MOGY profile before proxying its
# individual maison-{route}.netlify.app site, so new routes do not require
# another main-site deploy after their individual model site goes live.
[[redirects]]
  from = "/:profile"
  to = "/.netlify/functions/model-profile-router?profile=:profile"
  status = 200
  force = false
