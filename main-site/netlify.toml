[build]
  publish = "public"
  functions = "netlify/functions"

# Maison de Veux — main public site
# Portal entry paths connect to independent VEUX DESK apps.
# Agent /admin is reverse-proxied so the Maison domain remains in the browser;
# Model and MA portals retain their independent browser handoffs.

# VEUX DESK 16.9.24 — branded Agent Portal mount.
# /admin is a reverse proxy, not a redirect, so the Maison URL remains in the browser.

[[redirects]]
  from = "/admin/*"
  to = "https://maison-agent.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "https://maison-agent.netlify.app/"
  status = 200
  force = true

# Keep /team as a transition-safe handoff. Once Agent 16.9.24 is live,
# the Agent origin immediately moves the browser to branded /admin.
[[redirects]]
  from = "/team"
  to = "https://maison-agent.netlify.app/"
  status = 302
  force = true

# Agent Portal API calls are root-absolute in the browser. Keep them on the branded
# host and proxy them to the Agent deployment. More specific public package routes
# below remain explicit documentation of the client package contract.

# 16.9.27 — public Get Scouted intake is owned by the Agent Functions runtime
# while remaining same-origin on maisondeveux.com.
[[redirects]]
  from = "/api/public/forms/get-scouted"
  to = "https://maison-agent.netlify.app/api/public/forms/get-scouted"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://maison-agent.netlify.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://maison-agent.netlify.app/health"
  status = 200
  force = true

# Model Portal stays branded on /portal while proxying the independent Model app.
[[redirects]]
  from = "/portal/*"
  to = "https://maison-models.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/portal"
  to = "https://maison-models.netlify.app/"
  status = 200
  force = true

# Mother Agency Portal stays branded on /ma while proxying the independent MA app.
[[redirects]]
  from = "/ma/*"
  to = "https://maison-ma.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ma"
  to = "https://maison-ma.netlify.app/"
  status = 200
  force = true

# Private client model packages remain on the branded domain while the
# authenticated Agent application owns the secure package functions/viewer.
[[redirects]]
  from = "/p/*"
  to = "https://maison-agent.netlify.app/p/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/package"
  to = "https://maison-agent.netlify.app/api/public/package"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/package/feedback"
  to = "https://maison-agent.netlify.app/api/public/package/feedback"
  status = 200
  force = true

