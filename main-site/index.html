<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Maison de Veux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #efe9df;       /* bone */
    --ink-dim: #cfc6b6;   /* dimmed bone */
    --black: #0a0908;     /* near-black overlay base */
    --brass: #a9895f;     /* warm ash-brass accent */
    --hairline: rgba(239,233,223,0.28);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    width:100%;
    overflow:hidden;
    background: var(--black);
  }

  body{
    font-family: 'Jost', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .stage{
    position: relative;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
  }

  .bg-video{
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    z-index: 0;
    filter: saturate(0.92) contrast(1.03);
    opacity: 0;
    animation: video-in 2.4s ease-out 0.2s forwards;
  }

  @keyframes video-in{
    from{ opacity: 0; }
    to{ opacity: 1; }
  }

  .veil{
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse 70% 60% at 50% 46%, rgba(10,9,8,0.38) 0%, rgba(10,9,8,0.12) 45%, rgba(10,9,8,0.55) 100%),
      linear-gradient(180deg, rgba(10,9,8,0.42) 0%, rgba(10,9,8,0.05) 26%, rgba(10,9,8,0.10) 60%, rgba(10,9,8,0.58) 100%);
    pointer-events: none;
  }

  .curtain{
    position: absolute;
    inset: 0;
    z-index: 3;
    background: var(--black);
    pointer-events: none;
    animation: liftCurtain 2.2s ease-in 0.2s forwards;
  }

  @keyframes liftCurtain{
    0%{ opacity: 1; }
    100%{ opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .curtain{ animation: none; opacity: 0; }
  }

  .content{
    position: relative;
    z-index: 2;
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 6vw;
  }

  .wordmark{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(40px, 9vw, 108px);
    letter-spacing: 0.06em;
    line-height: 1;
    margin-top: 22px;
    color: var(--ink);
    opacity: 0;
    animation: rise 1.3s ease-out 0.35s forwards;
  }

  .wordmark em{
    font-style: italic;
    font-weight: 300;
    color: var(--ink-dim);
  }

  .rule{
    width: 1px;
    height: 32px;
    background: var(--hairline);
    opacity: 0;
    animation: grow 1s ease-out 0.9s forwards;
  }

  @keyframes grow{
    from{ height: 0; opacity: 0; }
    to{ height: 32px; opacity: 1; }
  }

  .gateway{
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: clamp(20px, 5vw, 40px);
    opacity: 0;
    animation: rise 1.1s ease-out 1.1s forwards;
  }

  .city-link{
    position: relative;
    display: inline-block;
    text-decoration: none;
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 500;
    font-size: clamp(13px, 1.7vw, 17px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 10px 4px;
    transition: color 0.4s ease, letter-spacing 0.4s ease;
  }

  .city-link::after{
    content:"";
    position:absolute;
    left: 4px; right: 4px; bottom: 6px;
    height: 1px;
    background: var(--brass);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  .city-link:hover{
    color: var(--brass);
    letter-spacing: 0.36em;
  }
  .city-link:hover::after{ transform: scaleX(1); }

  .city-link:focus-visible{ outline: 1px solid var(--brass); outline-offset: 6px; }

  .city-link:active{ transform: translateY(1px); }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 560px){
    .gateway{
      flex-direction: column;
      gap: 22px;
    }
    .rule{ width: 40px; height: 1px; }
    @keyframes grow{ from{ width:0; opacity:0;} to{ width:40px; opacity:1;} }
  }

  @media (prefers-reduced-motion: reduce){
    .wordmark, .rule, .gateway{
      animation: none !important;
      opacity: 1 !important;
      height: auto !important;
    }
  }

  /* Disable image drag / drag-ghost across the site */
  img{
    -webkit-user-drag: none;
    -khtml-user-drag: none;
    -moz-user-drag: none;
    -o-user-drag: none;
    user-drag: none;
    -webkit-touch-callout: none;
  }
</style>
<link rel="stylesheet" href="/assets/mdv-mobile-certification-16.9.29.css?v=16.9.29">
<link rel="stylesheet" href="/assets/mdv-interaction-system-16.9.30.css?v=16.9.30">
</head>
<body>

<div class="stage">
  <video class="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="https://video.wixstatic.com/video/043cd4_f63acc41c6744a88905e5ac14b5d8c2d/1080p/mp4/file.mp4" type="video/mp4">
  </video>

  <div class="veil"></div>
  <div class="curtain"></div>

  <div class="content">
    <h1 class="wordmark">Maison <em>de</em> Veux</h1>

    <nav class="gateway" aria-label="Select region">
      <a class="city-link" href="/newyork">New York</a>
      <div class="rule"></div>
      <a class="city-link" href="/paris">Paris</a>
    </nav>
  </div>

</div>


<script>
  // Disable right-click save and image dragging across the site
  document.addEventListener('contextmenu', function(e){
    if(e.target.tagName === 'IMG'){ e.preventDefault(); }
  });
  document.querySelectorAll('img').forEach(function(img){ img.setAttribute('draggable', 'false'); });
</script>
</body>
</html>
